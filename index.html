pt\n  ORDER BY s.student_id;\nEND;\nGO\nEXEC GetStudentsByDepartment @dept=10;\n\n@dept is the input parameter and 10 is the argument. Comparing s.department_id to @dept filters by the supplied department. Comparing the column to itself would accept every non-NULL department.", "criteria": ["Define a named procedure with a typed parameter and reject NULL.", "Filter the qualified column against the parameter and order the returned rows.", "Show the call for 10 and explain parameter, argument and the self-comparison error."]}, {"title": "Build and trace a factorial loop", "prompt": "Write a PostgreSQL DO block that computes factorial for n=4, validates n is between 0 and 12 inclusive, and reports the answer with RAISE NOTICE. Trace i and product. Explain the zero case and the upper bound.", "answer": "DO $$\nDECLARE n int := 4; i int := 1; product int := 1;\nBEGIN\n  IF n IS NULL OR n<0 OR n>12 THEN\n    RAISE EXCEPTION 'Use 0 through 12';\n  END IF;\n  WHILE i<=n LOOP\n    product := product*i;\n    i := i+1;\n  END LOOP;\n  RAISE NOTICE 'Factorial = %', product;\nEND; $$;\n\nThe products after i=1,2,3,4 are 1,2,6,24. i then becomes 5 and the loop stops. With n=0 no multiplication runs and product stays 1. The upper bound avoids overflow of the int product because 13! exceeds its range.", "criteria": ["Validate NULL and range and initialize counter and product correctly.", "Provide a terminating loop and correct trace to 24.", "Explain 0! and integer overflow, and show how the result is reported."]}, {"title": "Return rows through a PostgreSQL cursor", "prompt": "Assume Students exists in the public schema. Write a PostgreSQL procedure that accepts a department ID and refcursor name, opens the cursor for matching rows, and show BEGIN/CALL/FETCH/COMMIT for department 20. Explain why FETCH must occur before COMMIT for this ordinary cursor.", "answer": "CREATE PROCEDURE public.students_by_department(IN p_dept int, IN result refcursor)\nLANGUAGE plpgsql AS $$\nBEGIN\n  OPEN result FOR SELECT s.* FROM public.Students s\n    WHERE s.department_id=p_dept ORDER BY s.student_id;\nEND; $$;\nBEGIN;\nCALL public.students_by_department(20,'dept_rows');\nFETCH ALL FROM dept_rows;\nCOMMIT;\n\nThe refcursor argument supplies the name dept_rows. OPEN binds it to the filtered query. FETCH retrieves the rows. COMMIT closes this ordinary transaction-scoped cursor, so fetching afterward would fail. PostgreSQL resolves unquoted Students to students.", "criteria": ["Declare both typed parameters and open the cursor on a correctly filtered query.", "Show BEGIN, CALL with 20, FETCH and COMMIT in the correct order.", "Explain the cursor handle and its transaction lifetime."]}, {"title": "Validate and reserve stock", "prompt": "Stock(id,qty) has (1,3). Describe or write a PostgreSQL procedure that accepts a positive quantity, atomically reduces stock if enough remains, and raises an error when zero rows are updated. Show caller transaction handling for requests of 2 and then 4.", "answer": "Validate wanted IS NOT NULL AND wanted>0. Execute UPDATE Stock SET qty=qty-wanted WHERE id=1 AND qty>=wanted. Immediately test FOUND; if false, RAISE EXCEPTION 'Insufficient stock'. The caller runs BEGIN, CALL reserve(2), COMMIT and stock becomes 1. A second BEGIN/CALL reserve(4) raises an error. The caller then executes ROLLBACK and stock remains 1. The procedure need not commit independently.", "criteria": ["Reject NULL and nonpositive input before changing data.", "Use a guarded UPDATE and detect zero affected rows immediately with FOUND.", "Give both transaction outcomes and preserve the earlier committed reservation."]}], "choices": [["A procedure tests WHERE instructor_id = instructor_id. Why might it return lessons for every instructor?", ["The parameter is too small.", "The column is compared with itself.", "The table has a primary key."], 1, "Qualify the table column and compare it with a separately named parameter."], ["A factorial loop handles inputs 0–10. Which initial product works for 0?", ["NULL", "0", "1"], 2, "The loop runs zero times for 0, and 0! equals 1."], ["A factorial loop starts product at 0. What happens for n=4?", ["The product remains 0.", "The result is 24.", "The counter cannot advance."], 0, "Multiplying zero by each factor leaves zero. The product must start at 1."], ["An ordinary PostgreSQL cursor was opened inside a transaction that has now committed. What happens on a later FETCH?", ["It returns all rows again.", "It starts a new query automatically.", "It fails because that cursor is closed."], 2, "An ordinary cursor lasts only for the transaction that opened it."]]}, {"terms": [{"term": "Concurrency", "definition": "Overlap in the execution of multiple transactions against a database.", "example": "Two shoppers try to reserve the final item at the same time."}, {"term": "Schedule", "definition": "The ordered sequence of read, write and other operations from transactions, preserving the order within each transaction.", "example": "A reads X, B reads X, A writes X, B writes X is an interleaved schedule."}, {"term": "Lost update", "definition": "An anomaly in which one write overwrites another transaction's change without incorporating it.", "example": "Two sessions read score 10 and each writes 11, losing one of two intended increments."}, {"term": "Dirty read", "definition": "Reading a value written by another transaction that has not committed.", "example": "A report uses an uncommitted balance of 70 that later rolls back to 100."}, {"term": "Inconsistent analysis", "definition": "Combining observations from different database states into a misleading result.", "example": "Reading account A before a transfer and B after it produces a total that never existed."}, {"term": "Atomic increment", "definition": "A single update that increases a value based on the row value as part of the database operation.", "example": "UPDATE Score SET points=points+1 avoids computing two stale replacement values in client code."}, {"term": "Snapshot", "definition": "A consistent view of data for a statement or transaction, according to the isolation behavior of the DBMS.", "example": "One SELECT can calculate both account balances from the same statement snapshot."}, {"term": "Read Committed", "definition": "An isolation level that prevents dirty reads but can allow different statements in one transaction to see different committed states.", "example": "Two separate balance reads can observe values from before and after a transfer."}, {"term": "Serial schedule", "definition": "A schedule in which one transaction finishes before the next transaction starts.", "example": "Execute all of A, then all of B."}, {"term": "Serializable schedule", "definition": "A schedule whose observable result is equivalent, under the chosen equivalence definition, to some serial execution.", "example": "Interleaved operations on independent data can be equivalent to A followed by B."}, {"term": "Conflicting operations", "definition": "Operations from different transactions on the same data item where at least one operation writes.", "example": "A reading X before B writes X is a conflict. Two reads of X do not conflict."}, {"term": "Conflict serializability", "definition": "The property that a schedule can be transformed into a serial schedule by swapping adjacent nonconflicting operations.", "example": "A precedence graph with only A → B is conflict-serializable in order A then B."}, {"term": "Precedence graph", "definition": "A directed graph with transactions as nodes and an edge from the earlier to the later transaction for each conflicting operation pair.", "example": "A writes X before B reads X creates A → B."}, {"term": "Cycle", "definition": "A directed path that returns to its starting node. In a precedence graph it rules out conflict serializability.", "example": "A → B → A requires each transaction to precede the other."}, {"term": "Topological order", "definition": "An ordering of the nodes of an acyclic directed graph in which every edge points forward.", "example": "For A → B and A → C, A,B,C or A,C,B is a valid serial order."}, {"term": "Shared lock", "definition": "A read lock that can coexist with other shared locks on the same resource but conflicts with an exclusive lock.", "example": "Two readers can both hold shared locks on X."}, {"term": "Exclusive lock", "definition": "A lock used to protect writes, conflicting with another transaction's shared or exclusive lock on the same resource.", "example": "A writer holding an exclusive lock on a seat can block another locker of that seat."}, {"term": "Two-phase locking (2PL)", "definition": "A locking protocol with a growing phase that acquires locks and a shrinking phase that releases locks, with no new lock acquisition after the first release.", "example": "A transaction locks X and Y, then unlocks X and may no longer acquire a new lock on Z."}, {"term": "Strict 2PL", "definition": "A form of two-phase locking that retains exclusive locks until the transaction commits or aborts.", "example": "Other transactions cannot acquire a conflicting lock on a written item before the writer finishes."}, {"term": "Blocking", "definition": "Waiting because another transaction holds an incompatible lock on a required resource.", "example": "B waits for A's exclusive lock on X, then proceeds when A commits."}, {"term": "Deadlock", "definition": "A cycle of transactions waiting for resources held by each other, preventing progress without intervention.", "example": "A holds X and waits for Y, while B holds Y and waits for X."}, {"term": "Wait-for graph", "definition": "A graph whose edge points from a transaction currently waiting to the transaction holding the needed incompatible lock.", "example": "A waiting for B's lock creates A → B, regardless of their earlier read/write order."}, {"term": "Deadlock victim / rollback", "definition": "A transaction selected to abort so its locks can be released and a wait cycle can be broken.", "example": "Abort B, release its lock on Y and allow A to continue."}, {"term": "Timestamp ordering", "definition": "Concurrency control that assigns transaction timestamps and rejects operations violating the required timestamp order.", "example": "An older transaction may restart when its proposed write is incompatible with an already accepted newer read."}, {"term": "Optimistic concurrency control", "definition": "A method that reads and computes speculatively, validates for conflicts, then installs accepted changes.", "example": "An editor checks that row version 5 is still current before saving."}, {"term": "Validation phase", "definition": "The optimistic-control stage that checks whether a transaction can commit its proposed changes without an unacceptable conflict.", "example": "A changed row version makes validation fail and triggers a retry."}], "essays": [{"title": "Identify and repair three anomalies", "prompt": "Name and explain each problem. (a) A and B read score 10 and both write 11. (b) B reads A’s uncommitted change, then A rolls back. (c) A report reads one account before a transfer and the other afterward. Give an appropriate remedy for each.", "answer": "(a) Lost update. The expected two increments yield 12, but a stale replacement overwrites one. Use an atomic increment, or protect/validate the whole read–modify–write sequence. (b) Dirty read. B observed work that never committed. Prevent uncommitted reads using an appropriate isolation level such as Read Committed. (c) Inconsistent analysis. The total combines different states. Use one statement snapshot or a suitable consistent transaction snapshot for all reads.", "criteria": ["Correctly name all three anomalies.", "Explain the specific unsafe sequence and its consequence in each case.", "Give a matching remedy that protects the whole necessary operation or view."]}, {"title": "Build a precedence graph", "prompt": "The schedule is rA(X), wB(X), wA(Y), rB(Y), where r means read and w means write. List the conflicts, draw their edges and decide conflict serializability. Then add wB(Z) before rA(Z) and explain how the conclusion changes.", "answer": "Original conflicts are rA(X) before wB(X) and wA(Y) before rB(Y). Both give A → B. The graph is acyclic and serial order A then B preserves these conflicts. Adding wB(Z) before rA(Z) creates B → A. Together with A → B this is a cycle, so the modified schedule is not conflict-serializable.", "criteria": ["Identify both original same-item read/write conflicts and their direction.", "Give the acyclic graph and serial order A then B.", "Identify the added reverse edge and explain why the resulting cycle changes the result."]}, {"title": "Distinguish blocking, deadlock and 2PL", "prompt": "A locks X exclusively and B requests X. Later consider a different case where A holds X and requests Y while B holds Y and requests X. Explain each case, draw wait edges, give a deadlock remedy, and explain whether strict 2PL eliminates all deadlocks.", "answer": "In the first case B waits for A, giving B → A. This alone is blocking and may resolve when A commits. In the second case A → B and B → A form a wait cycle, so it is a deadlock. A detector can roll back one victim and release its locks. Acquiring locks in a consistent global order can prevent this pattern. Strict 2PL holds exclusive locks until commit or abort and ensures conflict serializability with 2PL, but deadlocks remain possible.", "criteria": ["Distinguish one-way blocking from the two-way wait cycle and give correct wait edges.", "Give a concrete recovery or prevention method.", "Define strict 2PL correctly and explain that it still permits deadlocks."]}, {"title": "Choose an optimistic conflict response", "prompt": "Two editors both read a row with version 5. A saves a new value and changes the version to 6. B attempts to save using its old version 5. Explain optimistic read, validation and write phases, what B must do, and how timestamp ordering differs.", "answer": "Both editors read and prepare changes privately. At validation, a conditional save for A matches version 5 and publishes the new value with version 6. B’s version check now fails, so its stale replacement must not be accepted. B must reread version 6 and recompute or ask to resolve the conflicting changes before retrying. Timestamp ordering instead imposes a transaction-age order and checks operations for compatibility with that order. It can reject and restart operations that violate it.", "criteria": ["Describe the optimistic read, validation and write phases.", "Reject B’s stale update and describe a retry based on fresh data.", "Explain timestamp ordering as ordering transactions by timestamps, rather than this version-check scenario alone."]}], "choices": [["A report reads one balance before a transfer and another after it. What went wrong?", ["Lost update", "Dirty write", "Inconsistent analysis"], 2, "The total mixes different database states."], ["In basic 2PL, what follows the first unlock?", ["Only further releases or actions using held locks", "A new growing phase", "Automatic deadlock recovery"], 0, "The transaction has entered its shrinking phase."], ["Which pair from different transactions on the same item does not conflict?", ["Read and read", "Read and write", "Write and write"], 0, "Read/read ordering cannot change the stored value or either read result by itself."], ["Basic 2PL enters its shrinking phase after which event?", ["The transaction begins.", "Its first lock release.", "Its first read."], 1, "After releasing any lock it may release more, but may not acquire new locks."]]}, {"terms": [{"term": "Database recovery", "definition": "Restoring a valid database state after failure using surviving data and recovery records.", "example": "Reapply a missing committed update and remove an unfinished update after a crash."}, {"term": "Data page", "definition": "A block of database storage read or written as a unit, often cached in memory before being flushed to disk.", "example": "A modified balance can be in a memory page before the corresponding disk page is updated."}, {"term": "Transaction log / journal", "definition": "An ordered record of transaction actions and outcomes used for recovery.", "example": "A log can record START T1, an X update and COMMIT T1."}, {"term": "Before-image", "definition": "The value of an item before a logged change.", "example": "For X:4→7, the before-image is 4."}, {"term": "After-image", "definition": "The value of an item after a logged change.", "example": "For X:4→7, the after-image is 7."}, {"term": "Commit record", "definition": "A log record indicating that a transaction completed successfully.", "example": "COMMIT T1 distinguishes finished T1 from a transaction still active at the crash."}, {"term": "Transaction failure", "definition": "Failure or cancellation of one transaction, requiring removal of its unfinished effects.", "example": "A constraint violation causes a booking transaction to roll back."}, {"term": "System crash", "definition": "Loss of running processes or volatile memory while persistent database and log files may survive.", "example": "A power failure loses cached pages that had not reached disk."}, {"term": "Media failure", "definition": "Damage or loss of persistent storage containing database files or logs.", "example": "A destroyed disk requires recovery from a surviving copy elsewhere."}, {"term": "UNDO / backward recovery", "definition": "Reversing effects that must be removed, typically using before-images in the stated recovery model.", "example": "Undo an unfinished Y:2→5 change to restore Y=2."}, {"term": "REDO / forward recovery", "definition": "Reapplying effects that must survive, typically using after-images in the stated recovery model.", "example": "Redo a missing committed X:4→7 change to restore X=7."}, {"term": "Write-ahead logging (WAL)", "definition": "The rule that required log records become durable before their changed data page is written, with required commit log records flushed before acknowledging a durable commit.", "example": "A page containing X=7 can be written only after its corresponding recovery information is safely logged."}, {"term": "Checkpoint", "definition": "A recorded recovery milestone that helps limit restart work and describes the necessary recovery state, including relevant active work.", "example": "A transaction active at a checkpoint can still need rollback if it never commits."}, {"term": "Deferred update", "definition": "A recovery approach that keeps unfinished updates from reaching database data pages before commit.", "example": "Committed changes missing from disk may need REDO, while unfinished data-page changes need no UNDO under this model."}, {"term": "Immediate update", "definition": "A recovery approach that allows changed data pages to reach disk before transaction commit.", "example": "Both UNDO of unfinished changes and REDO of missing committed changes may be required."}, {"term": "Shadow paging", "definition": "A recovery approach that keeps an unchanged page mapping while writing a new version separately, publishing the version by an atomic durable root switch.", "example": "Before the switch, the old root still locates the previous committed pages."}, {"term": "Root pointer", "definition": "The reference identifying the page mapping that represents the current committed version in shadow paging.", "example": "Switching the durable root publishes the new page set."}, {"term": "Backup", "definition": "A separately retained copy of database data usable as a restoration starting point.", "example": "A 09:00 backup restores the base state after a disk failure."}, {"term": "Archived log", "definition": "A retained log segment used to replay changes beyond a backup or support other recovery needs.", "example": "Replay committed sales recorded after the 09:00 backup."}, {"term": "Flush / stable storage", "definition": "Flushing writes buffered information to the storage layer with the persistence guarantees required by the recovery protocol.", "example": "A durable commit flushes its required log records before reporting success."}], "essays": [{"title": "Recover an immediate-update crash", "prompt": "Under immediate update, T1 changes X from 4 to 7 and commits. T2 changes Y from 2 to 5 and is unfinished at the crash. Disk holds X=4 and Y=5. State the recovery actions, values and ACID properties involved.", "answer": "REDO T1’s missing committed change using X’s after-image 7. UNDO T2’s unfinished change using Y’s before-image 2. The recovered values are X=7 and Y=2. Redo protects durability for committed T1. Undo protects atomicity by removing unfinished T2. The decision depends on the commit records and the stated disk contents.", "criteria": ["Classify T1 as committed and T2 as unfinished.", "Use the correct images, operations and final values.", "Connect REDO to durability and UNDO to atomicity under the stated model."]}, {"title": "Explain log order and reverse undo", "prompt": "A transaction writes price 10→12 and then 12→15 without committing. Both writes reach disk. Explain the WAL ordering needed before those page writes, then show the order of UNDO and its final result.", "answer": "Before a changed page is written, its required log record must be durable. The log therefore preserves the recovery images for both changes even if the process crashes. Undo the newest change first, restoring 15 to 12 using its before-image. Then undo the older change, restoring 12 to 10. Final price is 10. Undoing these records forward would wrongly finish at 12.", "criteria": ["State that required log information must reach durable storage before the corresponding data page.", "Undo in reverse order with the correct before-images.", "Give final 10 and explain why forward-order undo is wrong."]}, {"title": "Compare recovery strategies", "prompt": "Compare deferred update, immediate update
