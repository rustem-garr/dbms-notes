<div class="shell"><header><button class="mobile" id="menu" aria-expanded="false" aria-controls="rail">☰ Topics</button><span>Notes <em>/</em> <strong id="crumb">Study map</strong></span><span class="edition">Database systems</span></header><main id="main" tabindex="-1"></main><footer>Database Notes </footer></div><script>const lessons=[{"title":"Database design","subtitle":"Entities, attributes & relationships","mc":[["Each ticket requires one event. An event may have no tickets. Which constraint belongs on Ticket.event_id?",["UNIQUE alone","A nullable foreign key","A NOT NULL foreign key"],2,"Many tickets may repeat an event ID. Every ticket must reference an existing event."],["A player wears a different number on each team. Where does the number belong?",["Player","Team","TeamMembership"],2,"The number describes one player on one team."]],"exam":["A clinic stores doctors, patients, and visits. A patient may see the same doctor twice on the same day. Each visit has one doctor, one patient, a time and a fee. Give the tables, keys, and cardinalities.","Doctor(doctor_id PK, name)\nPatient(patient_id PK, name)\nVisit(visit_id PK, doctor_id NOT NULL FK → Doctor, patient_id NOT NULL FK → Patient, visit_time, fee)\nEach doctor or patient has 0..many visits. Each visit has exactly one of each. The visit ID distinguishes repeat encounters.",["Identify both parent entities and their keys.","Give Visit its own identifier, time and fee.","Use both required foreign keys and state both cardinalities."]],"frames":[["One reader","Reader","reader_id  ·  7","name  ·  Ada","A row represents one thing. Ada is one reader. Her ID stays the same even if her name changes."],["Two loans","Loan","loan_id  ·  31     reader_id  ·  7","loan_id  ·  32     reader_id  ·  7","Two loan rows can point to reader 7. The loan ID identifies the loan. The repeated reader ID tells us who borrowed each book."],["Read both ends","Reader  1   ───   0..*  Loan","For one reader  ·  zero or many loans","For one loan  ·  exactly one reader","Read across from one object. A new reader may have zero loans. Each loan must point back to exactly one reader."]],"demo":"Follow a book loan"},{"title":"Transactions","subtitle":"COMMIT, ROLLBACK & ACID","mc":[["The database confirms a sale and then loses power. Which property preserves the sale?",["Atomicity","Durability","Isolation"],1,"Durability protects committed work through a crash."],["Which command keeps earlier work in the same transaction pending while undoing later work?",["ROLLBACK TO SAVEPOINT","COMMIT","ROLLBACK without a savepoint"],0,"A savepoint is a marker inside a still-open transaction."]],"exam":["A concert has one seat left. A purchase must claim one seat and insert one booking. Give the transaction steps. Explain what happens if no seat remains and if the insert fails.","BEGIN. Run UPDATE Show SET seats = seats - 1 WHERE show_id = :id AND seats > 0. Require exactly one updated row. If zero, roll back and report sold out. Insert the booking. If the insert succeeds, commit. On failure, roll back the decrement as well. The conditional update guards the last seat and atomicity keeps booking and inventory together.",["Guard the decrement and check one row changed.","Place the booking and the decrement in one transaction.","Commit only on success and roll back either failure."]],"frames":[["Start","Before the transfer","Jar A   ●●●●●   5","Jar B   ●●   2","Seven marbles in total. Start one transaction for the whole transfer."],["Move","Inside the transaction","Jar A   ●●●   3","Jar B   ●●●●   4","The two updates are visible to the transaction. They still belong to one unfinished job."],["Roll back","After ROLLBACK","Jar A   ●●●●●   5","Jar B   ●●   2","Rollback restores 5 and 2. If the transaction had committed instead, the saved values would be 3 and 4."]],"demo":"Move two marbles"},{"title":"Standard SQL","subtitle":"Tables, joins & grouped reports","mc":[["Which clause removes employees before a department average is calculated?",["HAVING","WHERE","ORDER BY"],1,"WHERE filters individual input rows."],["Which statement adds a column to an existing table?",["UPDATE","INSERT INTO","ALTER TABLE"],2,"Changing columns changes the table definition."]],"exam":["Project(id, name) and Work(project_id, hours) record time entries. Show project ID, name and total hours for projects with at least two entries of 3 or more hours. Sort by total descending, then ID. Write the query.","SELECT p.id, p.name, SUM(w.hours) AS total\nFROM Project AS p\nJOIN Work AS w ON w.project_id = p.id\nWHERE w.hours >= 3\nGROUP BY p.id, p.name\nHAVING COUNT(*) >= 2\nORDER BY total DESC, p.id;",["Join on the project key and filter entries before grouping.","Group by project and calculate SUM(hours).","Keep groups with at least two qualifying entries and sort as requested."]],"frames":[["Rows","Work log","Atlas   3 h    ·    Atlas   5 h","Beacon   1 h    ·    Beacon   2 h","The question asks for projects with at least six total hours. Start with individual work entries."],["Group","GROUP BY project","Atlas     3 + 5 = 8 h","Beacon    1 + 2 = 3 h","Grouping makes one bucket per project. SUM adds the hours inside each bucket."],["Filter","HAVING SUM(hours) >= 6","Atlas      8 h","1 matching group","HAVING checks the finished group totals. A WHERE condition on a single work entry would answer a different question."]],"demo":"Build a grouped report"},{"title":"Stored procedures","subtitle":"Parameters, decisions & loops","mc":[["A procedure tests WHERE instructor_id = instructor_id. Why might it return lessons for every instructor?",["The parameter is too small.","The column is compared with itself.","The table has a primary key."],1,"Qualify the table column and compare it with a separately named parameter."],["A factorial loop handles inputs 0–10. Which initial product works for 0?",["NULL","0","1"],2,"The loop runs zero times for 0, and 0! equals 1."]],"exam":["Lesson(lesson_id, instructor_id, fee) stores driving lessons. Write a SQL Server procedure to return one instructor’s lessons, reject a missing or nonpositive instructor ID, and demonstrate a call for instructor 12.","CREATE PROCEDURE GetLessons @instructor INT\nAS\nBEGIN\n  IF @instructor IS NULL OR @instructor <= 0\n    THROW 50001, 'Positive instructor ID required', 1;\n  SELECT lesson_id, instructor_id, fee\n  FROM Lesson AS l WHERE l.instructor_id = @instructor;\nEND;\nGO\nEXEC GetLessons @instructor = 12;",["Declare a named procedure with a typed input.","Reject NULL or nonpositive input before the query.","Filter by the parameter and show a valid call for 12."]],"frames":[["Input","GetStudentsByDepartment","Input    department ID = 10","Students   Ada · 10    Bo · 20    Lia · 10","The caller supplies 10. The input parameter gives that value a name inside the procedure."],["Filter","WHERE department_id = @dept","Ada · 10     ✓","Bo · 20      ×      Lia · 10     ✓","Compare the table column with the input. Comparing the column to itself would let every non-NULL department through."],["Return","Matching students","Ada    department 10","Lia    department 10","SQL Server can send this SELECT directly to the caller. In the PostgreSQL exercise, a cursor holds the result until you fetch it."]],"demo":"Call a procedure"},{"title":"Concurrency control","subtitle":"Schedules, locks & deadlocks","mc":[["A report reads one balance before a transfer and another after it. What went wrong?",["Lost update","Dirty write","Inconsistent analysis"],2,"The total mixes different database states."],["In basic 2PL, what follows the first unlock?",["Only further releases or actions using held locks","A new growing phase","Automatic deadlock recovery"],0,"The transaction has entered its shrinking phase."]],"exam":["Schedule: A reads X, B writes X, A writes Y, B reads Y. List all conflict edges, decide whether the schedule is conflict-serializable, and give a serial order if possible.","Both pairs concern the same item with at least one write. A reads X before B writes it, and A writes Y before B reads it. Both give A → B. There is no reverse edge and no cycle. The equivalent serial order is A then B.",["Find both conflicting pairs.","Give their common direction and identify the acyclic graph.","Give A then B as an equivalent serial order."]],"frames":[["Read","Score = 10","Session A reads 10","Session B reads 10","Both players score one point. Each session plans to write the number it read, plus one."],["Write","Two writes","A writes 11","B writes 11","The second write replaces the first. The final score is 11, but two points should produce 12."],["Protect","One increment per turn","A adds 1 to the current score → 11","B adds 1 to the current score → 12","Use an atomic UPDATE score = score + 1. For a longer read–decide–write sequence, lock before reading or validate a version and retry."]],"demo":"Catch a lost update"},{"title":"Database recovery","subtitle":"Logs, checkpoints, UNDO & REDO","mc":[["Which record must reach stable storage before its changed data page?",["Its write-ahead log record","The next checkpoint","Every other transaction’s commit"],0,"The log must contain enough recovery information before the page is written."],["A storage drive and the only local log are physically destroyed. What can restore the information?",["A local rollback","A previous SELECT statement","A surviving backup and available archived logs"],2,"Media loss requires a surviving copy of the data."]],"exam":["In an immediate-update system, T1 changes X from 4 to 7 and commits. T2 changes Y from 2 to 5 and is active at the crash. The disk has X=4 and Y=5. Give the recovery action for each and the final values.","REDO T1 using X’s after-value, 7, because its committed update is missing from disk. UNDO T2 using Y’s before-value, 2, because the uncommitted change reached disk. Final state: X=7 and Y=2.",["Classify T1 as committed and T2 as unfinished.","Use REDO with 7 and UNDO with 2.","State both final values and explain why."]],"frames":[["Log","Before the crash","T1   A: 5 → 8    COMMIT","T2   B: 4 → 9    no commit","Suppose this immediate-update system may write unfinished changes to disk or leave committed changes only in memory."],["Crash","Disk after power loss","A = 5    committed update missing","B = 9    unfinished change reached disk","The log survived. Read the commit records before deciding which values belong in the recovered database."],["Recover","Consistent result","REDO T1    A = 8","UNDO T2    B = 4","Use T1’s after-value to restore the saved work. Use T2’s before-value to remove the unfinished work."]],"demo":"Recover two changes"},{"title":"Query optimization","subtitle":"Plans, filters & algebra trees","mc":[["Which operation chooses columns?",["Selection","Projection","Join"],1,"Projection narrows each row to the requested columns."],["Which input can safely receive salary > 90000 before an inner join of Staff and Office?",["Office alone","Neither input","Staff, where salary is stored"],2,"A predicate using only Staff columns can filter that input."]],"exam":["Sale(shop_id, amount) joins Shop(id, region). Return sale amounts for East-region shops. Sketch or describe a tree from the leaves up, move work earlier, and explain why the answer stays the same.","Shop → select region = East → project id. Sale → project shop_id, amount. Join on Shop.id = Sale.shop_id. At the root project amount. The region test uses only Shop. Both join keys survive until the join, and amount survives to output. Preserve multiplicities for SQL SELECT.",["Push the region condition down to Shop.","Keep both join keys and amount until needed.","Join on matching keys, then return amount and justify equivalence."]],"frames":[["Start","Join first","Customer     1,000 rows","Orders       8,000 rows","Imagine a report that only needs orders from Chicago customers. A simple plan joins first and checks the city afterward."],["Filter early","Select customers","Customer     1,000 → 80 rows","Keep rows where city = Chicago","For this inner join, the city test uses only Customer. Move it to that input so fewer customer rows reach the join."],["Keep keys","Project the needed columns","Customer      customer_id, name","Orders        customer_id, total","Keep the join key on both sides until the match is complete. Then the final projection can return just the requested output columns."]],"demo":"Shrink a join"}];
const guides=[{"deck":"A library keeps one row per reader and one row per loan. IDs connect them so the library can record a new loan without copying the reader’s details.","body":"<section class=\"reading\"><h2>A relational database starts with tables</h2><p>Picture two lists at a library. One lists people who have library cards. The other lists books they borrowed. A <b>relational database</b> organizes facts into tables called relations. A <b>row</b> (tuple) describes one occurrence. A <b>column</b> (attribute) holds one kind of fact. A database management system such as PostgreSQL stores the tables and enforces their rules.</p><div class=\"tbl-scroll\"><table><caption>Reader · one row per person</caption><thead><tr><th scope=\"col\">reader_id</th><th scope=\"col\">name</th></tr></thead><tbody><tr><td>7</td><td>Ada</td></tr><tr><td>8</td><td>Bo</td></tr></tbody></table></div><p>The first row says that reader 7 is named Ada. There are two readers and two attributes. Adding a reader creates another row. Adding a date_of_birth column gives every reader a place for that fact.</p></section><section class=\"reading\"><h2>Primary keys give rows an identity</h2><p>A <b>primary key (PK)</b> is the column, or smallest chosen combination of columns, that uniquely identifies each row. Its values cannot be missing (NULL). Two readers can both be named Ada, so a name is a poor identifier. Reader 7 and reader 8 remain distinct even if their names match.</p><p>A <b>foreign key (FK)</b> is a column or group of columns whose non-null values must match a referenced key. In Loan, reader_id refers back to Reader.reader_id. The same value may appear in many loan rows.</p><div class=\"tbl-scroll\"><table><caption>Loan · one row per borrowing</caption><thead><tr><th scope=\"col\">Loan.loan_id (PK)</th><th scope=\"col\">Loan.reader_id (FK)</th><th scope=\"col\">Book</th></tr></thead><tbody><tr><td>31</td><td>7</td><td>Moon Maps</td></tr><tr><td>32</td><td>7</td><td>Ocean Life</td></tr></tbody></table></div><div class=\"out\"><strong>Result</strong><p>Loans 31 and 32 both belong to Ada because both contain 7. Reader 8 has no loans. A loan pointing to reader 99 would fail the foreign key check because reader 99 does not exist.</p></div></section><section class=\"reading\"><h2>An ER diagram is the blueprint</h2><p>ER stands for <b>entity–relationship</b>. An <b>entity</b> is something the system keeps facts about, such as Reader. An <b>attribute</b> describes it, such as name. A <b>relationship</b> connects entities, such as a reader taking a loan. Each box below becomes a table. The connecting line describes a business rule.</p><figure class=\"blueboard\"><figcaption>One-to-many · Reader and Loan</figcaption><div class=\"er-pair\"><div class=\"entity\"><strong>Reader</strong><span>PK · reader_id</span><span>name</span></div><div class=\"edge\"><small>borrows</small><div><b>1</b><i></i><b>0..*</b></div></div><div class=\"entity\"><strong>Loan</strong><span>PK · loan_id</span><span>FK · reader_id</span></div></div><p>One Reader can have <b>zero or many Loans</b>. Each Loan belongs to <b>exactly one Reader</b>. The labels sit beside the entity being counted.</p></figure><p><b>Read an endpoint by starting at the opposite box.</b> Start at Reader and look toward Loan. The 0..* beside Loan tells you that one reader can have zero to many loans. Now start at Loan and look toward Reader. The 1 beside Reader tells you that a loan needs exactly one reader.</p><dl class=\"concepts\"><div><dt>Cardinality</dt><dd>The allowed number of matches. A maximum of one differs from a maximum of many (*).</dd></div><div><dt>Participation</dt><dd>The minimum number of matches. Zero makes a relationship optional. One makes it required.</dd></div><div><dt>Referential integrity</dt><dd>The database enforces the link. NOT NULL additionally makes the link mandatory for every child row.</dd></div></dl></section><section class=\"reading\"><h2>Three relationship patterns</h2><div class=\"tbl-scroll\"><table><thead><tr><th scope=\"col\">Business rule</th><th scope=\"col\">Where the link goes</th><th scope=\"col\">Concrete consequence</th></tr></thead><tbody><tr><td>One-to-one</td><td>A UNIQUE foreign key in the dependent table.</td><td>Member 7 can have one pass. A second pass for member 7 is rejected.</td></tr><tr><td>One-to-many</td><td>A foreign key on the many side.</td><td>Two loans can repeat reader 7. Their loan IDs remain different.</td></tr><tr><td>Many-to-many</td><td>A linking table with a foreign key to each side.</td><td>Membership(7, 3) and Membership(7, 4) let one student join two clubs.</td></tr></tbody></table></div><p>A <b>composite primary key</b> uses more than one column. In Membership, (student_id, club_id) identifies a membership if a student can join each club once. If a person can leave and rejoin, separate membership events need another distinguishing value.</p></section>","examples":["<article class=\"case\"><h2>Two loans belong to one reader</h2><p>Ada borrows two books. Bo has a card and has borrowed nothing. The library wants the loan numbers for Ada.</p><figure class=\"blueboard\"><figcaption>One-to-many · Reader and Loan</figcaption><div class=\"er-pair\"><div class=\"entity\"><strong>Reader</strong><span>PK · reader_id</span><span>name</span></div><div class=\"edge\"><small>borrows</small><div><b>1</b><i></i><b>0..*</b></div></div><div class=\"entity\"><strong>Loan</strong><span>PK · loan_id</span><span>FK · reader_id</span></div></div><p>One Reader can have <b>zero or many Loans</b>. Each Loan belongs to <b>exactly one Reader</b>. The labels sit beside the entity being counted.</p></figure><p>To run this example, open a fresh Query Tool tab in pgAdmin with Auto-commit on. Its temporary tables belong to that tab.</p><div class=\"codehead\"><strong>PostgreSQL · pgAdmin</strong><button type=\"button\" data-copy>Copy code</button></div><pre><code>CREATE TEMP TABLE reader (reader_id int PRIMARY KEY, name text NOT NULL);\nCREATE TEMP TABLE loan (\n  loan_id int PRIMARY KEY,\n  reader_id int NOT NULL REFERENCES reader(reader_id)\n);\nINSERT INTO reader VALUES (7,&#x27;Ada&#x27;), (8,&#x27;Bo&#x27;);\nINSERT INTO loan VALUES (31,7), (32,7);\nSELECT r.name, l.loan_id\nFROM reader r JOIN loan l ON l.reader_id = r.reader_id\nWHERE r.reader_id = 7 ORDER BY l.loan_id;</code></pre><div class=\"out\"><strong>Result</strong><p>Ada | 31 and Ada | 32.</p></div><h3>Why it works</h3><ol class=\"reason\"><li>Reader stores Ada once. Loan has two rows because there were two borrowing events.</li><li>JOIN follows the matching reader_id values. Bo has no matching loan in this inner join.</li></ol></article>","<article class=\"case\"><h2>One member can have one pass</h2><p>A pool allows a person to sign up before collecting a pass. Each issued pass belongs to exactly one member.</p><figure class=\"blueboard\"><figcaption>One-to-one · Member and Pass</figcaption><div class=\"er-pair\"><div class=\"entity\"><strong>Member</strong><span>PK · member_id</span><span>name</span></div><div class=\"edge\"><small>holds</small><div><b>1</b><i></i><b>0..1</b></div></div><div class=\"entity\"><strong>Pass</strong><span>PK · pass_id</span><span>FK · member_id</span></div></div><p>One Member can hold <b>zero or one Pass</b>. Each Pass belongs to <b>exactly one Member</b>. A unique foreign key limits a member to one pass.</p></figure><p>To run this example, open a fresh Query Tool tab in pgAdmin with Auto-commit on. Its temporary tables belong to that tab.</p><div class=\"codehead\"><strong>PostgreSQL · pgAdmin</strong><button type=\"button\" data-copy>Copy code</button></div><pre><code>CREATE TEMP TABLE member (member_id int PRIMARY KEY);\nCREATE TEMP TABLE pass (\n  pass_id int PRIMARY KEY,\n  member_id int NOT NULL UNIQUE REFERENCES member(member_id)\n);\nINSERT INTO member VALUES (7),(8);\nINSERT INTO pass VALUES (40,7);\nSELECT m.member_id, p.pass_id FROM member m\nLEFT JOIN pass p ON p.member_id = m.member_id ORDER BY m.member_id;</code></pre><div class=\"out\"><strong>Result</strong><p>Member 7 has pass 40. Member 8 appears with NULL for pass_id.</p></div><h3>Why it works</h3><ol class=\"reason\"><li>NOT NULL on Pass.member_id means a pass cannot be unassigned. Member can still exist without a Pass row.</li><li>UNIQUE prevents two passes pointing to the same member. LEFT JOIN keeps member 8 in the report.</li></ol></article>","<article class=\"case\"><h2>A joining date belongs to a membership</h2><p>Ada joins Chess in September and Art in October. Bo also joins Chess, on a different date. The system allows one membership per student and club.</p><figure class=\"blueboard\"><figcaption>Many-to-many · Student and Club</figcaption><div class=\"bridge\"><div class=\"entity\"><strong>Student</strong><span>PK · student_id</span></div><div class=\"entity\"><strong>Membership</strong><span>PK + FK · student_id</span><span>PK + FK · club_id</span><span>joined_on</span></div><div class=\"entity\"><strong>Club</strong><span>PK · club_id</span></div></div><div class=\"bridgelabel\">Student (1) ─ (0..*) Membership (0..*) ─ (1) Club</div><p>One Student can have many Membership rows. One Club can have many Membership rows. <b>Each Membership connects exactly one student to exactly one club.</b></p></figure><div class=\"tbl-scroll\"><table><caption>Membership · names shown beside IDs for readability</caption><thead><tr><th scope=\"col\">student_id</th><th scope=\"col\">club_id</th><th scope=\"col\">joined_on</th></tr></thead><tbody><tr><td>7 · Ada</td><td>3 · Chess</td><td>Sep 4</td></tr><tr><td>7 · Ada</td><td>4 · Art</td><td>Oct 2</td></tr><tr><td>8 · Bo</td><td>3 · Chess</td><td>Sep 9</td></tr></tbody></table></div><div class=\"out\"><strong>Result</strong><p>Use Student(student_id PK, name), Club(club_id PK, name) and Membership(student_id FK, club_id FK, joined_on). The primary key of Membership is (student_id, club_id).</p></div><h3>Why it works</h3><ol class=\"reason\"><li>Storing the date on Student would give Ada only one date for both clubs. Storing it on Club would give every Chess member the same date.</li><li>Each date describes one pair. The pair (7, 3) appears once, while either individual ID can repeat.</li></ol></article>"],"links":["Tables and keys","ER blueprints","Three relationship patterns"]},{"deck":"A transaction groups changes that belong together. Sending two dollars changes two balances. If the second change fails, undoing the first keeps the money accounted for.","body":"<section class=\"reading\"><h2>A transfer has one boundary</h2><p>A transaction is a unit of work with a beginning and an end. BEGIN opens it. The database runs each statement inside it. COMMIT accepts its changes. ROLLBACK cancels its changes and ends it. An ordinary statement outside an explicit transaction is often committed on its own when auto-commit is enabled.</p><figure class=\"trace\"><figcaption>Move $2 from Ada to Bo</figcaption><div class=\"tbl-scroll\"><table><thead><tr><th scope=\"col\">Step</th><th scope=\"col\">Ada</th><th scope=\"col\">Bo</th><th scope=\"col\">What the transaction sees</th></tr></thead><tbody><tr><td>Before BEGIN</td><td>$5</td><td>$2</td><td>Saved total = $7</td></tr><tr><td>Subtract from Ada</td><td>$3</td><td>$2</td><td>Only half the transfer has run</td></tr><tr><td>Add to Bo</td><td>$3</td><td>$4</td><td>Both updates are ready</td></tr><tr><td>After COMMIT</td><td>$3</td><td>$4</td><td>New balances saved</td></tr></tbody></table></div></figure><div class=\"out\"><strong>Result</strong><p>If the credit fails before commit and the transaction rolls back, the balances are $5 and $2. A later rollback cannot cancel a transfer that already committed.</p></div></section><section class=\"reading\"><h2>ACID explained with the same transfer</h2><div class=\"tbl-scroll\"><table><thead><tr><th scope=\"col\">Property</th><th scope=\"col\">Promise</th><th scope=\"col\">Example</th></tr></thead><tbody><tr><td>Atomicity</td><td>All changes in the transaction take effect together.</td><td>A failed credit also cancels the debit.</td></tr><tr><td>Consistency</td><td>Correct operations preserve the declared rules and business invariants.</td><td>CHECK(balance >= 0) rejects a negative balance. Correct transfer logic also preserves the total.</td></tr><tr><td>Isolation</td><td>The isolation level controls how concurrent work can interact.</td><td>Under PostgreSQL Read Committed, another reader cannot see the uncommitted debit.</td></tr><tr><td>Durability</td><td>A successfully committed change survives a crash under durable settings.</td><td>The database uses its durable records to recover the $3 and $4 balances.</td></tr></tbody></table></div></section><section class=\"reading\"><h2>SQL success and business success</h2><p>An UPDATE looking for an available seat can match zero rows. That is a valid SQL result, but the purchase has failed to reserve a seat. A correct program checks that exactly one row changed before inserting the booking. The transaction groups the steps. The condition and row-count check enforce the business rule.</p></section><section class=\"reading\"><h2>A savepoint is a partial rewind</h2><p>SAVEPOINT marks a spot inside an open transaction. ROLLBACK TO removes changes after that spot while earlier changes stay pending. For example, an order costs $25 and an optional gift wrap adds $3. Set a savepoint after creating the order. Undoing the wrap restores $25. A final COMMIT saves the $25 order.</p></section>","examples":["<article class=\"case\"><h2>Commit a successful transfer</h2><p>Two balances start at 5 and 2. A transfer moves 2 from A to B.</p><p>To run this example, open a fresh Query Tool tab in pgAdmin with Auto-commit on. Its temporary tables belong to that tab.</p><div class=\"codehead\"><strong>PostgreSQL · pgAdmin</strong><button type=\"button\" data-copy>Copy code</button></div><pre><code>CREATE TEMP TABLE wallet (id text PRIMARY KEY, balance int CHECK (balance &gt;= 0));\nINSERT INTO wallet VALUES (&#x27;A&#x27;,5),(&#x27;B&#x27;,2);\nBEGIN;\nUPDATE wallet SET balance = balance - 2 WHERE id = &#x27;A&#x27;;\nUPDATE wallet SET balance = balance + 2 WHERE id = &#x27;B&#x27;;\nCOMMIT;\nSELECT * FROM wallet ORDER BY id;</code></pre><div class=\"out\"><strong>Result</strong><p>A = 3 and B = 4. The total is still 7.</p></div><h3>Why it works</h3><ol class=\"reason\"><li>The two UPDATE statements affect different rows inside one transaction.</li><li>COMMIT records the completed transfer. A new transaction reads the new balances.</li></ol></article>","<article class=\"case\"><h2>A rollback protects an earlier deposit</h2><p>A counter starts at 12. The first transaction saves an increase of 3. The second doubles the counter, then cancels.</p><p>To run this example, open a fresh Query Tool tab in pgAdmin with Auto-commit on. Its temporary tables belong to that tab.</p><div class=\"codehead\"><strong>PostgreSQL · pgAdmin</strong><button type=\"button\" data-copy>Copy code</button></div><pre><code>CREATE TEMP TABLE counter (value int);\nINSERT INTO counter VALUES (12);\nBEGIN;\nUPDATE counter SET value = value + 3;\nCOMMIT;\nBEGIN;\nUPDATE counter SET value = value * 2;\nROLLBACK;\nSELECT value FROM counter;</code></pre><div class=\"out\"><strong>Result</strong><p>15. The second transaction briefly saw 30.</p></div><h3>Why it works</h3><ol class=\"reason\"><li>The first COMMIT made 15 the starting point for the next transaction.</li><li>ROLLBACK undid only the multiplication. It did not reach back to 12.</li></ol></article>","<article class=\"case\"><h2>Remove gift wrap and keep the order</h2><p>A shop adds a gift-wrap fee and then the customer declines it. The base order should still be saved.</p><p>To run this example, open a fresh Query Tool tab in pgAdmin with Auto-commit on. Its temporary tables belong to that tab.</p><div class=\"codehead\"><strong>PostgreSQL · pgAdmin</strong><button type=\"button\" data-copy>Copy code</button></div><pre><code>CREATE TEMP TABLE receipt (item text, price int);\nBEGIN;\nINSERT INTO receipt VALUES (&#x27;Book&#x27;,25);\nSAVEPOINT base_order;\nINSERT INTO receipt VALUES (&#x27;Wrap&#x27;,3);\nROLLBACK TO SAVEPOINT base_order;\nCOMMIT;\nSELECT item,price FROM receipt;</code></pre><div class=\"out\"><strong>Result</strong><p>One row remains: Book | 25.</p></div><h3>Why it works</h3><ol class=\"reason\"><li>The book was inserted before the marker. The wrap was inserted after it.</li><li>ROLLBACK TO keeps the transaction open. COMMIT saves the surviving change.</li></ol></article>"],"links":["Transfer boundaries","The four ACID properties","Savepoints"]},{"deck":"SQL is the language used to describe tables, change the facts inside them, and ask for results. A query can turn individual time entries into one total per project.","body":"<section class=\"reading\"><h2>Structure and data are different things</h2><p>Imagine a blank attendance sheet. Adding a column for the date changes the design of the sheet. Marking Ada present changes a value on it. SQL makes the same distinction. <b>Data definition language (DDL)</b> describes database objects. <b>Data manipulation language (DML)</b> works with their rows.</p><div class=\"tbl-scroll\"><table><thead><tr><th scope=\"col\">Command</th><th scope=\"col\">What changes</th><th scope=\"col\">Small example</th></tr></thead><tbody><tr><td>CREATE TABLE</td><td>Makes a new structure.</td><td>CREATE TABLE item (id int PRIMARY KEY)</td></tr><tr><td>ALTER TABLE</td><td>Changes an existing structure.</td><td>ALTER TABLE item ADD COLUMN price int</td></tr><tr><td>DROP TABLE</td><td>Removes the table itself and its rows.</td><td>DROP TABLE item</td></tr></tbody></table></div><p><b>CRUD</b> names four row operations. INSERT creates a row, SELECT reads rows, UPDATE changes matching rows, and DELETE removes matching rows. A missing WHERE on UPDATE or DELETE makes every row eligible.</p></section><section class=\"reading\"><h2>A query flows from rows to groups</h2><p>Suppose the work log contains Atlas hours 2 and 6, Beacon hours 4 and 1, and Comet hours 9. We want project totals, counting only entries of at least 2 hours and showing only totals of at least 6.</p><figure class=\"trace\"><figcaption>Follow the rows through the report</figcaption><div class=\"tbl-scroll\"><table><thead><tr><th scope=\"col\">Stage</th><th scope=\"col\">Intermediate result</th><th scope=\"col\">Reason</th></tr></thead><tbody><tr><td>FROM / JOIN</td><td>Five entries paired with their project names.</td><td>Match the project key in both tables.</td></tr><tr><td>WHERE hours >= 2</td><td>Atlas 2, Atlas 6, Beacon 4, Comet 9.</td><td>Discard the single 1-hour row.</td></tr><tr><td>GROUP BY project</td><td>Atlas [2,6], Beacon [4], Comet [9].</td><td>One bucket per project.</td></tr><tr><td>HAVING SUM(hours) >= 6</td><td>Atlas 8, Comet 9.</td><td>Discard the Beacon group.</td></tr><tr><td>SELECT / ORDER BY</td><td>Comet 9, then Atlas 8.</td><td>Return name and total, sorted largest first.</td></tr></tbody></table></div></figure></section><section class=\"reading\"><h2>Joins and missing matches</h2><p>An <b>inner join</b> returns matching pairs. A <b>left join</b> also keeps every row from the left input. When it finds no match, columns from the right are NULL, meaning no value is present. This matters when the report needs a club with zero members.</p><dl class=\"concepts\"><div><dt>COUNT(*)</dt><dd>Counts rows, including the placeholder row a left join produces.</dd></div><div><dt>COUNT(member_id)</dt><dd>Counts only non-NULL member IDs. A club with no match gets zero.</dd></div><div><dt>SUM, AVG, MIN, MAX</dt><dd>Add values, average them, or select extremes. These aggregates skip NULL inputs. SQL uses IS NULL to check for a missing value.</dd></div></dl></section><section class=\"reading\"><h2>Filtering and sorting details</h2><p>WHERE fee BETWEEN 10 AND 20 includes both 10 and 20. WHERE name LIKE 'A%' selects names beginning with A. WHERE region IN ('East','West') accepts either listed value. ORDER BY total DESC, name ASC gives a predictable order when totals tie. Without ORDER BY, row order is unspecified.</p></section>","examples":["<article class=\"case\"><h2>Create a table and change one row</h2><p>A shop records two pencils, adds a price column, updates one price, then removes a discontinued product.</p><p>To run this example, open a fresh Query Tool tab in pgAdmin with Auto-commit on. Its temporary tables belong to that tab.</p><div class=\"codehead\"><strong>PostgreSQL · pgAdmin</strong><button type=\"button\" data-copy>Copy code</button></div><pre><code>CREATE TEMP TABLE item (id int PRIMARY KEY, name text);\nALTER TABLE item ADD COLUMN price int;\nINSERT INTO item VALUES (1,&#x27;Blue pencil&#x27;,2),(2,&#x27;Red pencil&#x27;,3);\nUPDATE item SET price = 4 WHERE id = 1;\nDELETE FROM item WHERE id = 2;\nSELECT * FROM item ORDER BY id;</code></pre><div class=\"out\"><strong>Result</strong><p>1 | Blue pencil | 4.</p></div><h3>Why it works</h3><ol class=\"reason\"><li>ALTER adds a place for price. INSERT creates the rows. The two WHERE clauses target different IDs.</li><li>DELETE removes the red pencil while preserving the table. DROP TABLE item would remove the entire temporary table.</li></ol></article>","<article class=\"case\"><h2>Count members even for an empty club</h2><p>Chess has two members. Art is open for registration and has none.</p><div class=\"codehead\"><strong>PostgreSQL · pgAdmin</strong><button type=\"button\" data-copy>Copy code</button></div><pre><code>WITH club(id,name) AS (VALUES (1,&#x27;Chess&#x27;),(2,&#x27;Art&#x27;)),\nmember(id,club_id) AS (VALUES (10,1),(11,1))\nSELECT c.name, COUNT(m.id) AS members\nFROM club c LEFT JOIN member m ON m.club_id = c.id\nGROUP BY c.id,c.name ORDER BY c.name;</code></pre><div class=\"out\"><strong>Result</strong><p>Art | 0, then Chess | 2.</p></div><h3>Why it works</h3><ol class=\"reason\"><li>The WITH clauses create small named sets of sample rows for this query. LEFT JOIN preserves Art.</li><li>For Art, m.id is NULL. COUNT(m.id) skips it. COUNT(*) would incorrectly report one member.</li></ol></article>","<article class=\"case\"><h2>Report projects with enough qualifying hours</h2><p>The report uses the five entries from the lesson and joins each entry to its project.</p><div class=\"codehead\"><strong>PostgreSQL · pgAdmin</strong><button type=\"button\" data-copy>Copy code</button></div><pre><code>WITH project(id,name) AS (VALUES (1,&#x27;Atlas&#x27;),(2,&#x27;Beacon&#x27;),(3,&#x27;Comet&#x27;)),\nwork(project_id,hours) AS (VALUES (1,2),(1,6),(2,4),(2,1),(3,9))\nSELECT p.name, SUM(w.hours) AS total\nFROM project p JOIN work w ON w.project_id = p.id\nWHERE w.hours &gt;= 2\nGROUP BY p.id,p.name\nHAVING SUM(w.hours) &gt;= 6\nORDER BY total DESC,p.name;</code></pre><div class=\"out\"><strong>Result</strong><p>Comet | 9, then Atlas | 8.</p></div><h3>Why it works</h3><ol class=\"reason\"><li>WHERE removes Beacon’s 1-hour entry before grouping. Its group then totals only 4.</li><li>HAVING checks the total after grouping. ORDER BY places 9 ahead of 8.</li></ol></article>"],"links":["Table definitions and CRUD","Joining rows","Grouped reports"]},{"deck":"A stored procedure is a set of instructions saved under a name in the database. The caller supplies values, and the database carries out the same steps with those values.","body":"<section class=\"reading\"><h2>From one query to a reusable procedure</h2><p>A school frequently lists students by department. Writing a separate query for every department repeats the same logic. A procedure defines the logic once. An <b>input parameter</b> is a named slot such as department ID. An <b>argument</b> is the actual value, such as 10, supplied for one call.</p><figure class=\"trace\"><figcaption>One procedure, two calls</figcaption><div class=\"tbl-scroll\"><table><thead><tr><th scope=\"col\">Stored rows</th><th scope=\"col\">Call with 10</th><th scope=\"col\">Call with 20</th></tr></thead><tbody><tr><td>Ada · department 10</td><td>Ada appears</td><td>—</td></tr><tr><td>Bo · department 20</td><td>—</td><td>Bo appears</td></tr><tr><td>Lia · department 10</td><td>Lia appears</td><td>—</td></tr></tbody></table></div></figure><p>Inside the procedure, compare the column to the parameter. If the code compares department_id to itself, every row with a non-NULL department passes, even when it belongs to the wrong department.</p></section><section class=\"reading\"><h2>Variables, decisions and repetition</h2><dl class=\"concepts\"><div><dt>Local variable</dt><dd>A named place for a changing value during one call. A running total starts at 0. A running product starts at 1.</dd></div><div><dt>IF / ELSE</dt><dd>Selects one branch. An invalid quantity can be rejected before any rows change. A valid quantity continues to the update.</dd></div><div><dt>WHILE loop</dt><dd>Repeats while its condition is true. To add 1 through 3, start i at 1, add i, then increase i each pass. The totals become 1, 3, 6. When i reaches 4 the loop stops.</dd></div><div><dt>Validation and error handling</dt><dd>Check inputs before work. If an unexpected error interrupts a multi-step update, undo the unfinished transaction and report the failure to the caller.</dd></div></dl></section><section class=\"reading\"><h2>SQL Server and PostgreSQL use different procedure syntax</h2><div class=\"tbl-scroll\"><table><thead><tr><th scope=\"col\">Operation</th><th scope=\"col\">SQL Server (T-SQL)</th><th scope=\"col\">PostgreSQL (PL/pgSQL)</th></tr></thead><tbody><tr><td>Input parameter</td><td>@dept INT</td><td>IN p_dept integer</td></tr><tr><td>Run the procedure</td><td>EXEC GetStudentsByDepartment @dept = 10</td><td>CALL procedure_name(...)</td></tr><tr><td>Return a list of rows</td><td>A SELECT in the body returns a result set.</td><td>A procedure can open a refcursor. The caller fetches its rows before the transaction ends.</td></tr><tr><td>Signal an error</td><td>THROW</td><td>RAISE EXCEPTION</td></tr></tbody></table></div><p>A <b>cursor</b> is a handle for reading query results. In the department example, the PostgreSQL procedure opens a named cursor and FETCH ALL reads its rows. COMMIT closes an ordinary transaction-scoped cursor.</p></section><section class=\"reading\"><h2>Put the commit at the right boundary</h2><p>For a two-step operation, one transaction must cover both steps. One common PostgreSQL pattern lets the caller do BEGIN, CALL, then COMMIT on success or ROLLBACK after failure. The procedure can validate and raise an error without committing independently. In SQL Server, TRY/CATCH can bracket BEGIN TRANSACTION and COMMIT, with rollback in CATCH if a transaction is active.</p></section>","examples":["<article class=\"case\"><h2>List students in department 10</h2><p>Students contains Ada (1, department 10), Bo (2, department 20) and Lia (3, department 10). Both dialects answer the same request.</p><div class=\"codehead\"><strong>SQL Server · assumes Students already exists</strong><button type=\"button\" data-copy>Copy code</button></div><pre><code>CREATE PROCEDURE GetStudentsByDepartment @dept INT\nAS\nBEGIN\n  SELECT student_id,student_name,department_id\n  FROM Students WHERE department_id = @dept ORDER BY student_id;\nEND;\nGO\nEXEC GetStudentsByDepartment @dept = 10;</code></pre><p>To run this example, open a fresh Query Tool tab in pgAdmin with Auto-commit on. Its temporary tables belong to that tab.</p><div class=\"codehead\"><strong>PostgreSQL · pgAdmin</strong><button type=\"button\" data-copy>Copy code</button></div><pre><code>CREATE TEMP TABLE students (student_id int PRIMARY KEY, student_name text, department_id int);\nINSERT INTO students VALUES (1,&#x27;Ada&#x27;,10),(2,&#x27;Bo&#x27;,20),(3,&#x27;Lia&#x27;,10);\nCREATE PROCEDURE pg_temp.students_by_department(IN p_dept int, IN result refcursor)\nLANGUAGE plpgsql AS $$\nBEGIN\n  IF p_dept IS NULL THEN RAISE EXCEPTION &#x27;Department is required&#x27;; END IF;\n  OPEN result FOR SELECT s.* FROM pg_temp.students s\n    WHERE s.department_id = p_dept ORDER BY s.student_id;\nEND; $$;\nBEGIN;\nCALL pg_temp.students_by_department(10,&#x27;matches&#x27;);\nFETCH ALL FROM matches;</code></pre><p>Run through FETCH to see the rows in Data Output. Then execute <code>COMMIT;</code> in the same tab.</p><div class=\"out\"><strong>Result</strong><p>1 | Ada | 10 and 3 | Lia | 10.</p></div><h3>Why it works</h3><ol class=\"reason\"><li>Both procedures compare the stored department ID to the supplied value. Bo belongs to 20, so his row does not qualify.</li><li>SQL Server sends the SELECT result to the caller. PostgreSQL exposes the rows through the cursor while the transaction is open.</li></ol></article>","<article class=\"case\"><h2>Calculate 4 factorial with a loop</h2><p>Factorial multiplies the whole numbers from 1 to the input. For 4, the result is 1 × 2 × 3 × 4. This example accepts integers from 0 through 12.</p><p>To run this example, open a fresh Query Tool tab in pgAdmin with Auto-commit on. Its temporary tables belong to that tab.</p><div class=\"codehead\"><strong>PostgreSQL · pgAdmin</strong><button type=\"button\" data-copy>Copy code</button></div><pre><code>CREATE TEMP TABLE factorial_run (n int, product int);\nCREATE PROCEDURE pg_temp.save_factorial(IN n int)\nLANGUAGE plpgsql AS $$\nDECLARE i int := 1; result int := 1;\nBEGIN\n  IF n IS NULL OR n &lt; 0 OR n &gt; 12 THEN\n    RAISE EXCEPTION &#x27;Use an integer from 0 through 12&#x27;;\n  END IF;\n  WHILE i &lt;= n LOOP\n    result := result * i;\n    i := i + 1;\n  END LOOP;\n  INSERT INTO pg_temp.factorial_run VALUES (n,result);\nEND; $$;\nCALL pg_temp.save_factorial(4);\nCALL pg_temp.save_factorial(0);\nSELECT * FROM factorial_run ORDER BY n;</code></pre><div class=\"out\"><strong>Result</strong><p>0 | 1 and 4 | 24.</p></div><h3>Why it works</h3><ol class=\"reason\"><li>For 4, the product goes 1, 2, 6, 24. Increasing i makes the loop finish.</li><li>For 0, the loop body never runs, so the initial product 1 is stored. Limiting n to 12 keeps the result within a signed 32-bit integer.</li></ol></article>","<article class=\"case\"><h2>Reserve stock only when enough exists</h2><p>A shelf holds 3 copies. A call requests 2. A later call requests 4. Validation and transaction handling give each call a definite outcome.</p><p>To run this example, open a fresh Query Tool tab in pgAdmin with Auto-commit on. Its temporary tables belong to that tab.</p><div class=\"codehead\"><strong>PostgreSQL · pgAdmin</strong><button type=\"button\" data-copy>Copy code</button></div><pre><code>CREATE TEMP TABLE stock (id int PRIMARY KEY, qty int NOT NULL CHECK (qty &gt;= 0));\nINSERT INTO stock VALUES (1,3);\nCREATE PROCEDURE pg_temp.reserve(IN wanted int)\nLANGUAGE plpgsql AS $$\nBEGIN\n  IF wanted IS NULL OR wanted &lt;= 0 THEN\n    RAISE EXCEPTION &#x27;Use a positive quantity&#x27;;\n  END IF;\n  UPDATE pg_temp.stock SET qty = qty-wanted WHERE id=1 AND qty&gt;=wanted;\n  IF NOT FOUND THEN RAISE EXCEPTION &#x27;Insufficient stock&#x27;; END IF;\nEND; $$;\nBEGIN;\nCALL pg_temp.reserve(2);\nCOMMIT;\nSELECT qty FROM stock WHERE id=1;</code></pre><p>For the second call, execute <code>BEGIN;</code>, then <code>CALL pg_temp.reserve(4);</code>. It raises “Insufficient stock”. Execute <code>ROLLBACK;</code> and select qty again.</p><div class=\"out\"><strong>Result</strong><p>The successful call leaves 1 copy. The rejected call leaves that same 1 copy.</p></div><h3>Why it works</h3><ol class=\"reason\"><li>The guarded UPDATE checks the available quantity as it changes the row.</li><li>PL/pgSQL sets FOUND to false when the update matches no rows. The procedure turns that condition into an error. Rolling back the second transaction preserves the earlier committed reservation.</li></ol></article>"],"links":["Parameters and calls","Variables and loops","Validation and transactions"]},{"deck":"Concurrency means two or more transactions overlap. The database needs rules for taking turns so that a correct operation stays correct when someone else is working at the same time.","body":"<section class=\"reading\"><h2>Two correct calculations can lose a point</h2><p>A scoreboard starts at 10. Each of two players scores once. If both programs first read 10, each calculates 11 in memory. If both save their calculated answer, the scoreboard ends at 11. The missing point is a <b>lost update</b>. The order matters even though each calculation was correct on its own.</p><figure class=\"trace\"><figcaption>A schedule is the order of operations</figcaption><div class=\"tbl-scroll\"><table><thead><tr><th scope=\"col\">Time</th><th scope=\"col\">Transaction A</th><th scope=\"col\">Transaction B</th><th scope=\"col\">Stored score</th></tr></thead><tbody><tr><td>1</td><td>Reads 10</td><td>—</td><td>10</td></tr><tr><td>2</td><td>—</td><td>Reads 10</td><td>10</td></tr><tr><td>3</td><td>Writes 11</td><td>—</td><td>11</td></tr><tr><td>4</td><td>—</td><td>Writes 11</td><td>11</td></tr></tbody></table></div></figure><div class=\"out\"><strong>Result</strong><p>The intended score is 12. Updating score = score + 1 in a single SQL statement lets each update operate on the current row.</p></div></section><section class=\"reading\"><h2>Three problems that look different on paper</h2><dl class=\"concepts\"><div><dt>Lost update</dt><dd>One writer overwrites a change made by another. Both players scoring but only one point appearing is a lost update.</dd></div><div><dt>Dirty read</dt><dd>A reader uses another transaction’s uncommitted change. If that writer rolls back, the reader acted on a value that never became permanent. PostgreSQL prevents dirty reads.</dd></div><div><dt>Inconsistent analysis</dt><dd>A report combines pieces from different moments. Reading A before a transfer and B after it can double-count the transferred amount. A consistent snapshot for the whole report avoids mixing moments.</dd></div></dl></section><section class=\"reading\"><h2>Serial schedules and conflict arrows</h2><p>A <b>serial schedule</b> finishes one transaction before starting the next. A <b>serializable schedule</b> may interleave steps but is equivalent to some serial order. To check <b>conflict serializability</b>, compare operations from different transactions on the same item. Two reads can swap. If either operation writes, their order matters.</p><p>A <b>precedence graph</b> gives each transaction a node. Draw an arrow from the earlier transaction to the later one for each conflict. A cycle means no serial order can preserve every edge. Without a cycle, read a serial order that follows the arrows.</p></section><section class=\"reading\"><h2>Locks control who can proceed</h2><p>A shared lock lets multiple transactions read a resource. An exclusive lock is needed to write and conflicts with another holder’s shared or exclusive lock on that resource. <b>Two-phase locking (2PL)</b> first grows by acquiring locks. Once a lock is released, the transaction shrinks and must acquire no more locks. Strict 2PL holds exclusive locks until commit or rollback.</p><p>Waiting for one busy resource is ordinary blocking. A <b>deadlock</b> requires a cycle of waits. A wait-for graph uses an arrow from the waiting transaction to the transaction holding the needed lock. This arrow describes a current wait. A precedence arrow describes the order of conflicting operations.</p></section><section class=\"reading\"><h2>Two alternatives to waiting on locks</h2><div class=\"tbl-scroll\"><table><thead><tr><th scope=\"col\">Method</th><th scope=\"col\">How it decides</th><th scope=\"col\">Example</th></tr></thead><tbody><tr><td>Timestamp ordering</td><td>Assign transactions an order and reject operations that would violate it.</td><td>An older writer may have to restart if a newer transaction already read the item it wants to change.</td></tr><tr><td>Optimistic control</td><td>Read and compute privately, validate for conflicts, then install the changes.</td><td>Two editors start with version 5. The second save detects version 6 and retries using the newer data.</td></tr></tbody></table></div></section>","examples":["<article class=\"case\"><h2>Follow a total across two moments</h2><p>A report reads the balance of A, then B in a second statement. Between those reads, a transfer of 20 moves A from 100 to 80 and B from 50 to 70.</p><div class=\"tbl-scroll\"><table><thead><tr><th scope=\"col\">Moment</th><th scope=\"col\">A</th><th scope=\"col\">B</th><th scope=\"col\">True total</th></tr></thead><tbody><tr><td>Before transfer</td><td>100</td><td>50</td><td>150</td></tr><tr><td>After transfer</td><td>80</td><td>70</td><td>150</td></tr></tbody></table></div><div class=\"out\"><strong>Result</strong><p>The report calculates 100 + 70 = 170. No committed state had 170.</p></div><h3>Why it works</h3><ol class=\"reason\"><li>Both individual reads can be committed values. They belong to different snapshots.</li><li>Run the calculation in one SELECT with a statement snapshot, or use a suitable shared transaction snapshot across reads.</li></ol></article>","<article class=\"case\"><h2>Turn a schedule into a precedence graph</h2><p>A writes X, B reads X, B writes Y, and A reads Y, in that order.</p><figure class=\"trace\"><figcaption>Conflicts on two items</figcaption><div class=\"tbl-scroll\"><table><thead><tr><th scope=\"col\">Item</th><th scope=\"col\">Earlier operation</th><th scope=\"col\">Later operation</th><th scope=\"col\">Required order</th></tr></thead><tbody><tr><td>X</td><td>A writes</td><td>B reads</td><td>A → B</td></tr><tr><td>Y</td><td>B writes</td><td>A reads</td><td>B → A</td></tr></tbody></table></div></figure><div class=\"out\"><strong>Result</strong><p>The graph contains a cycle, so this schedule is not conflict-serializable.</p></div><h3>Why it works</h3><ol class=\"reason\"><li>X requires A before B. Y requires B before A. No one-at-a-time order satisfies both.</li><li>If both edges pointed from A to B, A then B would be a valid serial order.</li></ol></article>","<article class=\"case\"><h2>Resolve a deadlock between two bookings</h2><p>A holds the lock on seat 4 and requests seat 5. B already holds seat 5 and requests seat 4.</p><figure class=\"trace\"><figcaption>Wait-for graph</figcaption><div class=\"tbl-scroll\"><table><thead><tr><th scope=\"col\">Waiting transaction</th><th scope=\"col\">Needs</th><th scope=\"col\">Held by</th><th scope=\"col\">Wait edge</th></tr></thead><tbody><tr><td>A</td><td>Seat 5</td><td>B</td><td>A → B</td></tr><tr><td>B</td><td>Seat 4</td><td>A</td><td>B → A</td></tr></tbody></table></div></figure><div class=\"out\"><strong>Result</strong><p>Abort and roll back one transaction, for example B. Its lock is released, so A can finish. B can then retry.</p></div><h3>Why it works</h3><ol class=\"reason\"><li>Letting both wait forever cannot free a seat. A deadlock detector can choose a victim to break the cycle.</li><li>If both operations always lock the smaller seat number first, B cannot hold seat 5 while waiting for seat 4 in this scenario.</li></ol></article>"],"links":["Three concurrency problems","Serializability and 2PL","Deadlocks and alternatives"]},{"deck":"Recovery restores a valid database after a failure. It uses records that survived the failure to keep finished changes and remove the effects of unfinished work.","body":"<section class=\"reading\"><h2>Memory, disk and a durable log</h2><p>Changing a row often changes a page in memory first. A <b>page</b> is a block the database reads or writes as a unit. Data pages may be written to disk later. A <b>transaction log</b> is a separate ordered record of actions. In the textbook model, an update record can contain the old value (before-image) and new value (after-image). A commit record tells recovery that a transaction finished.</p><figure class=\"trace\"><figcaption>A small surviving log</figcaption><div class=\"tbl-scroll\"><table><thead><tr><th scope=\"col\">Record</th><th scope=\"col\">Meaning</th></tr></thead><tbody><tr><td>START T1</td><td>Transaction T1 begins.</td></tr><tr><td>T1 · X · 4 → 7</td><td>Before-image 4, after-image 7.</td></tr><tr><td>COMMIT T1</td><td>T1 finished successfully.</td></tr><tr><td>T2 · Y · 2 → 5</td><td>T2 changed Y. There is no commit for T2 before the crash.</td></tr></tbody></table></div></figure><p>A <b>crash</b> can wipe memory while leaving disk intact. A <b>media failure</b> can destroy the disk itself. Those events require different sources of recovery information.</p></section><section class=\"reading\"><h2>UNDO, REDO and write-ahead logging</h2><dl class=\"concepts\"><div><dt>UNDO (backward recovery)</dt><dd>Remove an unfinished transaction’s effects. If Y was 2 and an unfinished write put 5 on disk, restore 2. Undo repeated writes in reverse order.</dd></div><div><dt>REDO (forward recovery)</dt><dd>Reapply a change that should survive. If committed X = 7 is missing from the data file, use the after-value 7.</dd></div><div><dt>Write-ahead logging (WAL)</dt><dd>Make the relevant log information durable before writing the changed data page. A durable commit also needs its required log records on stable storage before success is acknowledged.</dd></div><div><dt>Checkpoint</dt><dd>Record recovery progress and information needed to restart efficiently. Active work may cross the checkpoint. A checkpoint is neither a commit for those transactions nor a substitute for a backup.</dd></div></dl></section><section class=\"reading\"><h2>Three recovery strategies</h2><div class=\"tbl-scroll\"><table><thead><tr><th scope=\"col\">Strategy</th><th scope=\"col\">Where a new value goes</th><th scope=\"col\">Consequence at failure</th></tr></thead><tbody><tr><td>Deferred update</td><td>Data-page updates are deferred until commit.</td><td>No uncommitted page updates to undo. Committed updates missing from disk may need REDO.</td></tr><tr><td>Immediate update</td><td>A changed page may reach disk before commit.</td><td>An unfinished change on disk may need UNDO. A committed change missing from disk may need REDO.</td></tr><tr><td>Shadow paging</td><td>Write changes to new pages, preserving the old page mapping.</td><td>Publish the new version by switching the durable root pointer atomically. Before the switch, the old version is still reachable.</td></tr></tbody></table></div><p>These are conceptual models. The examples below describe the stated protocol and disk contents. Real database engines implement recovery using their own logging and versioning rules.</p></section><section class=\"reading\"><h2>Choose the recovery tool by failure scope</h2><p>A single rejected transaction usually needs rollback. A machine restart can use a surviving log and database files. When a disk is destroyed, recovery needs a separate surviving copy such as a backup, plus archived logs for changes after the backup.</p></section>","examples":["<article class=\"case\"><h2>Repair one missing change and one unfinished change</h2><p>The log says T1 committed X: 4 → 7. T2 changed Y: 2 → 5 but never committed. Under immediate update, the disk at the crash contains X=4 and Y=5.</p><div class=\"tbl-scroll\"><table><thead><tr><th scope=\"col\">Item</th><th scope=\"col\">On disk</th><th scope=\"col\">Decision</th><th scope=\"col\">Recovered value</th></tr></thead><tbody><tr><td>X</td><td>4</td><td>REDO committed T1 using the after-image.</td><td>7</td></tr><tr><td>Y</td><td>5</td><td>UNDO unfinished T2 using the before-image.</td><td>2</td></tr></tbody></table></div><div class=\"out\"><strong>Result</strong><p>X = 7 and Y = 2.</p></div><h3>Why it works</h3><ol class=\"reason\"><li>The commit record establishes that X=7 must survive, even though its data page had not been written.</li><li>Y=5 reached disk before its transaction finished. Restoring Y=2 removes its effect.</li></ol></article>","<article class=\"case\"><h2>Undo two writes in the right order</h2><p>One uncommitted transaction changes a price from 10 to 12, then from 12 to 15. Both changes reached the data page before failure.</p><figure class=\"trace\"><figcaption>Walk backward through the log</figcaption><div class=\"tbl-scroll\"><table><thead><tr><th scope=\"col\">Recovery step</th><th scope=\"col\">Undo this record</th><th scope=\"col\">Price afterward</th></tr></thead><tbody><tr><td>1 · newest</td><td>12 → 15</td><td>12</td></tr><tr><td>2 · oldest</td><td>10 → 12</td><td>10</td></tr></tbody></table></div></figure><div class=\"out\"><strong>Result</strong><p>The recovered price is 10.</p></div><h3>Why it works</h3><ol class=\"reason\"><li>The before-image of the latest write is 12. Undoing that write first exposes the prior state.</li><li>Then undo the earlier write to 10. Forward-order undo would incorrectly leave the intermediate value 12.</li></ol></article>","<article class=\"case\"><h2>Recover after the disk is lost</h2><p>A separate backup at 09:00 contains 40 tickets. Surviving archived logs have a committed sale of 3 at 09:10 and a committed return of 1 at 09:15. The data disk fails at 09:20.</p><div class=\"tbl-scroll\"><table><thead><tr><th scope=\"col\">Action</th><th scope=\"col\">Tickets available</th></tr></thead><tbody><tr><td>Restore the 09:00 backup</td><td>40</td></tr><tr><td>Replay the committed sale</td><td>37</td></tr><tr><td>Replay the committed return</td><td>38</td></tr></tbody></table></div><div class=\"out\"><strong>Result</strong><p>38 tickets are available after restoration and replay.</p></div><h3>Why it works</h3><ol class=\"reason\"><li>The backup provides a complete starting copy. The archived log fills in committed changes after that copy.</li><li>A checkpoint on the destroyed disk cannot rebuild the missing database by itself.</li></ol></article>"],"links":["Logs and checkpoints","Undo and redo","Recovery strategies"]},{"deck":"A query says which rows you want. A query plan describes how to get them. Optimization chooses among plans that preserve the answer while reducing work such as reading pages or carrying large intermediate results.","body":"<section class=\"reading\"><h2>One request can have several plans</h2><p>A shop manager wants the amounts of East-region sales. One plan joins every shop to its sales and then filters for East. Another filters the Shop table first, then joins only East shops to sales. Because the filter uses only Shop.region and the join is an inner join, both plans return exactly the same matching sales.</p><figure class=\"plantree\"><figcaption>Read from the two inputs up to the result</figcaption><div class=\"root-node\">Return amount (π amount)</div><div class=\"join-node\">⋈ &nbsp; Sale.shop_id = Shop.id</div><div class=\"fork\"><div>Sale → keep shop_id, amount</div><div>Shop → keep East rows (σ region = East) → keep id</div></div></figure><p>The two branches meet at an inner join on Sale.shop_id = Shop.id. The root keeps amount. In a <b>relational algebra tree</b>, a leaf is an input table. Each parent applies an operation to the result below it.</p></section><section class=\"reading\"><h2>Four stages of query processing</h2><div class=\"tbl-scroll\"><table><thead><tr><th scope=\"col\">Stage</th><th scope=\"col\">What happens</th><th scope=\"col\">Example</th></tr></thead><tbody><tr><td>Decomposition</td><td>Parse the SQL, check names and types, and translate the request.</td><td>Resolve s.amount to a column in Sale.</td></tr><tr><td>Optimization</td><td>Compare equivalent logical and physical plans using rules and estimates.</td><td>Estimate whether filtering East shops early reduces work.</td></tr><tr><td>Code generation</td><td>Turn the chosen plan into executable database operations.</td><td>Prepare scan, filter and join operators.</td></tr><tr><td>Execution</td><td>Run the operations and produce result rows.</td><td>Read the inputs and return 12 and 15.</td></tr></tbody></table></div></section><section class=\"reading\"><h2>Three symbols behind a query tree</h2><dl class=\"concepts\"><div><dt>Selection · σ</dt><dd>Keeps rows passing a condition. Filtering 100 shops down to 4 East shops makes the input shorter.</dd></div><div><dt>Projection · π</dt><dd>Keeps needed columns. Keeping id and dropping an unused address makes rows narrower. Classical relational algebra uses sets. Ordinary SQL SELECT preserves duplicate results unless DISTINCT is specified.</dd></div><div><dt>Join · ⋈</dt><dd>Combines matching rows. Keep both join keys until the matching step finishes, even if neither key appears in the final output.</dd></div></dl></section><section class=\"reading\"><h2>Estimates and safe rewrites</h2><p>A heuristic is a practical rule such as filtering early. A cost-based optimizer also uses statistics such as row counts and value distributions to estimate the work. An index can make a selective lookup cheap. A scan can still be cheaper when a large share of rows qualifies.</p><p>Order matters around outer joins. A condition on the right input in WHERE can remove the NULL-filled rows that a left join preserves. Moving it into ON can keep those rows and change the answer. Only equivalent rewrites are valid optimizations.</p></section>","examples":["<article class=\"case\"><h2>Read a small query tree from its leaves</h2><p>Shop has (1, East) and (2, West). Sale has (1, 12), (1, 15) and (2, 20), where each pair is (shop_id, amount).</p><figure class=\"plantree\"><figcaption>Read from the two inputs up to the result</figcaption><div class=\"root-node\">π amount</div><div class=\"join-node\">⋈ &nbsp; Sale.shop_id = Shop.id</div><div class=\"fork\"><div>Sale · (1,12), (1,15), (2,20)</div><div>Shop · σ East leaves id 1</div></div></figure><div class=\"tbl-scroll\"><table><thead><tr><th scope=\"col\">Operator</th><th scope=\"col\">Rows passed upward</th></tr></thead><tbody><tr><td>Filter Shop</td><td>(1, East)</td></tr><tr><td>Join on matching IDs</td><td>(1, 12), (1, 15)</td></tr><tr><td>Return amount</td><td>12, 15</td></tr></tbody></table></div><div class=\"out\"><strong>Result</strong><p>The East-region amounts are 12 and 15.</p></div><h3>Why it works</h3><ol class=\"reason\"><li>Filter Shop because region belongs to that table. The West shop drops out.</li><li>Keep id long enough to match the two sales for shop 1. Only then remove the key from the output.</li></ol></article>","<article class=\"case\"><h2>Observe an equivalent rewrite in pgAdmin</h2><p>The two SELECT forms below describe the same East-region inner join. EXPLAIN displays the operators PostgreSQL plans to use.</p><p>To run this example, open a fresh Query Tool tab in pgAdmin with Auto-commit on. Its temporary tables belong to that tab.</p><div class=\"codehead\"><strong>PostgreSQL · pgAdmin</strong><button type=\"button\" data-copy>Copy code</button></div><pre><code>CREATE TEMP TABLE shop (id int PRIMARY KEY, region text);\nCREATE TEMP TABLE sale (shop_id int REFERENCES shop(id), amount int);\nINSERT INTO shop VALUES (1,&#x27;East&#x27;),(2,&#x27;West&#x27;);\nINSERT INTO sale VALUES (1,12),(1,15),(2,20);\nANALYZE shop;\nANALYZE sale;\nEXPLAIN (COSTS OFF)\nSELECT s.amount FROM sale s JOIN shop h ON h.id=s.shop_id\nWHERE h.region=&#x27;East&#x27;;\nEXPLAIN (COSTS OFF)\nSELECT s.amount FROM sale s\nJOIN (SELECT id FROM shop WHERE region=&#x27;East&#x27;) h ON h.id=s.shop_id;\nSELECT s.amount FROM sale s JOIN shop h ON h.id=s.shop_id\nWHERE h.region=&#x27;East&#x27; ORDER BY s.amount;</code></pre><div class=\"out\"><strong>Result</strong><p>The last SELECT returns 12 and 15. The two EXPLAIN outputs can be identical. Exact scan and join operators depend on statistics and the PostgreSQL version.</p></div><h3>Why it works</h3><ol class=\"reason\"><li>Run each EXPLAIN separately to see its output. Look for the filter associated with shop.</li><li>A written subquery does not require the engine to build a separate intermediate table. It may discover the same plan for either form.</li></ol></article>","<article class=\"case\"><h2>See why a left-join filter can change the answer</h2><p>Club A has a paid member. Club B has none. The report must keep every club and count paid members.</p><div class=\"codehead\"><strong>PostgreSQL · pgAdmin</strong><button type=\"button\" data-copy>Copy code</button></div><pre><code>WITH club(id) AS (VALUES (&#x27;A&#x27;),(&#x27;B&#x27;)),\nmember(club_id,paid) AS (VALUES (&#x27;A&#x27;,true))\nSELECT c.id,COUNT(m.club_id) AS paid_count\nFROM club c LEFT JOIN member m\n  ON m.club_id=c.id AND m.paid\nGROUP BY c.id ORDER BY c.id;</code></pre><div class=\"out\"><strong>Result</strong><p>A | 1 and B | 0. Moving AND m.paid from ON to WHERE m.paid would drop B entirely.</p></div><h3>Why it works</h3><ol class=\"reason\"><li>ON restricts which member rows can match. The left join still creates an unmatched row for B.</li><li>WHERE filters after that row is created. Its m.paid is NULL, so it cannot pass WHERE m.paid. The two plans therefore answer different questions.</li></ol></article>"],"links":["Query processing stages","Relational algebra trees","Safe rewrites"]}];
const drawings=["<figure class=\"blueboard\"><figcaption>One-to-many · Reader and Loan</figcaption><div class=\"er-pair\"><div class=\"entity\"><strong>Reader</strong><span>PK · reader_id</span><span>name</span></div><div class=\"edge\"><small>borrows</small><div><b>1</b><i></i><b>0..*</b></div></div><div class=\"entity\"><strong>Loan</strong><span>PK · loan_id</span><span>FK · reader_id</span></div></div><p>One Reader can have <b>zero or many Loans</b>. Each Loan belongs to <b>exactly one Reader</b>. The labels sit beside the entity being counted.</p></figure>","<figure class=\"blueboard\"><figcaption>One-to-one · Member and Pass</figcaption><div class=\"er-pair\"><div class=\"entity\"><strong>Member</strong><span>PK · member_id</span><span>name</span></div><div class=\"edge\"><small>holds</small><div><b>1</b><i></i><b>0..1</b></div></div><div class=\"entity\"><strong>Pass</strong><span>PK · pass_id</span><span>FK · member_id</span></div></div><p>One Member can hold <b>zero or one Pass</b>. Each Pass belongs to <b>exactly one Member</b>. A unique foreign key limits a member to one pass.</p></figure>","<figure class=\"blueboard\"><figcaption>Many-to-many · Student and Club</figcaption><div class=\"bridge\"><div class=\"entity\"><strong>Student</strong><span>PK · student_id</span></div><div class=\"entity\"><strong>Membership</strong><span>PK + FK · student_id</span><span>PK + FK · club_id</span><span>joined_on</span></div><div class=\"entity\"><strong>Club</strong><span>PK · club_id</span></div></div><div class=\"bridgelabel\">Student (1) ─ (0..*) Membership (0..*) ─ (1) Club</div><p>One Student can have many Membership rows. One Club can have many Membership rows. <b>Each Membership connects exactly one student to exactly one club.</b></p></figure>"];</script><script>'use strict';
const palette=[
 ['#006957','#cff6df','⌘'],['#9a3d20','#ffdfcc','⇄'],['#005e97','#d6edff','▦'],
 ['#8a3151','#ffe0e9','{ }'],['#00596d','#caf1f6','≋'],['#815012','#ffedb5','↶'],['#315e38','#daf3ce','⋈']
];
const storeKey = 'cs422-atlas-1';
const main = document.getElementById('main');
let saved = {};
try { saved = JSON.parse(localStorage.getItem(storeKey)) || {}; } catch {}
if (Array.isArray(saved) || typeof saved !== 'object') saved = {};
let topic = 0, phase = 0, frame = 0;
function persist() {
  try { localStorage.setItem(storeKey, JSON.stringify(saved)); }
  catch { document.querySelector('.rail-foot small').textContent = 'Progress available in this tab only'; }
}
function record(i) {
  if (!saved[i] || typeof saved[i] !== 'object') saved[i] = {};
  return saved[i];
}
function escapeText(value) {
  return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function path(i, step=0) { return '#topic-'+(i+1)+'-'+(step+1); }
function color(i) { return '--t:'+palette[i][0]+';--bg:'+palette[i][1]; }
function answer(text) { return '<div class="answer'+(text.includes('\n')?' code':'')+'">'+escapeText(text)+'</div>'; }
function panel(title, body) { return '<section class="panel"><h2>'+escapeText(title)+'</h2>'+body+'</section>'; }
function closedMocks() { return lessons.filter((_,i)=>record(i).submitted).length; }
function updateNav() {
  document.getElementById('mock-count').textContent = closedMocks()+' / 7';
  document.getElementById('meter').value = closedMocks();
  document.querySelectorAll('nav a').forEach(a=>{
    const href=a.getAttribute('href');
    const selected=href===location.hash || (href==='#map' && !location.hash) ||
      (href.startsWith('#topic-') && location.hash.startsWith(href.slice(0,-1)));
    if(selected) a.setAttribute('aria-current','page');
    else a.removeAttribute('aria-current');
  });
}
document.getElementById('topic-nav').innerHTML=lessons.map((l,i)=>'<a href="'+path(i)+'"><span class="dot" style="'+color(i)+'">'+(i+1)+'</span>'+l.title+'</a>').join('');
function score(s,l) {
  let correct=l.mc.filter((q,i)=>s['pick'+i]===q[2]).length;
  let criteria=l.exam[2].filter((_,i)=>s['criterion'+i]).length;
  return '<span class="score">Multiple choice '+correct+' / '+l.mc.length+' · Written self-check '+criteria+' / '+l.exam[2].length+'</span>';
}
function mock(l) {
  const s=record(topic), locked=!!s.submitted;
  const questions=l.mc.map(([q,opts,right,why],i)=>'<section class="panel"><div class="over">Multiple choice · '+(i+1)+'</div><h3>'+escapeText(q)+'</h3>'+opts.map((o,j)=>'<label class="option"><input type="radio" name="pick'+i+'" value="'+j+'" '+(s['pick'+i]===j?'checked ':'')+(locked?'disabled':'required')+'>'+escapeText(o)+'</label>').join('')+(locked?'<div class="result"><strong>'+(s['pick'+i]===right?'Correct.':'Correct answer: '+escapeText(opts[right])+'.')+'</strong> '+escapeText(why)+'</div>':'')+'</section>').join('');
  const rubric=locked?'<h3>Model answer</h3>'+answer(l.exam[1])+'<strong>Check each point your response earned</strong>'+l.exam[2].map((c,i)=>'<label class="gradecheck"><input type="checkbox" data-criterion="'+i+'" '+(s['criterion'+i]?'checked':'')+'>'+escapeText(c)+'</label>').join(''):'';
  return '<p class="soft">Answer both questions and solve the problem, then submit to see the explanations.</p><form id="mock-form">'+questions+'<section class="panel"><div class="over">Applied problem</div><h3>'+escapeText(l.exam[0])+'</h3><label class="prompt" for="mock-draft">Your answer</label><textarea id="mock-draft" data-draft="written" required '+(locked?'readonly':'')+'>'+escapeText(s.written)+'</textarea>'+rubric+'</section>'+
    (locked?'<div class="strip"><div id="grade">'+score(s,l)+'</div><button class="action" data-retry type="button">Try again</button></div>':'<button class="btn solid" type="submit">Check my answers</button>')+'</form>';
}
const paths = [{id:0,name:'Learn & theory'}, {id:2,name:'Worked examples'}, {id:3,name:'Test yourself'}];
const names = ['Library records','Wallet transfer','Project totals','Department lookup','Shared scoreboard','Recovery log','Query plan'];
const snapshots = [
  [['Reader','7 · Ada'],['Loan 31','reader_id = 7'],['Loan 32','reader_id = 7']],
  [['Before','A: 5   B: 2'],['Commit','A: 3   B: 4'],['Rollback','A: 5   B: 2']],
  [['Atlas','2 + 6 = 8 h'],['Beacon','4 + 1 = 5 h'],['Comet','9 h']],
  [['Input','department = 10'],['Ada','10 · match'],['Bo','20 · skipped']],
  [['A reads','10'],['B reads','10'],['Both write','11 · lost update']],
  [['Disk','X = 4'],['Committed log','X: 4 → 7'],['After REDO','X = 7']],
  [['Inputs','Shop + Sale'],['Filter','region = East'],['Output','12, 15']]
];
function mini(i) {
  return '<div class="snapshot"><div class="snap-title"><span aria-hidden="true">▦</span>'+names[i]+'</div>'+snapshots[i].map(([a,b])=>'<div class="snap-row"><b>'+a+'</b><span>'+b+'</span></div>').join('')+'</div>';
}
function overview(){
  const n=Number.isInteger(saved.last)&&lessons[saved.last]?saved.last:0;
  return '<section class="welcome"><div><h1>Database Notes</h1><p>Follow the data from one row to the next. Each topic includes a visual explanation and three fully worked examples.</p><a class="btn" href="'+path(n,record(n).phase||0)+'">'+(Number.isInteger(saved.last)?'Continue reading':'Start with database design')+'</a></div>'+mini(0)+'</section><div class="section-title"><h2>Your study map</h2><a class="text-link" href="#blueprint">ER blueprints</a></div><div class="mapgrid">'+lessons.map((l,i)=>'<a class="topic" href="'+path(i,record(i).phase||0)+'" style="'+color(i)+'"><span class="tile-icon">'+palette[i][2]+'</span><small>'+(record(i).submitted?'Test completed':'Topic '+(i+1))+'</small><h3>'+l.title+'</h3><p>'+guides[i].links.join(' · ')+'</p></a>').join('')+'</div>';
}
function blueprintView(){
  return '<div class="blue-head"><h1>ER blueprints</h1><p>An entity–relationship diagram maps a rule about the real world to tables and keys. Each example below shows how to read the line in both directions.</p></div>'+
    panel('Reading the symbols','<p><strong>PK</strong> identifies one row. <strong>FK</strong> points to a key in another table. <strong>1</strong> means exactly one, <strong>0..1</strong> means zero or one, and <strong>0..*</strong> means zero or many. Read from one box toward the label beside the other box.</p>')+
    drawings.join('')+'<div class="next"><a class="btn solid" href="'+path(0,2)+'">See the three worked designs</a></div>';
}
function headerFor(l){
  return '<section class="welcome lesson-welcome"><div><div class="over">Topic '+(topic+1)+' of 7</div><h1>'+l.title+'</h1><p>'+guides[topic].deck+'</p></div>'+mini(topic)+'</section>';
}
function walk(){
 const l=lessons[topic],f=l.frames[frame];
 return '<div class="switcher" aria-label="Walkthrough steps">'+l.frames.map((item,i)=>'<button type="button" data-frame="'+i+'" aria-pressed="'+(frame===i)+'">'+escapeText(item[0])+'</button>').join('')+'</div>'+
 '<div class="walk-output" aria-live="polite"><h3>'+escapeText(f[1])+'</h3><div class="walk-lines"><span>'+escapeText(f[2])+'</span><span>'+escapeText(f[3])+'</span></div><p>'+escapeText(f[4])+'</p></div>';
}
function reading(){
 return guides[topic].body + panel(lessons[topic].demo,'<div id="frames">'+walk()+'</div>')+(topic===0?'<p><a class="text-link" href="#blueprint">Explore all three ER blueprints</a></p>':'');
}
function worked(){
 const g=guides[topic];
 return '<div class="jump"><strong>Worked examples</strong>'+g.examples.map((x,i)=>'<button type="button" data-jump="'+i+'">'+(i+1)+'. '+x.match(/<h2>(.*?)<\/h2>/)[1]+'</button>').join('')+'</div>'+
 g.examples.map((x,i)=>'<div id="case-'+i+'" class="case-wrap" tabindex="-1">'+x+'</div>').join('');
}
function render(){
 const hash=location.hash, match=/^#topic-([1-7])-([1-4])$/.exec(hash);
 let label;
 if(match){
  topic=Number(match[1])-1;
  phase=Number(match[2])-1;
  // Existing bookmarks for the former Theory tab open the combined chapter.
  if(phase===1)phase=0;
  frame=0;
  const l=lessons[topic];saved.last=topic;record(topic).phase=phase;persist();label=l.title;
  const tabs='<div class="tabs" aria-label="Topic sections">'+paths.map(s=>'<a href="'+path(topic,s.id)+'" '+(s.id===phase?'class="active" aria-current="page"':'')+'>'+s.name+'</a>').join('')+'</div>';
  const content=phase===0?reading():phase===2?worked():mock(l);
  const next=phase===0?'<a class="btn solid" href="'+path(topic,2)+'">Read worked examples</a>':phase===2?'<a class="btn solid" href="'+path(topic,3)+'">Test yourself</a>':record(topic).submitted?'<a class="btn solid" href="'+(topic<6?path(topic+1):'#map')+'">'+(topic<6?'Next topic':'Study map')+'</a>':'';
  main.innerHTML='<div style="'+color(topic)+'">'+headerFor(l)+tabs+content+'<div class="next">'+next+'</div></div>';
 }else if(hash==='#blueprint'){label='ER blueprints';main.innerHTML=blueprintView();}
 else{label='Study map';main.innerHTML=overview();}
 document.getElementById('crumb').textContent=label;document.title=label+' · Database Notes';
 document.body.classList.remove('open');document.getElementById('menu').setAttribute('aria-expanded','false');updateNav();
}
document.getElementById('menu').onclick=e=>e.currentTarget.setAttribute('aria-expanded', String(document.body.classList.toggle('open')));
document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.body.classList.remove('open');document.getElementById('menu').setAttribute('aria-expanded','false');}});
main.addEventListener('input',e=>{
  const el=e.target,s=record(topic);
  if(el.matches('[data-draft]')) {s[el.dataset.draft]=el.value;el.setCustomValidity('');}
  else if(el.type==='radio') s[el.name]=Number(el.value);
  else if(el.matches('[data-criterion]')) {s['criterion'+el.dataset.criterion]=el.checked;document.getElementById('grade').innerHTML=score(s,lessons[topic]);}
  else return;
  persist();
});
main.addEventListener('submit',e=>{
  e.preventDefault();const field=document.getElementById('mock-draft');
  if(!field.value.trim()){field.setCustomValidity('Write your answer before submitting.');field.reportValidity();return;}
  record(topic).submitted=true;persist();render();main.focus();window.scrollTo(0,0);
});
main.addEventListener('click',async e=>{
  const button=e.target.closest('button');if(!button)return;
  if(button.hasAttribute('data-frame')) {frame=Number(button.dataset.frame);document.getElementById('frames').innerHTML=walk();document.querySelector('[data-frame="'+frame+'"]').focus();}
  if(button.hasAttribute('data-jump')){
    const card=document.getElementById('case-'+button.dataset.jump);
    card.focus({preventScroll:true});card.scrollIntoView({block:'start'});
  }
  if(button.hasAttribute('data-copy')){
    const block=button.parentElement.nextElementSibling;
    try{await navigator.clipboard.writeText(block.textContent);button.textContent='Copied';}
    catch{const range=document.createRange();range.selectNodeContents(block);const selection=window.getSelection();selection.removeAllRanges();selection.addRange(range);button.textContent='Use ⌘C / Ctrl+C';}
  }
  if(button.hasAttribute('data-retry')){
    const s=record(topic);if(!window.confirm('Try this test again? This replaces its current answers and score.'))return;
    for(const k of Object.keys(s))if(/^(pick|criterion)/.test(k)||k==='submitted'||k==='written')delete s[k];
    persist();render();window.scrollTo(0,0);main.focus();
  }
});
window.addEventListener('hashchange',()=>{if(location.hash==='#main'){main.focus();return;}render();window.scrollTo(0,0);main.focus({preventScroll:true});});
render();
</script></body></html>
