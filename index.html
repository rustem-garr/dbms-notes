<div class="shell"><header><button class="mobile" id="menu" aria-expanded="false" aria-controls="rail">☰ Topics</button><span>Notes <em>/</em> <strong id="crumb">Study map</strong></span><span class="edition">Database systems</span></header><main id="main" tabindex="-1"></main><footer>Database Notes </footer></div><script>const lessons=[{"title":"Database design","subtitle":"Entities, attributes & relationships","mc":[["Each ticket requires one event. An event may have no tickets. Which constraint belongs on Ticket.event_id?",["UNIQUE alone","A nullable foreign key","A NOT NULL foreign key"],2,"Many tickets may repeat an event ID. Every ticket must reference an existing event."],["A player wears a different number on each team. Where does the number belong?",["Player","Team","TeamMembership"],2,"The number describes one player on one team."]],"exam":["A clinic stores doctors, patients, and visits. A patient may see the same doctor twice on the same day. Each visit has one doctor, one patient, a time and a fee. Give the tables, keys, and cardinalities.","Doctor(doctor_id PK, name)\nPatient(patient_id PK, name)\nVisit(visit_id PK, doctor_id NOT NULL FK → Doctor, patient_id NOT NULL FK → Patient, visit_time, fee)\nEach doctor or patient has 0..many visits. Each visit has exactly one of each. The visit ID distinguishes repeat encounters.",["Identify both parent entities and their keys.","Give Visit its own identifier, time and fee.","Use both required foreign keys and state both cardinalities."]],"frames":[["One reader","Reader","reader_id  ·  7","name  ·  Ada","A row represents one thing. Ada is one reader. Her ID stays the same even if her name changes."],["Two loans","Loan","loan_id  ·  31     reader_id  ·  7","loan_id  ·  32     reader_id  ·  7","Two loan rows can point to reader 7. The loan ID identifies the loan. The repeated reader ID tells us who borrowed each book."],["Read both ends","Reader  1   ───   0..*  Loan","For one reader  ·  zero or many loans","For one loan  ·  exactly one reader","Read across from one object. A new reader may have zero loans. Each loan must point back to exactly one reader."]],"demo":"Follow a book loan"},{"title":"Transactions","subtitle":"COMMIT, ROLLBACK & ACID","mc":[["The database confirms a sale and then loses power. Which property preserves the sale?",["Atomicity","Durability","Isolation"],1,"Durability protects committed work through a crash."],["Which command keeps earlier work in the same transaction pending while undoing later work?",["ROLLBACK TO SAVEPOINT","COMMIT","ROLLBACK without a savepoint"],0,"A savepoint is a marker inside a still-open transaction."]],"exam":["A concert has one seat left. A purchase must claim one seat and insert one booking. Give the transaction steps. Explain what happens if no seat remains and if the insert fails.","BEGIN. Run UPDATE Show SET seats = seats - 1 WHERE show_id = :id AND seats > 0. Require exactly one updated row. If zero, roll back and report sold out. Insert the booking. If the insert succeeds, commit. On failure, roll back the decrement as well. The conditional update guards the last seat and atomicity keeps booking and inventory together.",["Guard the decrement and check one row changed.","Place the booking and the decrement in one transaction.","Commit only on success and roll back either failure."]],"frames":[["Start","Before the transfer","Jar A   ●●●●●   5","Jar B   ●●   2","Seven marbles in total. Start one transaction for the whole transfer."],["Move","Inside the transaction","Jar A   ●●●   3","Jar B   ●●●●   4","The two updates are visible to the transaction. They still belong to one unfinished job."],["Roll back","After ROLLBACK","Jar A   ●●●●●   5","Jar B   ●●   2","Rollback restores 5 and 2. If the transaction had committed instead, the saved values would be 3 and 4."]],"demo":"Move two marbles"},{"title":"Standard SQL","subtitle":"Tables, joins & grouped reports","mc":[["Which clause removes employees before a department average is calculated?",["HAVING","WHERE","ORDER BY"],1,"WHERE filters individual input rows."],["Which statement adds a column to an existing table?",["UPDATE","INSERT INTO","ALTER TABLE"],2,"Changing columns changes the table definition."]],"exam":["Project(id, name) and Work(project_id, hours) record time entries. Show project ID, name and total hours for projects with at least two entries of 3 or more hours. Sort by total descending, then ID. Write the query.","SELECT p.id, p.name, SUM(w.hours) AS total\nFROM Project AS p\nJOIN Work AS w ON w.project_id = p.id\nWHERE w.hours >= 3\nGROUP BY p.id, p.name\nHAVING COUNT(*) >= 2\nORDER BY total DESC, p.id;",["Join on the project key and filter entries before grouping.","Group by project and calculate SUM(hours).","Keep groups with at least two qualifying entries and sort as requested."]],"frames":[["Rows","Work log","Atlas   3 h    ·    Atlas   5 h","Beacon   1 h    ·    Beacon   2 h","The question asks for projects with at least six total hours. Start with individual work entries."],["Group","GROUP BY project","Atlas     3 + 5 = 8 h","Beacon    1 + 2 = 3 h","Grouping makes one bucket per project. SUM adds the hours inside each bucket."],["Filter","HAVING SUM(hours) >= 6","Atlas      8 h","1 matching group","HAVING checks the finished group totals. A WHERE condition on a single work entry would answer a different question."]],"demo":"Build a grouped report"},{"title":"Stored procedures","subtitle":"Parameters, decisions & loops","mc":[["A procedure tests WHERE instructor_id = instructor_id. Why might it return lessons for every instructor?",["The parameter is too small.","The column is compared with itself.","The table has a primary key."],1,"Qualify the table column and compare it with a separately named parameter."],["A factorial loop handles inputs 0–10. Which initial product works for 0?",["NULL","0","1"],2,"The loop runs zero times for 0, and 0! equals 1."]],"exam":["Lesson(lesson_id, instructor_id, fee) stores driving lessons. Write a SQL Server procedure to return one instructor’s lessons, reject a missing or nonpositive instructor ID, and demonstrate a call for instructor 12.","CREATE PROCEDURE GetLessons @instructor INT\nAS\nBEGIN\n  IF @instructor IS NULL OR @instructor <= 0\n    THROW 50001, 'Positive instructor ID required', 1;\n  SELECT lesson_id, instructor_id, fee\n  FROM Lesson AS l WHERE l.instructor_id = @instructor;\nEND;\nGO\nEXEC GetLessons @instructor = 12;",["Declare a named procedure with a typed input.","Reject NULL or nonpositive input before the query.","Filter by the parameter and show a valid call for 12."]],"frames":[["Input","GetStudentsByDepartment","Input    department ID = 10","Students   Ada · 10    Bo · 20    Lia · 10","The caller supplies 10. The input parameter gives that value a name inside the procedure."],["Filter","WHERE department_id = @dept","Ada · 10     ✓","Bo · 20      ×      Lia · 10     ✓","Compare the table column with the input. Comparing the column to itself would let every non-NULL department through."],["Return","Matching students","Ada    department 10","Lia    department 10","SQL Server can send this SELECT directly to the caller. In the PostgreSQL exercise, a cursor holds the result until you fetch it."]],"demo":"Call a procedure"},{"title":"Concurrency control","subtitle":"Schedules, locks & deadlocks","mc":[["A report reads one balance before a transfer and another after it. What went wrong?",["Lost update","Dirty write","Inconsistent analysis"],2,"The total mixes different database states."],["In basic 2PL, what follows the first unlock?",["Only further releases or actions using held locks","A new growing phase","Automatic deadlock recovery"],0,"The transaction has entered its shrinking phase."]],"exam":["Schedule: A reads X, B writes X, A writes Y, B reads Y. List all conflict edges, decide whether the schedule is conflict-serializable, and give a serial order if possible.","Both pairs concern the same item with at least one write. A reads X before B writes it, and A writes Y before B reads it. Both give A → B. There is no reverse edge and no cycle. The equivalent serial order is A then B.",["Find both conflicting pairs.","Give their common direction and identify the acyclic graph.","Give A then B as an equivalent serial order."]],"frames":[["Read","Score = 10","Session A reads 10","Session B reads 10","Both players score one point. Each session plans to write the number it read, plus one."],["Write","Two writes","A writes 11","B writes 11","The second write replaces the first. The final score is 11, but two points should produce 12."],["Protect","One increment per turn","A adds 1 to the current score → 11","B adds 1 to the current score → 12","Use an atomic UPDATE score = score + 1. For a longer read–decide–write sequence, lock before reading or validate a version and retry."]],"demo":"Catch a lost update"},{"title":"Database recovery","subtitle":"Logs, checkpoints, UNDO & REDO","mc":[["Which record must reach stable storage before its changed data page?",["Its write-ahead log record","The next checkpoint","Every other transaction’s commit"],0,"The log must contain enough recovery information before the page is written."],["A storage drive and the only local log are physically destroyed. What can restore the information?",["A local rollback","A previous SELECT statement","A surviving backup and available archived logs"],2,"Media loss requires a surviving copy of the data."]],"exam":["In an immediate-update system, T1 changes X from 4 to 7 and commits. T2 changes Y from 2 to 5 and is active at the crash. The disk has X=4 and Y=5. Give the recovery action for each and the final values.","REDO T1 using X’s after-value, 7, because its committed update is missing from disk. UNDO T2 using Y’s before-value, 2, because the uncommitted change reached disk. Final state: X=7 and Y=2.",["Classify T1 as committed and T2 as unfinished.","Use REDO with 7 and UNDO with 2.","State both final values and explain why."]],"frames":[["Log","Before the crash","T1   A: 5 → 8    COMMIT","T2   B: 4 → 9    no commit","Suppose this immediate-update system may write unfinished changes to disk or leave committed changes only in memory."],["Crash","Disk after power loss","A = 5    committed update missing","B = 9    unfinished change reached disk","The log survived. Read the commit records before deciding which values belong in the recovered database."],["Recover","Consistent result","REDO T1    A = 8","UNDO T2    B = 4","Use T1’s after-value to restore the saved work. Use T2’s before-value to remove the unfinished work."]],"demo":"Recover two changes"},{"title":"Query optimization","subtitle":"Plans, filters & algebra trees","mc":[["Which operation chooses columns?",["Selection","Projection","Join"],1,"Projection narrows each row to the requested columns."],["Which input can safely receive salary > 90000 before an inner join of Staff and Office?",["Office alone","Neither input","Staff, where salary is stored"],2,"A predicate using only Staff columns can filter that input."]],"exam":["Sale(shop_id, amount) joins Shop(id, region). Return sale amounts for East-region shops. Sketch or describe a tree from the leaves up, move work earlier, and explain why the answer stays the same.","Shop → select region = East → project id. Sale → project shop_id, amount. Join on Shop.id = Sale.shop_id. At the root project amount. The region test uses only Shop. Both join keys survive until the join, and amount survives to output. Preserve multiplicities for SQL SELECT.",["Push the region condition down to Shop.","Keep both join keys and amount until needed.","Join on matching keys, then return amount and justify equivalence."]],"frames":[["Start","Join first","Customer     1,000 rows","Orders       8,000 rows","Imagine a report that only needs orders from Chicago customers. A simple plan joins first and checks the city afterward."],["Filter early","Select customers","Customer     1,000 → 80 rows","Keep rows where city = Chicago","For this inner join, the city test uses only Customer. Move it to that input so fewer customer rows reach the join."],["Keep keys","Project the needed columns","Customer      customer_id, name","Orders        customer_id, total","Keep the join key on both sides until the match is complete. Then the final projection can return just the requested output columns."]],"demo":"Shrink a join"}];
const guides=[{"deck": "A library keeps one row per reader and one row per loan. IDs connect them so the library can record a new loan without copying the reader’s details.", "body": "<section class=\"reading\"><h2>A relational database starts with tables</h2><p>Picture two lists at a library. One lists people who have library cards. The other lists books they borrowed. A <b>relational database</b> organizes facts into tables called relations. A <b>row</b> (tuple) describes one occurrence. A <b>column</b> (attribute) holds one kind of fact. A database management system such as PostgreSQL stores the tables and enforces their rules.</p><div class=\"tbl-scroll\"><table><caption>Reader · one row per person</caption><thead><tr><th scope=\"col\">reader_id</th><th scope=\"col\">name</th></tr></thead><tbody><tr><td>7</td><td>Ada</td></tr><tr><td>8</td><td>Bo</td></tr></tbody></table></div><p>The first row says that reader 7 is named Ada. There are two readers and two attributes. Adding a reader creates another row. Adding a date_of_birth column gives every reader a place for that fact.</p></section><section class=\"reading\"><h2>Primary keys give rows an identity</h2><p>A <b>primary key (PK)</b> is the column, or smallest chosen combination of columns, that uniquely identifies each row. Its values cannot be missing (NULL). Two readers can both be named Ada, so a name is a poor identifier. Reader 7 and reader 8 remain distinct even if their names match.</p><p>A <b>foreign key (FK)</b> is a column or group of columns whose non-null values must match a referenced key. In Loan, reader_id refers back to Reader.reader_id. The same value may appear in many loan rows.</p><div class=\"tbl-scroll\"><table><caption>Loan · one row per borrowing</caption><thead><tr><th scope=\"col\">Loan.loan_id (PK)</th><th scope=\"col\">Loan.reader_id (FK)</th><th scope=\"col\">Book</th></tr></thead><tbody><tr><td>31</td><td>7</td><td>Moon Maps</td></tr><tr><td>32</td><td>7</td><td>Ocean Life</td></tr></tbody></table></div><div class=\"out\"><strong>Result</strong><p>Loans 31 and 32 both belong to Ada because both contain 7. Reader 8 has no loans. A loan pointing to reader 99 would fail the foreign key check because reader 99 does not exist.</p></div></section><section class=\"reading\"><h2>An ER diagram is the blueprint</h2><p>ER stands for <b>entity–relationship</b>. An <b>entity</b> is something the system keeps facts about, such as Reader. An <b>attribute</b> describes it, such as name. A <b>relationship</b> connects entities, such as a reader taking a loan. Each box below becomes a table. The connecting line describes a business rule.</p><figure class=\"blueboard\"><figcaption>One-to-many · Reader and Loan</figcaption><div class=\"er-pair\"><div class=\"entity\"><strong>Reader</strong><span>PK · reader_id</span><span>name</span></div><div class=\"edge\"><small>borrows</small><div><b>1</b><i></i><b>0..*</b></div></div><div class=\"entity\"><strong>Loan</strong><span>PK · loan_id</span><span>FK · reader_id</span></div></div><p>One Reader can have <b>zero or many Loans</b>. Each Loan belongs to <b>exactly one Reader</b>. The labels sit beside the entity being counted.</p></figure><p><b>Read an endpoint by starting at the opposite box.</b> Start at Reader and look toward Loan. The 0..* beside Loan tells you that one reader can have zero to many loans. Now start at Loan and look toward Reader. The 1 beside Reader tells you that a loan needs exactly one reader.</p><dl class=\"concepts\"><div><dt>Cardinality</dt><dd>The allowed number of matches. A maximum of one differs from a maximum of many (*).</dd></div><div><dt>Participation</dt><dd>The minimum number of matches. Zero makes a relationship optional. One makes it required.</dd></div><div><dt>Referential integrity</dt><dd>The database enforces the link. NOT NULL additionally makes the link mandatory for every child row.</dd></div></dl></section><section class=\"reading\"><h2>Three relationship patterns</h2><div class=\"tbl-scroll\"><table><thead><tr><th scope=\"col\">Business rule</th><th scope=\"col\">Where the link goes</th><th scope=\"col\">Concrete consequence</th></tr></thead><tbody><tr><td>One-to-one</td><td>A UNIQUE foreign key in the dependent table.</td><td>Member 7 can have one pass. A second pass for member 7 is rejected.</td></tr><tr><td>One-to-many</td><td>A foreign key on the many side.</td><td>Two loans can repeat reader 7. Their loan IDs remain different.</td></tr><tr><td>Many-to-many</td><td>A linking table with a foreign key to each side.</td><td>Membership(7, 3) and Membership(7, 4) let one student join two clubs.</td></tr></tbody></table></div><p>A <b>composite primary key</b> uses more than one column. In Membership, (student_id, club_id) identifies a membership if a student can join each club once. If a person can leave and rejoin, separate membership events need another distinguishing value.</p></section><section class=\"reading\"><h2>Attribute types change the table design</h2><p>An attribute can be classified in several ways at once. A single address can be composite because it has parts. Multiple phone numbers are multivalued because one person has several values.</p><div class=\"tbl-scroll\"><table><thead><tr><th scope=\"col\">Kind</th><th scope=\"col\">Example</th><th scope=\"col\">Relational representation</th></tr></thead><tbody><tr><td>Simple</td><td>house_number = 24</td><td>One column when it is treated as one value.</td></tr><tr><td>Composite</td><td>Address = street + city + postal code</td><td>Separate columns for components needed independently.</td></tr><tr><td>Single-valued</td><td>date_of_birth</td><td>One value per person row.</td></tr><tr><td>Multivalued</td><td>Two phone numbers for Ada</td><td>PersonPhone(person_id, phone), one number per row.</td></tr><tr><td>Derived</td><td>annual_salary = 60000</td><td>monthly_salary = annual_salary / 12 = 5000; calculate when appropriate.</td></tr></tbody></table></div><div class=\"out\"><strong>Worked answer</strong><p>Person(7, Ada) and PersonPhone(7, 111), PersonPhone(7, 222) represent one person with two phones. If the pair is the primary key, the same number cannot be entered twice for that person. Storing an age and a birth date separately can make them disagree; deriving age avoids that duplication.</p></div></section><section class=\"reading\"><h2>Dependent entities and relationships within one table</h2><p>A weak entity depends on an owner. Its identifier often combines the owner’s key with a number meaningful only within that owner. A recursive relationship instead links two roles played by the same entity type.</p><div class=\"tbl-scroll\"><table><thead><tr><th scope=\"col\">Pattern</th><th scope=\"col\">Tables / keys</th><th scope=\"col\">Meaning</th></tr></thead><tbody><tr><td>Weak entity</td><td>Order(order_id PK); OrderLine(order_id FK, line_no, product, quantity, PK(order_id,line_no))</td><td>Order 50 line 1 and order 51 line 1 are different rows. The owner is part of each line’s identity.</td></tr><tr><td>Recursive relationship</td><td>Employee(employee_id PK, name, manager_id nullable FK → Employee.employee_id)</td><td>Employee 8 may reference manager 7. Employee 7 may have no manager. A foreign key alone does not prohibit a management cycle.</td></tr><tr><td>Ternary relationship</td><td>Supply(supplier_id FK, part_id FK, project_id FK, quantity)</td><td>Quantity describes this three-way association. Three separate pairwise links do not necessarily identify which supplier provides which part to which project.</td></tr></tbody></table></div><div class=\"out\"><strong>Worked answer</strong><p>In the first design, Order is the parent and OrderLine is the child. The foreign key rejects a line for an unknown order. For the simple business rule “one quantity per supplier–part–project combination,” those three IDs can form Supply’s composite primary key; repeated deliveries need an additional event identifier.</p></div></section>", "examples": ["<article class=\"case\"><h2>Two loans belong to one reader</h2><p>Ada borrows two books. Bo has a card and has borrowed nothing. The library wants the loan numbers for Ada.</p><figure class=\"blueboard\"><figcaption>One-to-many · Reader and Loan</figcaption><div class=\"er-pair\"><div class=\"entity\"><strong>Reader</strong><span>PK · reader_id</span><span>name</span></div><div class=\"edge\"><small>borrows</small><div><b>1</b><i></i><b>0..*</b></div></div><div class=\"entity\"><strong>Loan</strong><span>PK · loan_id</span><span>FK · reader_id</span></div></div><p>One Reader can have <b>zero or many Loans</b>. Each Loan belongs to <b>exactly one Reader</b>. The labels sit beside the entity being counted.</p></figure><p>To run this example, open a fresh Query Tool tab in pgAdmin with Auto-commit on. Its temporary tables belong to that tab.</p><div class=\"codehead\"><strong>PostgreSQL · pgAdmin</strong><button type=\"button\" data-copy>Copy code</button></div><pre><code>CREATE TEMP TABLE reader (reader_id int PRIMARY KEY, name text NOT NULL);\nCREATE TEMP TABLE loan (\n  loan_id int PRIMARY KEY,\n  reader_id int NOT NULL REFERENCES reader(reader_id)\n);\nINSERT INTO reader VALUES (7,&#x27;Ada&#x27;), (8,&#x27;Bo&#x27;);\nINSERT INTO loan VALUES (31,7), (32,7);\nSELECT r.name, l.loan_id\nFROM reader r JOIN loan l ON l.reader_id = r.reader_id\nWHERE r.reader_id = 7 ORDER BY l.loan_id;</code></pre><div class=\"out\"><strong>Result</strong><p>Ada | 31 and Ada | 32.</p></div><h3>Why it works</h3><ol class=\"reason\"><li>Reader stores Ada once. Loan has two rows because there were two borrowing events.</li><li>JOIN follows the matching reader_id values. Bo has no matching loan in this inner join.</li></ol></article>", "<article class=\"case\"><h2>One member can have one pass</h2><p>A pool allows a person to sign up before collecting a pass. Each issued pass belongs to exactly one member.</p><figure class=\"blueboard\"><figcaption>One-to-one · Member and Pass</figcaption><div class=\"er-pair\"><div class=\"entity\"><strong>Member</strong><span>PK · member_id</span><span>name</span></div><div class=\"edge\"><small>holds</small><div><b>1</b><i></i><b>0..1</b></div></div><div class=\"entity\"><strong>Pass</strong><span>PK · pass_id</span><span>FK · member_id</span></div></div><p>One Member can hold <b>zero or one Pass</b>. Each Pass belongs to <b>exactly one Member</b>. A unique foreign key limits a member to one pass.</p></figure><p>To run this example, open a fresh Query Tool tab in pgAdmin with Auto-commit on. Its temporary tables belong to that tab.</p><div class=\"codehead\"><strong>PostgreSQL · pgAdmin</strong><button type=\"button\" data-copy>Copy code</button></div><pre><code>CREATE TEMP TABLE member (member_id int PRIMARY KEY);\nCREATE TEMP TABLE pass (\n  pass_id int PRIMARY KEY,\n  member_id int NOT NULL UNIQUE REFERENCES member(member_id)\n);\nINSERT INTO member VALUES (7),(8);\nINSERT INTO pass VALUES (40,7);\nSELECT m.member_id, p.pass_id FROM member m\nLEFT JOIN pass p ON p.member_id = m.member_id ORDER BY m.member_id;</code></pre><div class=\"out\"><strong>Result</strong><p>Member 7 has pass 40. Member 8 appears with NULL for pass_id.</p></div><h3>Why it works</h3><ol class=\"reason\"><li>NOT NULL on Pass.member_id means a pass cannot be unassigned. Member can still exist without a Pass row.</li><li>UNIQUE prevents two passes pointing to the same member. LEFT JOIN keeps member 8 in the report.</li></ol></article>", "<article class=\"case\"><h2>A joining date belongs to a membership</h2><p>Ada joins Chess in September and Art in October. Bo also joins Chess, on a different date. The system allows one membership per student and club.</p><figure class=\"blueboard\"><figcaption>Many-to-many · Student and Club</figcaption><div class=\"bridge\"><div class=\"entity\"><strong>Student</strong><span>PK · student_id</span></div><div class=\"entity\"><strong>Membership</strong><span>PK + FK · student_id</span><span>PK + FK · club_id</span><span>joined_on</span></div><div class=\"entity\"><strong>Club</strong><span>PK · club_id</span></div></div><div class=\"bridgelabel\">Student (1) ─ (0..*) Membership (0..*) ─ (1) Club</div><p>One Student can have many Membership rows. One Club can have many Membership rows. <b>Each Membership connects exactly one student to exactly one club.</b></p></figure><div class=\"tbl-scroll\"><table><caption>Membership · names shown beside IDs for readability</caption><thead><tr><th scope=\"col\">student_id</th><th scope=\"col\">club_id</th><th scope=\"col\">joined_on</th></tr></thead><tbody><tr><td>7 · Ada</td><td>3 · Chess</td><td>Sep 4</td></tr><tr><td>7 · Ada</td><td>4 · Art</td><td>Oct 2</td></tr><tr><td>8 · Bo</td><td>3 · Chess</td><td>Sep 9</td></tr></tbody></table></div><div class=\"out\"><strong>Result</strong><p>Use Student(student_id PK, name), Club(club_id PK, name) and Membership(student_id FK, club_id FK, joined_on). The primary key of Membership is (student_id, club_id).</p></div><h3>Why it works</h3><ol class=\"reason\"><li>Storing the date on Student would give Ada only one date for both clubs. Storing it on Club would give every Chess member the same date.</li><li>Each date describes one pair. The pair (7, 3) appears once, while either individual ID can repeat.</li></ol></article>"], "links": ["Tables and keys", "ER blueprints", "Three relationship patterns"]}, {"deck": "A transaction groups changes that belong together. Sending two dollars changes two balances. If the second change fails, undoing the first keeps the money accounted for.", "body": "<section class=\"reading\"><h2>A transfer has one boundary</h2><p>A transaction is a unit of work with a beginning and an end. BEGIN opens it. The database runs each statement inside it. COMMIT accepts its changes. ROLLBACK cancels its changes and ends it. An ordinary statement outside an explicit transaction is often committed on its own when auto-commit is enabled.</p><figure class=\"trace\"><figcaption>Move $2 from Ada to Bo</figcaption><div class=\"tbl-scroll\"><table><thead><tr><th scope=\"col\">Step</th><th scope=\"col\">Ada</th><th scope=\"col\">Bo</th><th scope=\"col\">What the transaction sees</th></tr></thead><tbody><tr><td>Before BEGIN</td><td>$5</td><td>$2</td><td>Saved total = $7</td></tr><tr><td>Subtract from Ada</td><td>$3</td><td>$2</td><td>Only half the transfer has run</td></tr><tr><td>Add to Bo</td><td>$3</td><td>$4</td><td>Both updates are ready</td></tr><tr><td>After COMMIT</td><td>$3</td><td>$4</td><td>New balances saved</td></tr></tbody></table></div></figure><div class=\"out\"><strong>Result</strong><p>If the credit fails before commit and the transaction rolls back, the balances are $5 and $2. A later rollback cannot cancel a transfer that already committed.</p></div></section><section class=\"reading\"><h2>ACID explained with the same transfer</h2><div class=\"tbl-scroll\"><table><thead><tr><th scope=\"col\">Property</th><th scope=\"col\">Promise</th><th scope=\"col\">Example</th></tr></thead><tbody><tr><td>Atomicity</td><td>All changes in the transaction take effect together.</td><td>A failed credit also cancels the debit.</td></tr><tr><td>Consistency</td><td>Correct operations preserve the declared rules and business invariants.</td><td>CHECK(balance >= 0) rejects a negative balance. Correct transfer logic also preserves the total.</td></tr><tr><td>Isolation</td><td>The isolation level controls how concurrent work can interact.</td><td>Under PostgreSQL Read Committed, another reader cannot see the uncommitted debit.</td></tr><tr><td>Durability</td><td>A successfully committed change survives a crash under durable settings.</td><td>The database uses its durable records to recover the $3 and $4 balances.</td></tr></tbody></table></div></section><section class=\"reading\"><h2>SQL success and business success</h2><p>An UPDATE looking for an available seat can match zero rows. That is a valid SQL result, but the purchase has failed to reserve a seat. A correct program checks that exactly one row changed before inserting the booking. The transaction groups the steps. The condition and row-count check enforce the business rule.</p></section><section class=\"reading\"><h2>A savepoint is a partial rewind</h2><p>SAVEPOINT marks a spot inside an open transaction. ROLLBACK TO removes changes after that spot while earlier changes stay pending. For example, an order costs $25 and an optional gift wrap adds $3. Set a savepoint after creating the order. Undoing the wrap restores $25. A final COMMIT saves the $25 order.</p></section><section class=\"reading\"><h2>TRY…CATCH: the transfer’s failure path</h2><p>A transaction defines which changes belong together. Error handling decides what the program does when a step fails. Think of TRY as “attempt these steps” and CATCH as “handle a failure.” In SQL Server, put the work inside TRY, commit after success, and handle rollback in CATCH. TRY…CATCH does not automatically create a transaction or guarantee that it has been rolled back.</p><p>In this example, A starts at 100 and B at 40. The debit temporarily makes A=70. A deliberately raised error skips the credit and COMMIT, then enters CATCH. XACT_STATE() reports whether a transaction is active. ROLLBACK restores A=100 and B=40.</p><div class=\"codehead\"><strong>SQL Server · T-SQL</strong><button type=\"button\" data-copy>Copy code</button></div><pre><code>-- SQL Server only. Run with no existing transaction.\nCREATE TABLE #TransferDemo (\n  id char(1) PRIMARY KEY,\n  balance int NOT NULL CHECK (balance &gt;= 0)\n);\nINSERT INTO #TransferDemo VALUES (&#x27;A&#x27;,100),(&#x27;B&#x27;,40);\n\nBEGIN TRY\n  BEGIN TRANSACTION;\n  UPDATE #TransferDemo SET balance = balance - 30 WHERE id = &#x27;A&#x27;;\n  -- Deliberate failure to demonstrate the error path:\n  THROW 50001, &#x27;Credit failed&#x27;, 1;\n  UPDATE #TransferDemo SET balance = balance + 30 WHERE id = &#x27;B&#x27;;\n  COMMIT TRANSACTION;\nEND TRY\nBEGIN CATCH\n  IF XACT_STATE() &lt;&gt; 0 ROLLBACK TRANSACTION;\n  SELECT ERROR_MESSAGE() AS error_message;\nEND CATCH;\nSELECT id, balance FROM #TransferDemo ORDER BY id;</code></pre><div class=\"out\"><strong>Expected result</strong><p>The first result reports “Credit failed.” The balances are A=100 and B=40. For the successful path, rerun in a fresh session with the deliberate THROW line removed: the balances become A=70 and B=70, and CATCH is skipped.</p></div><p><strong>XACT_STATE():</strong> 0 means no active transaction; 1 means active and committable; -1 means active but uncommittable. An uncommittable transaction needs a full rollback. In reusable application code, a bare <code>THROW;</code> after rollback reports the original error to the caller. This demonstration selects the error message so you can inspect the final balances.</p><p><strong>Business checks still matter:</strong> an UPDATE affecting zero rows is not a SQL error. Check <code>@@ROWCOUNT</code> immediately after each required UPDATE and raise an error if it is not 1. Otherwise a missing recipient could leave a debit with no credit.</p><p>This example owns its whole transaction and assumes no transaction was already open. A reusable procedure must follow an agreed transaction-ownership policy so it does not unexpectedly roll back its caller’s work.</p></section><section class=\"reading\"><h2>PostgreSQL uses BEGIN…EXCEPTION…END</h2><p>The same error-handling idea has different syntax in PostgreSQL. Inside PL/pgSQL, BEGIN and END group statements; that BEGIN does not start a SQL transaction. An EXCEPTION handler automatically rolls back database changes within its protected block before it runs. Successful work outside an inner protected block is not automatically cancelled with it.</p><p>Use <code>RAISE EXCEPTION</code> to signal failure. The worked example catches that deliberately raised error, prints a notice and leaves both balances unchanged. A notice is just a message. In production, rethrow an error when callers need to know the operation failed; do not silently pretend the transfer succeeded.</p><p><a href=\"#topic-2-3\">Run the PostgreSQL error-handling example</a>. A plain SQL transaction with an unhandled error instead needs ROLLBACK, or a valid ROLLBACK TO SAVEPOINT, before normal work can continue. You cannot COMMIT or ROLLBACK from inside a PL/pgSQL block that has an EXCEPTION handler.</p><p>Reference: <a href=\"https://learn.microsoft.com/en-us/sql/t-sql/language-elements/try-catch-transact-sql\">SQL Server error handling</a> · <a href=\"https://www.postgresql.org/docs/18/plpgsql-control-structures.html#PLPGSQL-ERROR-TRAPPING\">PostgreSQL error handling</a>.</p></section>", "examples": ["<article class=\"case\"><h2>Commit a successful transfer</h2><p>Two balances start at 5 and 2. A transfer moves 2 from A to B.</p><p>To run this example, open a fresh Query Tool tab in pgAdmin with Auto-commit on. Its temporary tables belong to that tab.</p><div class=\"codehead\"><strong>PostgreSQL · pgAdmin</strong><button type=\"button\" data-copy>Copy code</button></div><pre><code>CREATE TEMP TABLE wallet (id text PRIMARY KEY, balance int CHECK (balance &gt;= 0));\nINSERT INTO wallet VALUES (&#x27;A&#x27;,5),(&#x27;B&#x27;,2);\nBEGIN;\nUPDATE wallet SET balance = balance - 2 WHERE id = &#x27;A&#x27;;\nUPDATE wallet SET balance = balance + 2 WHERE id = &#x27;B&#x27;;\nCOMMIT;\nSELECT * FROM wallet ORDER BY id;</code></pre><div class=\"out\"><strong>Result</strong><p>A = 3 and B = 4. The total is still 7.</p></div><h3>Why it works</h3><ol class=\"reason\"><li>The two UPDATE statements affect different rows inside one transaction.</li><li>COMMIT records the completed transfer. A new transaction reads the new balances.</li></ol></article>", "<article class=\"case\"><h2>Catch a failed transfer and restore both balances</h2><p>A starts with 100 and B with 40. The code deliberately raises an error after the debit. Run this complete example in a fresh pgAdmin Query Tool tab with Auto-commit on.</p><div class=\"codehead\"><strong>PostgreSQL · pgAdmin</strong><button type=\"button\" data-copy>Copy code</button></div><pre><code>-- PostgreSQL: use a fresh pgAdmin Query Tool tab, Auto-commit on.\nCREATE TEMP TABLE error_wallet (\n  id text PRIMARY KEY,\n  balance integer NOT NULL CHECK (balance &gt;= 0)\n);\nINSERT INTO error_wallet VALUES (&#x27;A&#x27;,100),(&#x27;B&#x27;,40);\n\nDO $$\nBEGIN\n  BEGIN\n    UPDATE error_wallet SET balance = balance - 30 WHERE id = &#x27;A&#x27;;\n    RAISE EXCEPTION &#x27;Credit failed&#x27;; -- deliberate failure\n    UPDATE error_wallet SET balance = balance + 30 WHERE id = &#x27;B&#x27;;\n  EXCEPTION WHEN raise_exception THEN\n    RAISE NOTICE &#x27;Transfer cancelled: %&#x27;, SQLERRM;\n  END;\nEND;\n$$;\nSELECT id, balance FROM error_wallet ORDER BY id;</code></pre><div class=\"out\"><strong>Expected answer</strong><p>Messages shows “Transfer cancelled: Credit failed.” The result contains A=100 and B=40. The debit was undone automatically when the inner block entered its EXCEPTION handler.</p></div><ol><li>The setup creates temporary rows and commits them separately with Auto-commit.</li><li>The inner block debits A, making its temporary balance 70.</li><li>RAISE EXCEPTION stops the success path before the credit.</li><li>The matching handler is entered after the inner block’s changes are rolled back. A is restored to 100; B stays 40.</li><li>The notice reports the demonstration’s failure. Removing the deliberate RAISE EXCEPTION line and running in a fresh tab follows the success path: A=70 and B=70.</li></ol><p>The SQL Server version uses TRY…CATCH and an explicit rollback; this PostgreSQL version uses an EXCEPTION block with automatic rollback of that block’s changes. Earlier committed deposits survive both versions. A handler for <code>raise_exception</code> catches this deliberate error specifically; unrelated errors are not silently swallowed.</p></article>", "<article class=\"case\"><h2>Remove gift wrap and keep the order</h2><p>A shop adds a gift-wrap fee and then the customer declines it. The base order should still be saved.</p><p>To run this example, open a fresh Query Tool tab in pgAdmin with Auto-commit on. Its temporary tables belong to that tab.</p><div class=\"codehead\"><strong>PostgreSQL · pgAdmin</strong><button type=\"button\" data-copy>Copy code</button></div><pre><code>CREATE TEMP TABLE receipt (item text, price int);\nBEGIN;\nINSERT INTO receipt VALUES (&#x27;Book&#x27;,25);\nSAVEPOINT base_order;\nINSERT INTO receipt VALUES (&#x27;Wrap&#x27;,3);\nROLLBACK TO SAVEPOINT base_order;\nCOMMIT;\nSELECT item,price FROM receipt;</code></pre><div class=\"out\"><strong>Result</strong><p>One row remains: Book | 25.</p></div><h3>Why it works</h3><ol class=\"reason\"><li>The book was inserted before the marker. The wrap was inserted after it.</li><li>ROLLBACK TO keeps the transaction open. COMMIT saves the surviving change.</li></ol></article>"], "links": ["Transfer boundaries", "The four ACID properties", "Savepoints"]}, {"deck": "SQL is the language used to describe tables, change the facts inside them, and ask for results. A query can turn individual time entries into one total per project.", "body": "<section class=\"reading\"><h2>Structure and data are different things</h2><p>Imagine a blank attendance sheet. Adding a column for the date changes the design of the sheet. Marking Ada present changes a value on it. SQL makes the same distinction. <b>Data definition language (DDL)</b> describes database objects. <b>Data manipulation language (DML)</b> works with their rows.</p><div class=\"tbl-scroll\"><table><thead><tr><th scope=\"col\">Command</th><th scope=\"col\">What changes</th><th scope=\"col\">Small example</th></tr></thead><tbody><tr><td>CREATE TABLE</td><td>Makes a new structure.</td><td>CREATE TABLE item (id int PRIMARY KEY)</td></tr><tr><td>ALTER TABLE</td><td>Changes an existing structure.</td><td>ALTER TABLE item ADD COLUMN price int</td></tr><tr><td>DROP TABLE</td><td>Removes the table itself and its rows.</td><td>DROP TABLE item</td></tr></tbody></table></div><p><b>CRUD</b> names four row operations. INSERT creates a row, SELECT reads rows, UPDATE changes matching rows, and DELETE removes matching rows. A missing WHERE on UPDATE or DELETE makes every row eligible.</p></section><section class=\"reading\"><h2>A query flows from rows to groups</h2><p>Suppose the work log contains Atlas hours 2 and 6, Beacon hours 4 and 1, and Comet hours 9. We want project totals, counting only entries of at least 2 hours and showing only totals of at least 6.</p><figure class=\"trace\"><figcaption>Follow the rows through the report</figcaption><div class=\"tbl-scroll\"><table><thead><tr><th scope=\"col\">Stage</th><th scope=\"col\">Intermediate result</th><th scope=\"col\">Reason</th></tr></thead><tbody><tr><td>FROM / JOIN</td><td>Five entries paired with their project names.</td><td>Match the project key in both tables.</td></tr><tr><td>WHERE hours >= 2</td><td>Atlas 2, Atlas 6, Beacon 4, Comet 9.</td><td>Discard the single 1-hour row.</td></tr><tr><td>GROUP BY project</td><td>Atlas [2,6], Beacon [4], Comet [9].</td><td>One bucket per project.</td></tr><tr><td>HAVING SUM(hours) >= 6</td><td>Atlas 8, Comet 9.</td><td>Discard the Beacon group.</td></tr><tr><td>SELECT / ORDER BY</td><td>Comet 9, then Atlas 8.</td><td>Return name and total, sorted largest first.</td></tr></tbody></table></div></figure></section><section class=\"reading\"><h2>Joins and missing matches</h2><p>An <b>inner join</b> returns matching pairs. A <b>left join</b> also keeps every row from the left input. When it finds no match, columns from the right are NULL, meaning no value is present. This matters when the report needs a club with zero members.</p><dl class=\"concepts\"><div><dt>COUNT(*)</dt><dd>Counts rows, including the placeholder row a left join produces.</dd></div><div><dt>COUNT(member_id)</dt><dd>Counts only non-NULL member IDs. A club with no match gets zero.</dd></div><div><dt>SUM, AVG, MIN, MAX</dt><dd>Add values, average them, or select extremes. These aggregates skip NULL inputs. SQL uses IS NULL to check for a missing value.</dd></div></dl></section><section class=\"reading\"><h2>Filtering and sorting details</h2><p>WHERE fee BETWEEN 10 AND 20 includes both 10 and 20. WHERE name LIKE 'A%' selects names beginning with A. WHERE region IN ('East','West') accepts either listed value. ORDER BY total DESC, name ASC gives a predictable order when totals tie. Without ORDER BY, row order is unspecified.</p></section><section class=\"reading\"><h2>Aggregate rules and NULLs: avoid a common query error</h2><p>In a grouped query, each selected expression must be aggregated, be a grouping expression, or satisfy a supported functional-dependency rule. For a clear portable answer, list every nonaggregated selected column in GROUP BY. The database cannot choose one employee name for an entire department group without a rule.</p><div class=\"codehead\"><strong>PostgreSQL · pgAdmin</strong><button type=\"button\" data-copy>Copy code</button></div><pre><code>WITH staff(dept, name, salary) AS (\n  VALUES (&#x27;A&#x27;,&#x27;Ada&#x27;,100), (&#x27;A&#x27;,&#x27;Bo&#x27;,NULL::integer), (&#x27;B&#x27;,&#x27;Lia&#x27;,300)\n)\nSELECT dept, COUNT(*) AS people, COUNT(salary) AS known_salaries,\n       SUM(salary) AS total, AVG(salary) AS average\nFROM staff\nGROUP BY dept\nORDER BY dept;</code></pre><div class=\"out\"><strong>Worked answer</strong><p>A has people=2, known_salaries=1, total=100 and average=100. B has 1, 1, 300 and 300. NULL is not treated as zero by AVG. COUNT returns 0 on an empty input; SUM, AVG, MIN and MAX return NULL when there are no non-NULL inputs. A grouped query with no groups returns no rows.</p></div><p><code>WHERE SUM(salary) &gt; 200</code> is invalid at the row-filter stage. Use <code>HAVING SUM(salary) &gt; 200</code> after grouping. In this example, only B remains. <code>SELECT dept, name, SUM(salary) GROUP BY dept</code> has no rule selecting one name, so it is not a valid portable grouped query.</p></section><section class=\"reading\"><h2>Subqueries: one value, several values, or existence</h2><p>A scalar comparison such as <code>branch_id = (SELECT ...)</code> expects at most one result value. When several branch IDs are legitimate, use IN or an appropriate join. EXISTS answers whether a match exists.</p><div class=\"codehead\"><strong>PostgreSQL · pgAdmin</strong><button type=\"button\" data-copy>Copy code</button></div><pre><code>WITH branch(id, city) AS (VALUES (1,&#x27;London&#x27;),(2,&#x27;London&#x27;),(3,&#x27;Paris&#x27;)),\n     staff(name, branch_id) AS (VALUES (&#x27;Ada&#x27;,1),(&#x27;Bo&#x27;,2),(&#x27;Lia&#x27;,3))\nSELECT name\nFROM staff\nWHERE branch_id IN (SELECT id FROM branch WHERE city=&#x27;London&#x27;)\nORDER BY name;</code></pre><div class=\"out\"><strong>Worked answer</strong><p>Ada and Bo are returned. Replacing IN with = makes the inner query a scalar subquery, which fails here because it returns two rows. A correlated alternative is WHERE EXISTS (SELECT 1 FROM branch b WHERE b.id=staff.branch_id AND b.city='London').</p></div><div class=\"tbl-scroll\"><table><thead><tr><th scope=\"col\">Comparison, non-NULL values</th><th scope=\"col\">Result</th><th scope=\"col\">Reason</th></tr></thead><tbody><tr><td>25 &gt; ANY (10,30)</td><td>True</td><td>At least one comparison succeeds.</td></tr><tr><td>25 &gt; ALL (10,30)</td><td>False</td><td>25 is not greater than 30.</td></tr><tr><td>DATE &#x27;2025-03-01&#x27; &gt; ALL (Jan 1, Feb 1 of 2025)</td><td>True</td><td>Comparable date values support these operators too.</td></tr></tbody></table></div><p>The parentheses above show the input values conceptually; executable SQL supplies a subquery, for example <code>25 &gt; ANY (SELECT n FROM (VALUES (10),(30)) AS v(n))</code>. With NULLs, ANY or ALL can yield unknown when no true/false comparison decides the outcome. <code>NOT IN</code> is particularly easy to misuse if its subquery returns NULL; a properly correlated NOT EXISTS often expresses an anti-match more clearly.</p></section><section class=\"reading\"><h2>Duplicate rows, constraints and named queries</h2><div class=\"tbl-scroll\"><table><thead><tr><th scope=\"col\">Feature</th><th scope=\"col\">Solved example</th><th scope=\"col\">Why</th></tr></thead><tbody><tr><td>UNION / UNION ALL</td><td>(SELECT 1 AS n UNION SELECT 1) returns one row; UNION ALL returns two.</td><td>UNION removes duplicate complete rows; inputs need matching column counts and compatible types.</td></tr><tr><td>CHECK and NOT NULL</td><td>quantity integer NOT NULL CHECK(quantity &gt; 0)</td><td>These enforce different rules: a value is required and it must be positive.</td></tr><tr><td>DEFAULT</td><td>status text DEFAULT &#x27;new&#x27;</td><td>An omitted status gets &#x27;new&#x27;; an explicit NULL does not request the default.</td></tr><tr><td>View</td><td>CREATE VIEW staff_counts AS SELECT office_id, COUNT(*) AS total FROM Staff GROUP BY office_id;</td><td>SELECT * FROM staff_counts reads the named query. The ordinary view is not a stored snapshot.</td></tr></tbody></table></div><div class=\"out\"><strong>Worked answer</strong><p>With staff rows (office 1, Ada), (office 1, Bo), and (office 2, Lia), staff_counts returns (1,2) and (2,1). An office with no staff is absent unless the view starts from Office and uses a LEFT JOIN with COUNT(Staff.staff_id).</p></div></section>", "examples": ["<article class=\"case\"><h2>Create a table and change one row</h2><p>A shop records two pencils, adds a price column, updates one price, then removes a discontinued product.</p><p>To run this example, open a fresh Query Tool tab in pgAdmin with Auto-commit on. Its temporary tables belong to that tab.</p><div class=\"codehead\"><strong>PostgreSQL · pgAdmin</strong><button type=\"button\" data-copy>Copy code</button></div><pre><code>CREATE TEMP TABLE item (id int PRIMARY KEY, name text);\nALTER TABLE item ADD COLUMN price int;\nINSERT INTO item VALUES (1,&#x27;Blue pencil&#x27;,2),(2,&#x27;Red pencil&#x27;,3);\nUPDATE item SET price = 4 WHERE id = 1;\nDELETE FROM item WHERE id = 2;\nSELECT * FROM item ORDER BY id;</code></pre><div class=\"out\"><strong>Result</strong><p>1 | Blue pencil | 4.</p></div><h3>Why it works</h3><ol class=\"reason\"><li>ALTER adds a place for price. INSERT creates the rows. The two WHERE clauses target different IDs.</li><li>DELETE removes the red pencil while preserving the table. DROP TABLE item would remove the entire temporary table.</li></ol></article>", "<article class=\"case\"><h2>Count members even for an empty club</h2><p>Chess has two members. Art is open for registration and has none.</p><div class=\"codehead\"><strong>PostgreSQL · pgAdmin</strong><button type=\"button\" data-copy>Copy code</button></div><pre><code>WITH club(id,name) AS (VALUES (1,&#x27;Chess&#x27;),(2,&#x27;Art&#x27;)),\nmember(id,club_id) AS (VALUES (10,1),(11,1))\nSELECT c.name, COUNT(m.id) AS members\nFROM club c LEFT JOIN member m ON m.club_id = c.id\nGROUP BY c.id,c.name ORDER BY c.name;</code></pre><div class=\"out\"><strong>Result</strong><p>Art | 0, then Chess | 2.</p></div><h3>Why it works</h3><ol class=\"reason\"><li>The WITH clauses create small named sets of sample rows for this query. LEFT JOIN preserves Art.</li><li>For Art, m.id is NULL. COUNT(m.id) skips it. COUNT(*) would incorrectly report one member.</li></ol></article>", "<article class=\"case\"><h2>Report projects with enough qualifying hours</h2><p>The report uses the five entries from the lesson and joins each entry to its project.</p><div class=\"codehead\"><strong>PostgreSQL · pgAdmin</strong><button type=\"button\" data-copy>Copy code</button></div><pre><code>WITH project(id,name) AS (VALUES (1,&#x27;Atlas&#x27;),(2,&#x27;Beacon&#x27;),(3,&#x27;Comet&#x27;)),\nwork(project_id,hours) AS (VALUES (1,2),(1,6),(2,4),(2,1),(3,9))\nSELECT p.name, SUM(w.hours) AS total\nFROM project p JOIN work w ON w.project_id = p.id\nWHERE w.hours &gt;= 2\nGROUP BY p.id,p.name\nHAVING SUM(w.hours) &gt;= 6\nORDER BY total DESC,p.name;</code></pre><div class=\"out\"><strong>Result</strong><p>Comet | 9, then Atlas | 8.</p></div><h3>Why it works</h3><ol class=\"reason\"><li>WHERE removes Beacon’s 1-hour entry before grouping. Its group then totals only 4.</li><li>HAVING checks the total after grouping. ORDER BY places 9 ahead of 8.</li></ol></article>"], "links": ["Table definitions and CRUD", "Joining rows", "Grouped reports"]}, {"deck": "A stored procedure is a set of instructions saved under a name in the database. The caller supplies values, and the database carries out the same steps with those values.", "body": "<section class=\"reading\"><h2>From one query to a reusable procedure</h2><p>A school frequently lists students by department. Writing a separate query for every department repeats the same logic. A procedure defines the logic once. An <b>input parameter</b> is a named slot such as department ID. An <b>argument</b> is the actual value, such as 10, supplied for one call.</p><figure class=\"trace\"><figcaption>One procedure, two calls</figcaption><div class=\"tbl-scroll\"><table><thead><tr><th scope=\"col\">Stored rows</th><th scope=\"col\">Call with 10</th><th scope=\"col\">Call with 20</th></tr></thead><tbody><tr><td>Ada · department 10</td><td>Ada appears</td><td>—</td></tr><tr><td>Bo · department 20</td><td>—</td><td>Bo appears</td></tr><tr><td>Lia · department 10</td><td>Lia appears</td><td>—</td></tr></tbody></table></div></figure><p>Inside the procedure, compare the column to the parameter. If the code compares department_id to itself, every row with a non-NULL department passes, even when it belongs to the wrong department.</p></section><section class=\"reading\"><h2>Variables, decisions and repetition</h2><dl class=\"concepts\"><div><dt>Local variable</dt><dd>A named place for a changing value during one call. A running total starts at 0. A running product starts at 1.</dd></div><div><dt>IF / ELSE</dt><dd>Selects one branch. An invalid quantity can be rejected before any rows change. A valid quantity continues to the update.</dd></div><div><dt>WHILE loop</dt><dd>Repeats while its condition is true. To add 1 through 3, start i at 1, add i, then increase i each pass. The totals become 1, 3, 6. When i reaches 4 the loop stops.</dd></div><div><dt>Validation and error handling</dt><dd>Check inputs before work. If an unexpected error interrupts a multi-step update, undo the unfinished transaction and report the failure to the caller.</dd></div></dl></section><section class=\"reading\"><h2>SQL Server and PostgreSQL use different procedure syntax</h2><div class=\"tbl-scroll\"><table><thead><tr><th scope=\"col\">Operation</th><th scope=\"col\">SQL Server (T-SQL)</th><th scope=\"col\">PostgreSQL (PL/pgSQL)</th></tr></thead><tbody><tr><td>Input parameter</td><td>@dept INT</td><td>IN p_dept integer</td></tr><tr><td>Run the procedure</td><td>EXEC GetStudentsByDepartment @dept = 10</td><td>CALL procedure_name(...)</td></tr><tr><td>Return a list of rows</td><td>A SELECT in the body returns a result set.</td><td>A procedure can open a refcursor. The caller fetches its rows before the transaction ends.</td></tr><tr><td>Signal an error</td><td>THROW</td><td>RAISE EXCEPTION</td></tr></tbody></table></div><p>A <b>cursor</b> is a handle for reading query results. In the department example, the PostgreSQL procedure opens a named cursor and FETCH ALL reads its rows. COMMIT closes an ordinary transaction-scoped cursor.</p></section><section class=\"reading\"><h2>Put the commit at the right boundary</h2><p>For a two-step operation, one transaction must cover both steps. One common PostgreSQL pattern lets the caller do BEGIN, CALL, then COMMIT on success or ROLLBACK after failure. The procedure can validate and raise an error without committing independently. In SQL Server, TRY/CATCH can bracket BEGIN TRANSACTION and COMMIT, with rollback in CATCH if a transaction is active.</p></section><section class=\"reading\"><h2>Messages, early exits and temporary work</h2><p>A message, an error, and a rollback do different jobs. PRINT reports information in SQL Server; RETURN exits a procedure; THROW signals an error; ROLLBACK undoes the open transaction. Printing “failed” and returning after an UPDATE does not undo the update.</p><div class=\"codehead\"><strong>SQL Server · T-SQL</strong><button type=\"button\" data-copy>Copy code</button></div><pre><code>DECLARE @count int;\nSET @count = 0;\nWHILE @count &lt; 3\nBEGIN\n  PRINT @count;\n  SET @count = @count + 1;\nEND;</code></pre><div class=\"out\"><strong>Worked answer</strong><p>The messages are 0, 1 and 2. SET advances the variable. The next condition checks 3 &lt; 3, which is false, so the loop stops. This is message output, not a table result set.</p></div><p>A temporary table can hold intermediate results. Prefer a local SQL Server <code>#Work</code> table for session-specific work; <code>##Work</code> is global and can be visible to other sessions. In PostgreSQL, use <code>CREATE TEMP TABLE</code>. Copying rows with INSERT…SELECT and then deleting the source should share one transaction when they form one move; a failure between the steps must not leave only half of the move completed.</p></section><section class=\"reading\"><h2>Choose one matching branch and distinguish automatic triggers</h2><p>When ranges overlap, test the highest threshold first. With separate IF statements, several branches may run and add several surcharges. An IF…ELSE chain or searched CASE picks one branch.</p><div class=\"codehead\"><strong>PostgreSQL · pgAdmin</strong><button type=\"button\" data-copy>Copy code</button></div><pre><code>WITH lesson(miles, fee) AS (VALUES (20,50),(23,50),(27,50),(31,50))\nSELECT miles, fee + CASE\n  WHEN miles &gt; 30 THEN 10\n  WHEN miles &gt; 25 THEN 8\n  WHEN miles &gt; 20 THEN 5\n  ELSE 0 END AS adjusted_fee\nFROM lesson ORDER BY miles;</code></pre><div class=\"out\"><strong>Worked answer</strong><p>The resulting fees are 50, 55, 58 and 60. At 31 miles, the first true condition chooses 10; later conditions are not used. This set-based form performs the same fee decision that a row-by-row cursor loop could perform.</p></div><p>A procedure runs when explicitly called. A trigger runs automatically for its declared event. An ordinary view is a named query. For a “maximum clients per instructor” rule, a trigger that merely counts rows can race with another transaction; correct enforcement also needs an appropriate locking or isolation strategy. Knowing the definition does not make a naive count-based trigger concurrency-safe.</p></section>", "examples": ["<article class=\"case\"><h2>List students in department 10</h2><p>Students contains Ada (1, department 10), Bo (2, department 20) and Lia (3, department 10). Both dialects answer the same request.</p><div class=\"codehead\"><strong>SQL Server · assumes Students already exists</strong><button type=\"button\" data-copy>Copy code</button></div><pre><code>CREATE PROCEDURE GetStudentsByDepartment @dept INT\nAS\nBEGIN\n  SELECT student_id,student_name,department_id\n  FROM Students WHERE department_id = @dept ORDER BY student_id;\nEND;\nGO\nEXEC GetStudentsByDepartment @dept = 10;</code></pre><p>To run this example, open a fresh Query Tool tab in pgAdmin with Auto-commit on. Its temporary tables belong to that tab.</p><div class=\"codehead\"><strong>PostgreSQL · pgAdmin</strong><button type=\"button\" data-copy>Copy code</button></div><pre><code>CREATE TEMP TABLE students (student_id int PRIMARY KEY, student_name text, department_id int);\nINSERT INTO students VALUES (1,&#x27;Ada&#x27;,10),(2,&#x27;Bo&#x27;,20),(3,&#x27;Lia&#x27;,10);\nCREATE PROCEDURE pg_temp.students_by_department(IN p_dept int, IN result refcursor)\nLANGUAGE plpgsql AS $$\nBEGIN\n  IF p_dept IS NULL THEN RAISE EXCEPTION &#x27;Department is required&#x27;; END IF;\n  OPEN result FOR SELECT s.* FROM pg_temp.students s\n    WHERE s.department_id = p_dept ORDER BY s.student_id;\nEND; $$;\nBEGIN;\nCALL pg_temp.students_by_department(10,&#x27;matches&#x27;);\nFETCH ALL FROM matches;</code></pre><p>Run through FETCH to see the rows in Data Output. Then execute <code>COMMIT;</code> in the same tab.</p><div class=\"out\"><strong>Result</strong><p>1 | Ada | 10 and 3 | Lia | 10.</p></div><h3>Why it works</h3><ol class=\"reason\"><li>Both procedures compare the stored department ID to the supplied value. Bo belongs to 20, so his row does not qualify.</li><li>SQL Server sends the SELECT result to the caller. PostgreSQL exposes the rows through the cursor while the transaction is open.</li></ol></article>", "<article class=\"case\"><h2>Calculate 4 factorial with a loop</h2><p>Factorial multiplies the whole numbers from 1 to the input. For 4, the result is 1 × 2 × 3 × 4. This example accepts integers from 0 through 12.</p><p>To run this example, open a fresh Query Tool tab in pgAdmin with Auto-commit on. Its temporary tables belong to that tab.</p><div class=\"codehead\"><strong>PostgreSQL · pgAdmin</strong><button type=\"button\" data-copy>Copy code</button></div><pre><code>CREATE TEMP TABLE factorial_run (n int, product int);\nCREATE PROCEDURE pg_temp.save_factorial(IN n int)\nLANGUAGE plpgsql AS $$\nDECLARE i int := 1; result int := 1;\nBEGIN\n  IF n IS NULL OR n &lt; 0 OR n &gt; 12 THEN\n    RAISE EXCEPTION &#x27;Use an integer from 0 through 12&#x27;;\n  END IF;\n  WHILE i &lt;= n LOOP\n    result := result * i;\n    i := i + 1;\n  END LOOP;\n  INSERT INTO pg_temp.factorial_run VALUES (n,result);\nEND; $$;\nCALL pg_temp.save_factorial(4);\nCALL pg_temp.save_factorial(0);\nSELECT * FROM factorial_run ORDER BY n;</code></pre><div class=\"out\"><strong>Result</strong><p>0 | 1 and 4 | 24.</p></div><h3>Why it works</h3><ol class=\"reason\"><li>For 4, the product goes 1, 2, 6, 24. Increasing i makes the loop finish.</li><li>For 0, the loop body never runs, so the initial product 1 is stored. Limiting n to 12 keeps the result within a signed 32-bit integer.</li></ol></article>", "<article class=\"case\"><h2>Reserve stock only when enough exists</h2><p>A shelf holds 3 copies. A call requests 2. A later call requests 4. Validation and transaction handling give each call a definite outcome.</p><p>To run this example, open a fresh Query Tool tab in pgAdmin with Auto-commit on. Its temporary tables belong to that tab.</p><div class=\"codehead\"><strong>PostgreSQL · pgAdmin</strong><button type=\"button\" data-copy>Copy code</button></div><pre><code>CREATE TEMP TABLE stock (id int PRIMARY KEY, qty int NOT NULL CHECK (qty &gt;= 0));\nINSERT INTO stock VALUES (1,3);\nCREATE PROCEDURE pg_temp.reserve(IN wanted int)\nLANGUAGE plpgsql AS $$\nBEGIN\n  IF wanted IS NULL OR wanted &lt;= 0 THEN\n    RAISE EXCEPTION &#x27;Use a positive quantity&#x27;;\n  END IF;\n  UPDATE pg_temp.stock SET qty = qty-wanted WHERE id=1 AND qty&gt;=wanted;\n  IF NOT FOUND THEN RAISE EXCEPTION &#x27;Insufficient stock&#x27;; END IF;\nEND; $$;\nBEGIN;\nCALL pg_temp.reserve(2);\nCOMMIT;\nSELECT qty FROM stock WHERE id=1;</code></pre><p>For the second call, execute <code>BEGIN;</code>, then <code>CALL pg_temp.reserve(4);</code>. It raises “Insufficient stock”. Execute <code>ROLLBACK;</code> and select qty again.</p><div class=\"out\"><strong>Result</strong><p>The successful call leaves 1 copy. The rejected call leaves that same 1 copy.</p></div><h3>Why it works</h3><ol class=\"reason\"><li>The guarded UPDATE checks the available quantity as it changes the row.</li><li>PL/pgSQL sets FOUND to false when the update matches no rows. The procedure turns that condition into an error. Rolling back the second transaction preserves the earlier committed reservation.</li></ol></article>"], "links": ["Parameters and calls", "Variables and loops", "Validation and transactions"]}, {"deck": "Concurrency means two or more transactions overlap. The database needs rules for taking turns so that a correct operation stays correct when someone else is working at the same time.", "body": "<section class=\"reading\"><h2>Two correct calculations can lose a point</h2><p>A scoreboard starts at 10. Each of two players scores once. If both programs first read 10, each calculates 11 in memory. If both save their calculated answer, the scoreboard ends at 11. The missing point is a <b>lost update</b>. The order matters even though each calculation was correct on its own.</p><figure class=\"trace\"><figcaption>A schedule is the order of operations</figcaption><div class=\"tbl-scroll\"><table><thead><tr><th scope=\"col\">Time</th><th scope=\"col\">Transaction A</th><th scope=\"col\">Transaction B</th><th scope=\"col\">Stored score</th></tr></thead><tbody><tr><td>1</td><td>Reads 10</td><td>—</td><td>10</td></tr><tr><td>2</td><td>—</td><td>Reads 10</td><td>10</td></tr><tr><td>3</td><td>Writes 11</td><td>—</td><td>11</td></tr><tr><td>4</td><td>—</td><td>Writes 11</td><td>11</td></tr></tbody></table></div></figure><div class=\"out\"><strong>Result</strong><p>The intended score is 12. Updating score = score + 1 in a single SQL statement lets each update operate on the current row.</p></div></section><section class=\"reading\"><h2>Three problems that look different on paper</h2><dl class=\"concepts\"><div><dt>Lost update</dt><dd>One writer overwrites a change made by another. Both players scoring but only one point appearing is a lost update.</dd></div><div><dt>Dirty read</dt><dd>A reader uses another transaction’s uncommitted change. If that writer rolls back, the reader acted on a value that never became permanent. PostgreSQL prevents dirty reads.</dd></div><div><dt>Inconsistent analysis</dt><dd>A report combines pieces from different moments. Reading A before a transfer and B after it can double-count the transferred amount. A consistent snapshot for the whole report avoids mixing moments.</dd></div></dl></section><section class=\"reading\"><h2>Serial schedules and conflict arrows</h2><p>A <b>serial schedule</b> finishes one transaction before starting the next. A <b>serializable schedule</b> may interleave steps but is equivalent to some serial order. To check <b>conflict serializability</b>, compare operations from different transactions on the same item. Two reads can swap. If either operation writes, their order matters.</p><p>A <b>precedence graph</b> gives each transaction a node. Draw an arrow from the earlier transaction to the later one for each conflict. A cycle means no serial order can preserve every edge. Without a cycle, read a serial order that follows the arrows.</p></section><section class=\"reading\"><h2>Locks control who can proceed</h2><p>A shared lock lets multiple transactions read a resource. An exclusive lock is needed to write and conflicts with another holder’s shared or exclusive lock on that resource. <b>Two-phase locking (2PL)</b> first grows by acquiring locks. Once a lock is released, the transaction shrinks and must acquire no more locks. Strict 2PL holds exclusive locks until commit or rollback.</p><p>Waiting for one busy resource is ordinary blocking. A <b>deadlock</b> requires a cycle of waits. A wait-for graph uses an arrow from the waiting transaction to the transaction holding the needed lock. This arrow describes a current wait. A precedence arrow describes the order of conflicting operations.</p></section><section class=\"reading\"><h2>Two alternatives to waiting on locks</h2><div class=\"tbl-scroll\"><table><thead><tr><th scope=\"col\">Method</th><th scope=\"col\">How it decides</th><th scope=\"col\">Example</th></tr></thead><tbody><tr><td>Timestamp ordering</td><td>Assign transactions an order and reject operations that would violate it.</td><td>An older writer may have to restart if a newer transaction already read the item it wants to change.</td></tr><tr><td>Optimistic control</td><td>Read and compute privately, validate for conflicts, then install the changes.</td><td>Two editors start with version 5. The second save detects version 6 and retries using the newer data.</td></tr></tbody></table></div></section><section class=\"reading\"><h2>Serializability and safe commit order are separate checks</h2><p>A conflict graph answers whether operations can be ordered like a serial execution. Recoverability also considers failures and commit order. A reader must not commit based on a writer that can still roll back.</p><div class=\"tbl-scroll\"><table><thead><tr><th scope=\"col\">Schedule fragment</th><th scope=\"col\">Classification</th><th scope=\"col\">Explanation</th></tr></thead><tbody><tr><td>A writes X; B reads X; B commits; A aborts</td><td>Not recoverable</td><td>B committed using a value that A later cancelled.</td></tr><tr><td>A writes X; B reads X; A commits; B commits</td><td>Recoverable, but not cascadeless</td><td>Commit order is safe, but B did perform a dirty read.</td></tr><tr><td>A writes X; A commits; B reads X; B commits</td><td>Cascadeless</td><td>B reads A’s value only after it commits.</td></tr></tbody></table></div><div class=\"out\"><strong>Worked answer</strong><p>If A aborts while B and C are still uncommitted and depend on its uncommitted data, B and C may also need rollback. Holding exclusive locks until transaction end prevents other transactions from reading those uncommitted writes under the locking model. Basic 2PL alone does not make every schedule cascadeless.</p></div></section><section class=\"reading\"><h2>Deadlock prevention: work through both age rules</h2><p>Use smaller timestamps for older transactions. Let A have timestamp 10 and B timestamp 20. Wait-die and wound-wait use age to prevent circular waiting; they are lock-based prevention policies, distinct from basic timestamp-ordering protocols that avoid waiting for such locks.</p><div class=\"tbl-scroll\"><table><thead><tr><th scope=\"col\">Requester → lock holder</th><th scope=\"col\">Wait-die</th><th scope=\"col\">Wound-wait</th></tr></thead><tbody><tr><td>A (older) → B (younger)</td><td>A waits.</td><td>Abort B; A proceeds after B releases the lock.</td></tr><tr><td>B (younger) → A (older)</td><td>Abort B.</td><td>B waits.</td></tr></tbody></table></div><div class=\"out\"><strong>Worked answer</strong><p>Under wait-die, the requester either waits or dies. Under wound-wait, the requester either wounds a younger holder or waits for an older one. Retaining the original age on these prevention-policy restarts helps avoid repeated loss of priority. A timeout is a practical limit, not evidence that a deadlock definitely exists.</p></div><p>Detection instead lets a wait cycle form, finds it in a wait-for graph, and rolls back a selected victim. Victim choice and retry policy should avoid repeatedly sacrificing the same transaction. Acquiring locks in a consistent resource order is another prevention approach.</p></section><section class=\"reading\"><h2>Granularity, timestamps and optimistic validation</h2><div class=\"tbl-scroll\"><table><thead><tr><th scope=\"col\">Choice</th><th scope=\"col\">Concrete outcome</th><th scope=\"col\">Trade-off</th></tr></thead><tbody><tr><td>Row lock</td><td>Updating one booking need not block an unrelated booking.</td><td>More individual locks to track.</td></tr><tr><td>Table lock</td><td>One lock covers every booking row.</td><td>Less lock-management overhead but more unrelated operations may wait.</td></tr><tr><td>Shared → exclusive upgrade</td><td>A reader requests permission to write the item.</td><td>Two shared holders both upgrading can deadlock; upgrades must follow the protocol.</td></tr></tbody></table></div><p>In <strong>basic timestamp ordering</strong>, a read by T is rejected when TS(T) &lt; W_TS(X). A write is rejected when TS(T) &lt; R_TS(X) or TS(T) &lt; W_TS(X). Successful operations update the corresponding timestamp metadata. This describes the basic protocol; variants can use different rules.</p><div class=\"out\"><strong>Worked answer</strong><p>Let TS(A)=10, R_TS(X)=20 and W_TS(X)=5. A read by A is allowed because 10 is not below the last writer’s 5. A write by A is rejected because transaction 20 already read X, and inserting A’s older write now would violate timestamp order. The basic restarting protocol gives the new transaction a new timestamp, unlike the age-preserving restarts in wait-die/wound-wait.</p></div><p><strong>Optimistic example:</strong> A and B read score=10, version=5. A validates and stores score=11, version=6. B tries to save using expected version=5, so its guarded update affects zero rows. B rereads version=6, recomputes score=12 and retries. The phases are read/compute, validate, then write; stale work must not be installed after failed validation.</p></section>", "examples": ["<article class=\"case\"><h2>Follow a total across two moments</h2><p>A report reads the balance of A, then B in a second statement. Between those reads, a transfer of 20 moves A from 100 to 80 and B from 50 to 70.</p><div class=\"tbl-scroll\"><table><thead><tr><th scope=\"col\">Moment</th><th scope=\"col\">A</th><th scope=\"col\">B</th><th scope=\"col\">True total</th></tr></thead><tbody><tr><td>Before transfer</td><td>100</td><td>50</td><td>150</td></tr><tr><td>After transfer</td><td>80</td><td>70</td><td>150</td></tr></tbody></table></div><div class=\"out\"><strong>Result</strong><p>The report calculates 100 + 70 = 170. No committed state had 170.</p></div><h3>Why it works</h3><ol class=\"reason\"><li>Both individual reads can be committed values. They belong to different snapshots.</li><li>Run the calculation in one SELECT with a statement snapshot, or use a suitable shared transaction snapshot across reads.</li></ol></article>", "<article class=\"case\"><h2>Turn a schedule into a precedence graph</h2><p>A writes X, B reads X, B writes Y, and A reads Y, in that order.</p><figure class=\"trace\"><figcaption>Conflicts on two items</figcaption><div class=\"tbl-scroll\"><table><thead><tr><th scope=\"col\">Item</th><th scope=\"col\">Earlier operation</th><th scope=\"col\">Later operation</th><th scope=\"col\">Required order</th></tr></thead><tbody><tr><td>X</td><td>A writes</td><td>B reads</td><td>A → B</td></tr><tr><td>Y</td><td>B writes</td><td>A reads</td><td>B → A</td></tr></tbody></table></div></figure><div class=\"out\"><strong>Result</strong><p>The graph contains a cycle, so this schedule is not conflict-serializable.</p></div><h3>Why it works</h3><ol class=\"reason\"><li>X requires A before B. Y requires B before A. No one-at-a-time order satisfies both.</li><li>If both edges pointed from A to B, A then B would be a valid serial order.</li></ol></article>", "<article class=\"case\"><h2>Resolve a deadlock between two bookings</h2><p>A holds the lock on seat 4 and requests seat 5. B already holds seat 5 and requests seat 4.</p><figure class=\"trace\"><figcaption>Wait-for graph</figcaption><div class=\"tbl-scroll\"><table><thead><tr><th scope=\"col\">Waiting transaction</th><th scope=\"col\">Needs</th><th scope=\"col\">Held by</th><th scope=\"col\">Wait edge</th></tr></thead><tbody><tr><td>A</td><td>Seat 5</td><td>B</td><td>A → B</td></tr><tr><td>B</td><td>Seat 4</td><td>A</td><td>B → A</td></tr></tbody></table></div></figure><div class=\"out\"><strong>Result</strong><p>Abort and roll back one transaction, for example B. Its lock is released, so A can finish. B can then retry.</p></div><h3>Why it works</h3><ol class=\"reason\"><li>Letting both wait forever cannot free a seat. A deadlock detector can choose a victim to break the cycle.</li><li>If both operations always lock the smaller seat number first, B cannot hold seat 5 while waiting for seat 4 in this scenario.</li></ol></article>"], "links": ["Three concurrency problems", "Serializability and 2PL", "Deadlocks and alternatives"]}, {"deck": "Recovery restores a valid database after a failure. It uses records that survived the failure to keep finished changes and remove the effects of unfinished work.", "body": "<section class=\"reading\"><h2>Memory, disk and a durable log</h2><p>Changing a row often changes a page in memory first. A <b>page</b> is a block the database reads or writes as a unit. Data pages may be written to disk later. A <b>transaction log</b> is a separate ordered record of actions. In the textbook model, an update record can contain the old value (before-image) and new value (after-image). A commit record tells recovery that a transaction finished.</p><figure class=\"trace\"><figcaption>A small surviving log</figcaption><div class=\"tbl-scroll\"><table><thead><tr><th scope=\"col\">Record</th><th scope=\"col\">Meaning</th></tr></thead><tbody><tr><td>START T1</td><td>Transaction T1 begins.</td></tr><tr><td>T1 · X · 4 → 7</td><td>Before-image 4, after-image 7.</td></tr><tr><td>COMMIT T1</td><td>T1 finished successfully.</td></tr><tr><td>T2 · Y · 2 → 5</td><td>T2 changed Y. There is no commit for T2 before the crash.</td></tr></tbody></table></div></figure><p>A <b>crash</b> can wipe memory while leaving disk intact. A <b>media failure</b> can destroy the disk itself. Those events require different sources of recovery information.</p></section><section class=\"reading\"><h2>UNDO, REDO and write-ahead logging</h2><dl class=\"concepts\"><div><dt>UNDO (backward recovery)</dt><dd>Remove an unfinished transaction’s effects. If Y was 2 and an unfinished write put 5 on disk, restore 2. Undo repeated writes in reverse order.</dd></div><div><dt>REDO (forward recovery)</dt><dd>Reapply a change that should survive. If committed X = 7 is missing from the data file, use the after-value 7.</dd></div><div><dt>Write-ahead logging (WAL)</dt><dd>Make the relevant log information durable before writing the changed data page. A durable commit also needs its required log records on stable storage before success is acknowledged.</dd></div><div><dt>Checkpoint</dt><dd>Record recovery progress and information needed to restart efficiently. Active work may cross the checkpoint. A checkpoint is neither a commit for those transactions nor a substitute for a backup.</dd></div></dl></section><section class=\"reading\"><h2>Three recovery strategies</h2><div class=\"tbl-scroll\"><table><thead><tr><th scope=\"col\">Strategy</th><th scope=\"col\">Where a new value goes</th><th scope=\"col\">Consequence at failure</th></tr></thead><tbody><tr><td>Deferred update</td><td>Data-page updates are deferred until commit.</td><td>No uncommitted page updates to undo. Committed updates missing from disk may need REDO.</td></tr><tr><td>Immediate update</td><td>A changed page may reach disk before commit.</td><td>An unfinished change on disk may need UNDO. A committed change missing from disk may need REDO.</td></tr><tr><td>Shadow paging</td><td>Write changes to new pages, preserving the old page mapping.</td><td>Publish the new version by switching the durable root pointer atomically. Before the switch, the old version is still reachable.</td></tr></tbody></table></div><p>These are conceptual models. The examples below describe the stated protocol and disk contents. Real database engines implement recovery using their own logging and versioning rules.</p></section><section class=\"reading\"><h2>Choose the recovery tool by failure scope</h2><p>A single rejected transaction usually needs rollback. A machine restart can use a surviving log and database files. When a disk is destroyed, recovery needs a separate surviving copy such as a backup, plus archived logs for changes after the backup.</p></section><section class=\"reading\"><h2>Failure types determine what can be recovered</h2><div class=\"tbl-scroll\"><table><thead><tr><th scope=\"col\">Failure</th><th scope=\"col\">Example</th><th scope=\"col\">Appropriate recovery information</th></tr></thead><tbody><tr><td>Transaction / application error</td><td>A constraint rejects the second step of a purchase.</td><td>Roll back unfinished work; fix the input or program.</td></tr><tr><td>System crash</td><td>Power loss discards in-memory buffers but disk survives.</td><td>Use surviving data files and durable logs for restart recovery.</td></tr><tr><td>Media failure</td><td>The storage device containing the database fails.</td><td>Restore a surviving backup and replay available committed log history.</td></tr><tr><td>Accidental committed change</td><td>A valid DELETE removes the wrong customers and commits.</td><td>Ordinary ROLLBACK is too late. Use an appropriate compensating change or restore to a suitable earlier point.</td></tr><tr><td>Site disaster / malicious destruction</td><td>Database and local backups are both destroyed.</td><td>A separate protected surviving copy is essential. Logs on the destroyed device cannot help.</td></tr></tbody></table></div><div class=\"out\"><strong>Worked answer</strong><p>The recovery manager supports atomicity for unfinished work and durability for committed work. Nonvolatile does not mean indestructible. A checkpoint helps restart recovery; it cannot recover files that no longer exist.</p></div></section><section class=\"reading\"><h2>A checkpoint example with its assumptions stated</h2><p>Use this simplified force-at-checkpoint model: the checkpoint flushes the required log and changed buffers, records active transactions, and later recovery redoes committed work after that point and undoes work still uncommitted at the crash. Modern engines may use fuzzy checkpoints and different scanning rules.</p><div class=\"tbl-scroll\"><table><thead><tr><th scope=\"col\">Transaction</th><th scope=\"col\">At checkpoint / crash</th><th scope=\"col\">Recovery decision in this model</th></tr></thead><tbody><tr><td>A</td><td>Committed before checkpoint; its pages were flushed.</td><td>No REDO needed for A.</td></tr><tr><td>B</td><td>Active at checkpoint, commits afterward; some pages may still be missing.</td><td>REDO B’s required changes.</td></tr><tr><td>C</td><td>Active at checkpoint and still uncommitted when the crash occurs.</td><td>UND
