r are undone together.","example":"An order insert is undone when a required stock update in the same transaction fails."},{"term":"Consistency","definition":"The property that correct transactions preserve database constraints and applicable business invariants.","example":"A correct transfer preserves total money and satisfies CHECK(balance >= 0)."},{"term":"Isolation","definition":"The property governing how overlapping transactions interact and which intermediate or concurrent effects they can observe.","example":"Under Read Committed, another session cannot read an uncommitted debit."},{"term":"Isolation level","definition":"A configured set of guarantees that determines the concurrency effects transactions may observe.","example":"Read Committed and Serializable provide different guarantees for repeated reads and concurrent updates."},{"term":"Durability","definition":"The property that a successfully committed transaction survives a subsequent crash under durable settings.","example":"A saved sale can be recovered from durable records after power loss."},{"term":"ACID","definition":"The acronym for Atomicity, Consistency, Isolation and Durability, which describe reliable transaction behavior.","example":"A transfer must complete as one unit, preserve rules, handle concurrent work appropriately and survive a crash after commit."},{"term":"Business invariant","definition":"A condition that correct application operations must preserve, including rules that may need multiple statements to enforce.","example":"A transfer between two accounts preserves their combined balance."},{"term":"Affected-row count","definition":"The number of rows a statement actually changed, which can indicate whether its business goal succeeded.","example":"An UPDATE reserving a seat changes zero rows when the seat is unavailable."},{"term":"Guarded / conditional update","definition":"An UPDATE whose WHERE condition tests a requirement as part of changing the row.","example":"UPDATE Show SET seats=seats-1 WHERE id=3 AND seats>0 reserves only an available seat."},{"term":"SAVEPOINT","definition":"A named marker inside an open transaction to which later work can be partially rolled back.","example":"Create a savepoint after adding a book and before adding optional gift wrap."},{"term":"ROLLBACK TO SAVEPOINT","definition":"An operation that undoes changes after a named savepoint while leaving the transaction open.","example":"Undoing the wrap leaves the book pending until the caller commits."}],"essays":[{"title":"Explain all four ACID properties","prompt":"A transfer moves 30 from account A with 100 to account B with 40. Explain each ACID property using this operation. Distinguish the failure that atomicity handles from the failure durability handles.","answer":"The successful balances are A=70 and B=70, preserving the total 140. Atomicity means a failure before completion undoes both changes, leaving 100 and 40. Consistency means the correct operation preserves the total and respects constraints such as nonnegative balances. Isolation controls interaction with concurrent transfers and readers. Durability means the committed 70 and 70 can survive a later crash. Atomicity handles incomplete work; durability preserves completed, committed work.","criteria":["Give all four ACID names with correct meanings.","Connect each property to this transfer and calculate the correct balances and total.","Distinguish cancellation before commit from recovery of committed changes after a crash."]},{"title":"Trace two commits and a partial rollback","prompt":"A value starts at 20. Transaction A adds 5 and commits. Transaction B adds 4, creates SAVEPOINT s, doubles the value, rolls back to s, adds 1 and commits. Show every intermediate value and the final value.","answer":"A begins at 20, adds 5 to reach 25 and commits. B begins at 25, adds 4 to reach 29 and marks s. Doubling makes 58 inside B. ROLLBACK TO s restores 29 while B stays open. Adding 1 makes 30. COMMIT saves 30. If B instead ended with full ROLLBACK, the saved value would be 25.","criteria":["Trace 20 → 25 → 29 → 58 accurately.","Explain that rollback to the savepoint returns to 29 and keeps B open.","Finish at committed 30 and explain the contrast with a full rollback to 25."]},{"title":"Reserve a last seat safely","prompt":"A show has one remaining seat. A purchase needs to decrement seats and insert a booking. Write the transaction algorithm, including the case when the decrement changes zero rows and when the insert fails.","answer":"BEGIN. Run UPDATE Show SET seats=seats-1 WHERE show_id=:id AND seats>0. Require exactly one affected row. If zero rows change, ROLLBACK and report unavailable. Otherwise insert the Booking row in the same transaction. COMMIT only if the insert succeeds. On any error before commit, ROLLBACK. The guarded update prevents a negative seat count, and the row-count check prevents booking when nothing was reserved.","criteria":["Use one transaction containing both updates to the business state.","Guard seats>0 and check exactly one row changed before inserting.","Specify success, sold-out and insert-failure outcomes, with the correct commit or rollback."]},{"title":"Explain an auto-commit failure","prompt":"A program deducts 15 from A and then credits B using two separate statements with auto-commit enabled. The debit succeeds and the credit fails. Explain the saved state, why issuing ROLLBACK afterward cannot repair it, and how to rewrite the operation.","answer":"The debit has already committed as its own transaction. B did not receive the credit, so the system is short by 15 relative to its original total. A later rollback cannot undo that earlier committed debit. Wrap both statements inside one explicit transaction, verify both target rows and required business conditions, and commit only after both succeed. Roll back any failed attempt before commit. Repairing an already committed incorrect state requires a new corrective transaction.","criteria":["Recognize that the two statements have separate transaction boundaries under auto-commit.","Explain the missing credit and why a later rollback does not reach the committed debit.","Give the single-transaction rewrite and distinguish it from a new correction of the existing state."]}],"choices":[["An UPDATE changes zero rows. Which conclusion follows?",["The database must have crashed.","The statement may be valid even though the intended reservation failed.","COMMIT always creates the missing row."],1,"SQL can succeed with no matches. Business logic must inspect the affected-row count."],["After ROLLBACK TO s, what remains possible in the current transaction?",["Continue work and then commit.","Nothing, the transaction is always closed.","Undo every earlier commit."],0,"Rollback to a savepoint preserves the open transaction and the earlier pending work."]]},{"terms":[{"term":"SQL","definition":"Structured Query Language, used to define database objects, retrieve rows and change data.","example":"SELECT name FROM Reader returns reader names."},{"term":"DDL","definition":"Data definition language, the SQL operations that create or change database structures.","example":"CREATE TABLE and ALTER TABLE define or modify a table."},{"term":"DML","definition":"Data manipulation language, the SQL operations that work with data rows. SELECT is commonly included for querying, alongside INSERT, UPDATE and DELETE.","example":"UPDATE Item SET price=4 WHERE id=1 changes a stored price."},{"term":"CREATE TABLE","definition":"A statement that defines a new table's columns, types and constraints.","example":"CREATE TABLE Item(id int PRIMARY KEY, price int) defines an item structure."},{"term":"ALTER TABLE","definition":"A statement that changes the definition of an existing table.","example":"ALTER TABLE Item ADD COLUMN name text adds a column."},{"term":"DROP TABLE","definition":"A statement that removes a table object and its rows, subject to dependency rules.","example":"DROP TABLE Item removes the Item table."},{"term":"CRUD","definition":"The four basic operations Create, Read, Update and Delete for data records.","example":"INSERT, SELECT, UPDATE and DELETE implement CRUD on table rows."},{"term":"INSERT","definition":"A statement that adds rows to a table.","example":"INSERT INTO Item VALUES (1,4) adds one item."},{"term":"SELECT","definition":"A statement that retrieves specified expressions or columns from a row source.","example":"SELECT name,price FROM Item returns two columns."},{"term":"UPDATE","definition":"A statement that changes matching rows. Without a restricting WHERE, every row is eligible.","example":"UPDATE Item SET price=5 WHERE id=1 changes only item 1."},{"term":"DELETE","definition":"A statement that removes matching rows while retaining the table structure.","example":"DELETE FROM Item WHERE id=1 removes item 1."},{"term":"FROM","definition":"The clause that specifies the table or other row source to query.","example":"FROM Work starts with time-entry rows."},{"term":"JOIN / inner join","definition":"An operation that combines pairs of rows satisfying a join condition. An inner join retains matching pairs only.","example":"Match Work.project_id to Project.id to attach each work entry to a project."},{"term":"ON / join condition","definition":"The condition specifying which rows match when inputs are joined.","example":"ON Work.project_id=Project.id connects matching project IDs."},{"term":"LEFT JOIN","definition":"A join that retains every row of the left input and adds matching right rows, using NULLs when no right row matches.","example":"Clubs with no members still appear in Club LEFT JOIN Member."},{"term":"WHERE","definition":"A clause that filters individual rows before grouping.","example":"WHERE hours>=2 excludes one-hour work entries."},{"term":"GROUP BY","definition":"A clause that partitions rows into groups sharing the specified values so aggregates can be calculated per group.","example":"GROUP BY project_id creates one group per project."},{"term":"HAVING","definition":"A clause that filters groups, often using aggregate results.","example":"HAVING SUM(hours)>=6 keeps project groups with at least six total hours."},{"term":"ORDER BY","definition":"A clause that specifies result ordering. ASC sorts ascending and DESC descending.","example":"ORDER BY total DESC,name ASC sorts largest totals first and breaks ties by name."},{"term":"Aggregate function","definition":"A function that computes one result from a set of input rows or values.","example":"SUM(hours) adds hours in one project group."},{"term":"COUNT(*)","definition":"An aggregate that counts rows, including rows containing NULL values.","example":"A left join produces one placeholder row for an empty club, which COUNT(*) counts as one."},{"term":"COUNT(column)","definition":"An aggregate that counts only non-NULL values of the given expression.","example":"COUNT(Member.id) reports zero for a club with no matching member."},{"term":"SUM","definition":"An aggregate that adds non-NULL input values.","example":"SUM(hours) over 2,6,NULL is 8."},{"term":"AVG","definition":"An aggregate that averages non-NULL input values.","example":"AVG(hours) over 2,6,NULL is 4."},{"term":"MIN / MAX","definition":"Aggregates that find the smallest or largest non-NULL input value.","example":"MIN(price) gives the lowest recorded price and MAX(price) the highest."},{"term":"IS NULL","definition":"A predicate that tests whether an expression has a missing value.","example":"WHERE driver_id IS NULL finds unassigned deliveries."},{"term":"BETWEEN","definition":"An inclusive range predicate accepting both endpoints.","example":"price BETWEEN 10 AND 20 accepts 10, 15 and 20."},{"term":"LIKE","definition":"A predicate matching a text pattern, where % matches any sequence and _ matches one character.","example":"name LIKE 'A%' matches Ada and Alan."},{"term":"IN","definition":"A predicate testing membership in a list or subquery result, with SQL NULL rules applying.","example":"region IN ('East','West') accepts either named region."},{"term":"DISTINCT","definition":"A SELECT modifier that removes duplicate result rows.","example":"SELECT DISTINCT region FROM Shop returns each region once."},{"term":"Alias","definition":"A temporary name given to a table reference or result expression within a query.","example":"SUM(hours) AS total names the calculated output column total."},{"term":"WITH / common table expression (CTE)","definition":"A named query result available to the statement that follows WITH.","example":"WITH work(hours) AS (VALUES (2),(6)) provides two sample rows for a SELECT."}],"essays":[{"title":"Define a table and perform CRUD","prompt":"Create Product with a required ID primary key, required name and nonnegative integer price. Insert pen 1 at price 3 and notebook 2 at price 8. Change pen price to 4, delete notebook and show the remaining rows ordered by ID. Explain DELETE versus DROP.","answer":"CREATE TABLE Product (id integer PRIMARY KEY, name text NOT NULL, price integer NOT NULL CHECK(price>=0));\nINSERT INTO Product VALUES (1,'Pen',3),(2,'Notebook',8);\nUPDATE Product SET price=4 WHERE id=1;\nDELETE FROM Product WHERE id=2;\nSELECT * FROM Product ORDER BY id;\n\nThe remaining row is (1, Pen, 4). DELETE removed notebook while leaving Product available. DROP TABLE Product would remove the table itself and its rows.","criteria":["Define the key, required values and nonnegative price constraint.","Use correct INSERT, targeted UPDATE, targeted DELETE and ordered SELECT statements.","State the final row and accurately distinguish DELETE from DROP."]},{"title":"Keep empty departments in a report","prompt":"Department(id,name) contains (1, Sales), (2, Support), (3, Design). Employee(id,dept_id) contains (10,1),(11,1),(12,3). Write a query showing every department name and its employee count, alphabetically. Explain the expected rows and why COUNT(*) is wrong for the empty department.","answer":"SELECT d.name, COUNT(e.id) AS employee_count\nFROM Department d LEFT JOIN Employee e ON e.dept_id=d.id\nGROUP BY d.id,d.name\nORDER BY d.name;\n\nRows are Design | 1, Sales | 2, Support | 0. LEFT JOIN preserves Support using a row with NULL employee columns. COUNT(e.id) ignores that missing match, whereas COUNT(*) counts the placeholder row as one.","criteria":["Use Department on the left of a LEFT JOIN with the correct matching condition.","Count non-NULL employee IDs and group by department before ordering.","Give all three results and explain the placeholder-row counting error."]},{"title":"Filter entries and then filter groups","prompt":"Project(id,name) contains (1,Atlas),(2,Beacon),(3,Comet). Work(project_id,hours) contains (1,2),(1,6),(2,4),(2,1),(3,9). Write a report that totals entries of at least 2 hours, keeps totals of at least 6, and sorts total descending. Explain each stage and the result.","answer":"SELECT p.name, SUM(w.hours) AS total\nFROM Project p JOIN Work w ON w.project_id=p.id\nWHERE w.hours>=2\nGROUP BY p.id,p.name\nHAVING SUM(w.hours)>=6\nORDER BY total DESC,p.name;\n\nThe join supplies project names. WHERE removes Beacon’s 1-hour entry. GROUP BY creates project groups; their sums are Atlas 8, Beacon 4, Comet 9. HAVING removes Beacon. ORDER BY yields Comet | 9 then Atlas | 8.","criteria":["Join correctly and filter individual entries with WHERE.","Group and aggregate correctly, then filter aggregate totals with HAVING.","Explain the logical stages and give the correctly ordered final rows."]},{"title":"Explain NULLs, patterns and aggregates","prompt":"Item(id,name,price) contains (1,Apple,10),(2,Apricot,NULL),(3,Banana,20). Write one query counting all rows, counting known prices and calculating their average. Then write a query for names beginning with A. Give both results and a predicate for finding unknown prices.","answer":"SELECT COUNT(*) AS rows_total,COUNT(price) AS known_prices,AVG(price) AS average_price FROM Item;\nResult: 3 rows, 2 known prices, average 15 (format may vary).\n\nSELECT name FROM Item WHERE name LIKE 'A%' ORDER BY name;\nResult: Apple and Apricot.\n\nWHERE price IS NULL finds Apricot. COUNT(price) and AVG(price) skip the NULL input. COUNT(*) still includes the row. A NULL price does not make the whole Apricot row disappear from unrelated name filtering.","criteria":["Use the three correct aggregates and calculate 3, 2 and 15.","Use LIKE with a trailing % and give Apple and Apricot.","Use IS NULL and explain how missing price values affect the aggregates."]}],"choices":[["A LEFT JOIN keeps an empty department. What does COUNT(Employee.id) return for it?",["1","0","NULL"],1,"COUNT ignores NULL inputs and returns zero when there are no non-NULL employee IDs."],["Which predicate includes both 10 and 20?",["price>10 AND price<20","price BETWEEN 10 AND 20","price=10 AND price=20"],1,"BETWEEN includes both endpoints."]]},{"terms":[{"term":"Stored procedure","definition":"A named collection of instructions stored in the database and executed by calling it.","example":"GetStudentsByDepartment applies the same lookup logic for different department IDs."},{"term":"Input parameter","definition":"A named, typed slot in a procedure definition that receives a value from its caller.","example":"p_dept integer is the parameter in a department lookup."},{"term":"Argument","definition":"The actual value supplied for a parameter in a particular call.","example":"In a call for department 10, the argument is 10."},{"term":"Local variable","definition":"A named value that exists within a procedure or block and can change during that execution.","example":"result starts at 1 and holds the growing factorial product."},{"term":"DECLARE / initialization","definition":"Declaration introduces a local variable and its type; initialization supplies its starting value.","example":"DECLARE result int := 1 in PL/pgSQL initializes the product to 1."},{"term":"IF / ELSE","definition":"Conditional control flow that chooses a branch based on whether a condition is true.","example":"Reject a nonpositive quantity in the IF branch and continue valid work otherwise."},{"term":"WHILE loop","definition":"A control structure that repeats its body while a condition is true.","example":"WHILE i<=n repeats a factorial multiplication until i exceeds n."},{"term":"Loop termination","definition":"The condition and progress that eventually stop a loop.","example":"Increasing i by 1 on every pass makes i<=n become false."},{"term":"Input validation","definition":"Checking arguments against required business and type-related limits before using them.","example":"Reject a NULL, negative or too-large factorial input."},{"term":"Exception / error handling","definition":"Detecting and reporting a failed operation and ensuring the surrounding work ends consistently.","example":"A procedure raises an exception for insufficient stock and the caller rolls back its transaction."},{"term":"T-SQL","definition":"Transact-SQL, SQL Server's SQL dialect with procedural extensions.","example":"T-SQL uses @dept parameters and EXEC for a procedure call."},{"term":"PL/pgSQL","definition":"PostgreSQL's procedural language for routines and blocks containing SQL and control flow.","example":"A LANGUAGE plpgsql procedure uses IF, LOOP and RAISE EXCEPTION."},{"term":"EXEC / CALL","definition":"Commands that invoke stored procedures in their respective dialects.","example":"SQL Server uses EXEC GetStudents @dept=10; PostgreSQL uses CALL get_students(10,...)."},{"term":"Cursor / refcursor","definition":"A cursor is a handle for reading query result rows. PostgreSQL refcursor is a type used to pass a cursor's name.","example":"A procedure opens the cursor named matches for department 10."},{"term":"OPEN / FETCH","definition":"OPEN associates a cursor with a query; FETCH retrieves rows through that cursor.","example":"FETCH ALL FROM matches reads all rows from the opened student cursor."},{"term":"THROW / RAISE EXCEPTION","definition":"Statements that signal an error in SQL Server and PostgreSQL respectively.","example":"RAISE EXCEPTION 'Insufficient stock' stops an invalid reservation."},{"term":"TRY / CATCH","definition":"SQL Server control flow that runs protected work in TRY and transfers to CATCH when a catchable error occurs.","example":"CATCH can roll back an active transfer transaction and rethrow the error."},{"term":"FOUND","definition":"A PL/pgSQL Boolean status variable set by certain statements to indicate whether rows were found or affected.","example":"After a guarded UPDATE changes zero rows, IF NOT FOUND detects the failed reservation."},{"term":"Factorial","definition":"The product of whole numbers from 1 through n, with 0! defined as 1.","example":"4! equals 1×2×3×4 = 24."},{"term":"Integer overflow","definition":"A result exceeding the range of the integer data type used to store it.","example":"A signed 32-bit integer holds 12! but cannot hold 13!, so the example rejects inputs above 12."},{"term":"Transaction ownership","definition":"Responsibility for starting and completing a transaction around a procedure call.","example":"A caller can run BEGIN, CALL, then COMMIT on success or ROLLBACK after failure."},{"term":"GO batch separator","definition":"A separator recognized by SQL Server client tools to send statements as distinct batches.","example":"GO separates CREATE PROCEDURE from a subsequent EXEC in a SQL Server script."}],"essays":[{"title":"Write a parameterized lookup","prompt":"Students(student_id, student_name, department_id) stores students. Write a SQL Server procedure named GetStudentsByDepartment that takes a department ID, rejects NULL, returns matching rows ordered by student ID, and show the call for department 10. Explain column-versus-parameter comparison.","answer":"CREATE PROCEDURE GetStudentsByDepartment @dept INT\nAS\nBEGIN\n  IF @dept IS NULL THROW 50001, 'Department is required', 1;\n  SELECT s.student_id,s.student_name,s.department_id\n  FROM Students s WHERE s.department_id=@dept\n  ORDER BY s.student_id;\nEND;\nGO\nEXEC GetStudentsByDepartment @dept=10;\n\n@dept is the input parameter and 10 is the argument. Comparing s.department_id to @dept filters by the supplied department. Comparing the column to itself would accept every non-NULL department.","criteria":["Define a named procedure with a typed parameter and reject NULL.","Filter the qualified column against the parameter and order the returned rows.","Show the call for 10 and explain parameter, argument and the self-comparison error."]},{"title":"Build and trace a factorial loop","prompt":"Write a PostgreSQL DO block that computes factorial for n=4, validates n is between 0 and 12 inclusive, and reports the answer with RAISE NOTICE. Trace i and product. Explain the zero case and the upper bound.","answer":"DO $$\nDECLARE n int := 4; i int := 1; product int := 1;\nBEGIN\n  IF n IS NULL OR n<0 OR n>12 THEN\n    RAISE EXCEPTION 'Use 0 through 12';\n  END IF;\n  WHILE i<=n LOOP\n    product := product*i;\n    i := i+1;\n  END LOOP;\n  RAISE NOTICE 'Factorial = %', product;\nEND; $$;\n\nThe products after i=1,2,3,4 are 1,2,6,24. i then becomes 5 and the loop stops. With n=0 no multiplication runs and product stays 1. The upper bound avoids overflow of the int product because 13! exceeds its range.","criteria":["Validate NULL and range and initialize counter and product correctly.","Provide a terminating loop and correct trace to 24.","Explain 0! and integer overflow, and show how the result is reported."]},{"title":"Return rows through a PostgreSQL cursor","prompt":"Assume Students exists in the public schema. Write a PostgreSQL procedure that accepts a department ID and refcursor name, opens the cursor for matching rows, and show BEGIN/CALL/FETCH/COMMIT for department 20. Explain why FETCH must occur before COMMIT for this ordinary cursor.","answer":"CREATE PROCEDURE public.students_by_department(IN p_dept int, IN result refcursor)\nLANGUAGE plpgsql AS $$\nBEGIN\n  OPEN result FOR SELECT s.* FROM public.Students s\n    WHERE s.department_id=p_dept ORDER BY s.student_id;\nEND; $$;\nBEGIN;\nCALL public.students_by_department(20,'dept_rows');\nFETCH ALL FROM dept_rows;\nCOMMIT;\n\nThe refcursor argument supplies the name dept_rows. OPEN binds it to the filtered query. FETCH retrieves the rows. COMMIT closes this ordinary transaction-scoped cursor, so fetching afterward would fail. PostgreSQL resolves unquoted Students to students.","criteria":["Declare both typed parameters and open the cursor on a correctly filtered query.","Show BEGIN, CALL with 20, FETCH and COMMIT in the correct order.","Explain the cursor handle and its transaction lifetime."]},{"title":"Validate and reserve stock","prompt":"Stock(id,qty) has (1,3). Describe or write a PostgreSQL procedure that accepts a positive quantity, atomically reduces stock if enough remains, and raises an error when zero rows are updated. Show caller transaction handling for requests of 2 and then 4.","answer":"Validate wanted IS NOT NULL AND wanted>0. Execute UPDATE Stock SET qty=qty-wanted WHERE id=1 AND qty>=wanted. Immediately test FOUND; if false, RAISE EXCEPTION 'Insufficient stock'. The caller runs BEGIN, CALL reserve(2), COMMIT and stock becomes 1. A second BEGIN/CALL reserve(4) raises an error. The caller then executes ROLLBACK and stock remains 1. The procedure need not commit independently.","criteria":["Reject NULL and nonpositive input before changing data.","Use a guarded UPDATE and detect zero affected rows immediately with FOUND.","Give both transaction outcomes and preserve the earlier committed reservation."]}],"choices":[["A factorial loop starts product at 0. What happens for n=4?",["The product remains 0.","The result is 24.","The counter cannot advance."],0,"Multiplying zero by each factor leaves zero. The product must start at 1."],["An ordinary PostgreSQL cursor was opened inside a transaction that has now committed. What happens on a later FETCH?",["It returns all rows again.","It starts a new query automatically.","It fails because that cursor is closed."],2,"An ordinary cursor lasts only for the transaction that opened it."]]},{"terms":[{"term":"Concurrency","definition":"Overlap in the execution of multiple transactions against a database.","example":"Two shoppers try to reserve the final item at the same time."},{"term":"Schedule","definition":"The ordered sequence of read, write and other operations from transactions, preserving the order within each transaction.","example":"A reads X, B reads X, A writes X, B writes X is an interleaved schedule."},{"term":"Lost update","definition":"An anomaly in which one write overwrites another transaction's change without incorporating it.","example":"Two sessions read score 10 and each writes 11, losing one of two intended increments."},{"term":"Dirty read","definition":"Reading a value written by another transaction that has not committed.","example":"A report uses an uncommitted balance of 70 that later rolls back to 100."},{"term":"Inconsistent analysis","definition":"Combining observations from different database states into a misleading result.","example":"Reading account A before a transfer and B after it produces a total that never existed."},{"term":"Atomic increment","definition":"A single update that increases a value based on the row value as part of the database operation.","example":"UPDATE Score SET points=points+1 avoids computing two stale replacement values in client code."},{"term":"Snapshot","definition":"A consistent view of data for a statement or transaction, according to the isolation behavior of the DBMS.","example":"One SELECT can calculate both account balances from the same statement snapshot."},{"term":"Read Committed","definition":"An isolation level that prevents dirty reads but can allow different statements in one transaction to see different committed states.","example":"Two separate balance reads can observe values from before and after a transfer."},{"term":"Serial schedule","definition":"A schedule in which one transaction finishes before the next transaction starts.","example":"Execute all of A, then all of B."},{"term":"Serializable schedule","definition":"A schedule whose observable result is equivalent, under the chosen equivalence definition, to some serial execution.","example":"Interleaved operations on independent data can be equivalent to A followed by B."},{"term":"Conflicting operations","definition":"Operations from different transactions on the same data item where at least one operation writes.","example":"A reading X before B writes X is a conflict. Two reads of X do not conflict."},{"term":"Conflict serializability","definition":"The property that a schedule can be transformed into a serial schedule by swapping adjacent nonconflicting operations.","example":"A precedence graph with only A → B is conflict-serializable in order A then B."},{"term":"Precedence graph","definition":"A directed graph with transactions as nodes and an edge from the earlier to the later transaction for each conflicting operation pair.","example":"A writes X before B reads X creates A → B."},{"term":"Cycle","definition":"A directed path that returns to its starting node. In a precedence graph it rules out conflict serializability.","example":"A → B → A requires each transaction to precede the other."},{"term":"Topological order","definition":"An ordering of the nodes of an acyclic directed graph in which every edge points forward.","example":"For A → B and A → C, A,B,C or A,C,B is a valid serial order."},{"term":"Shared lock","definition":"A read lock that can coexist with other shared locks on the same resource but conflicts with an exclusive lock.","example":"Two readers can both hold shared locks on X."},{"term":"Exclusive lock","definition":"A lock used to protect writes, conflicting with another transaction's shared or exclusive lock on the same resource.","example":"A writer holding an exclusive lock on a seat can block another locker of that seat."},{"term":"Two-phase locking (2PL)","definition":"A locking protocol with a growing phase that acquires locks and a shrinking phase that releases locks, with no new lock acquisition after the first release.","example":"A transaction locks X and Y, then unlocks X and may no longer acquire a new lock on Z."},{"term":"Strict 2PL","definition":"A form of two-phase locking that retains exclusive locks until the transaction commits or aborts.","example":"Other transactions cannot acquire a conflicting lock on a written item before the writer finishes."},{"term":"Blocking","definition":"Waiting because another transaction holds an incompatible lock on a required resource.","example":"B waits for A's exclusive lock on X, then proceeds when A commits."},{"term":"Deadlock","definition":"A cycle of transactions waiting for resources held by each other, preventing progress without intervention.","example":"A holds X and waits for Y, while B holds Y and waits for X."},{"term":"Wait-for graph","definition":"A graph whose edge points from a transaction currently waiting to the transaction holding the needed incompatible lock.","example":"A waiting for B's lock creates A → B, regardless of their earlier read/write order."},{"term":"Deadlock victim / rollback","definition":"A transaction selected to abort so its locks can be released and a wait cycle can be broken.","example":"Abort B, release its lock on Y and allow A to continue."},{"term":"Timestamp ordering","definition":"Concurrency control that assigns transaction timestamps and rejects operations violating the required timestamp order.","example":"An older transaction may restart when its proposed write is incompatible with an already accepted newer read."},{"term":"Optimistic concurrency control","definition":"A method that reads and computes speculatively, validates for conflicts, then installs accepted changes.","example":"An editor checks that row version 5 is still current before saving."},{"term":"Validation phase","definition":"The optimistic-control stage that checks whether a transaction can commit its proposed changes without an unacceptable conflict.","example":"A changed row version makes validation fail and triggers a retry."}],"essays":[{"title":"Identify and repair three anomalies","prompt":"Name and explain each problem. (a) A and B read score 10 and both write 11. (b) B reads A’s uncommitted change, then A rolls back. (c) A report reads one account before a transfer and the other afterward. Give an appropriate remedy for each.","answer":"(a) Lost update. The expected two increments yield 12, but a stale replacement overwrites one. Use an atomic increment, or protect/validate the whole read–modify–write sequence. (b) Dirty read. B observed work that never committed. Prevent uncommitted reads using an appropriate isolation level such as Read Committed. (c) Inconsistent analysis. The total combines different states. Use one statement snapshot or a suitable consistent transaction snapshot for all reads.","criteria":["Correctly name all three anomalies.","Explain the specific unsafe sequence and its consequence in each case.","Give a matching remedy that protects the whole necessary operation or view."]},{"title":"Build a precedence graph","prompt":"The schedule is rA(X), wB(X), wA(Y), rB(Y), where r means read and w means write. List the conflicts, draw their edges and decide conflict serializability. Then add wB(Z) before rA(Z) and explain how the conclusion changes.","answer":"Original conflicts are rA(X) before wB(X) and wA(Y) before rB(Y). Both give A → B. The graph is acyclic and serial order A then B preserves these conflicts. Adding wB(Z) before rA(Z) creates B → A. Together with A → B this is a cycle, so the modified schedule is not conflict-serializable.","criteria":["Identify both original same-item read/write conflicts and their direction.","Give the acyclic graph and serial order A then B.","Identify the added reverse edge and explain why the resulting cycle changes the result."]},{"title":"Distinguish blocking, deadlock and 2PL","prompt":"A locks X exclusively and B requests X. Later consider a different case where A holds X and requests Y while B holds Y and requests X. Explain each case, draw wait edges, give a deadlock remedy, and explain whether strict 2PL eliminates all deadlocks.","answer":"In the first case B waits for A, giving B → A. This alone is blocking and may resolve when A commits. In the second case A → B and B → A form a wait cycle, so it is a deadlock. A detector can roll back one victim and release its locks. Acquiring locks in a consistent global order can prevent this pattern. Strict 2PL holds exclusive locks until commit or abort and ensures conflict serializability with 2PL, but deadlocks remain possible.","criteria":["Distinguish one-way blocking from the two-way wait cycle and give correct wait edges.","Give a concrete recovery or prevention method.","Define strict 2PL correctly and explain that it still permits deadlocks."]},{"title":"Choose an optimistic conflict response","prompt":"Two editors both read a row with version 5. A saves a new value and changes the version to 6. B attempts to save using its old version 5. Explain optimistic read, validation and write phases, what B must do, and how timestamp ordering differs.","answer":"Both editors read and prepare changes privately. At validation, a conditional save for A matches version 5 and publishes the new value with version 6. B’s version check now fails, so its stale replacement must not be accepted. B must reread version 6 and recompute or ask to resolve the conflicting changes before retrying. Timestamp ordering instead imposes a transaction-age order and checks operations for compatibility with that order. It can reject and restart operations that violate it.","criteria":["Describe the optimistic read, validation and write phases.","Reject B’s stale update and describe a retry based on fresh data.","Explain timestamp ordering as ordering transactions by timestamps, rather than this version-check scenario alone."]}],"choices":[["Which pair from different transactions on the same item does not conflict?",["Read and read","Read and write","Write and write"],0,"Read/read ordering cannot change the stored value or either read result by itself."],["Basic 2PL enters its shrinking phase after which event?",["The transaction begins.","Its first lock release.","Its first read."],1,"After releasing any lock it may release more, but may not acquire new locks."]]},{"terms":[{"term":"Database recovery","definition":"Restoring a valid database state after failure using surviving data and recovery records.","example":"Reapply a missing committed update and remove an unfinished update after a crash."},{"term":"Data page","definition":"A block of database storage read or written as a unit, often cached in memory before being flushed to disk.","example":"A modified balance can be in a memory page before the corresponding disk page is updated."},{"term":"Transaction log / journal","definition":"An ordered record of transaction actions and outcomes used for recovery.","example":"A log can record START T1, an X update and COMMIT T1."},{"term":"Before-image","definition":"The value of an item before a logged change.","example":"For X:4→7, the before-image is 4."},{"term":"After-image","definition":"The value of an item after a logged change.","example":"For X:4→7, the after-image is 7."},{"term":"Commit record","definition":"A log record indicating that a transaction completed successfully.","example":"COMMIT T1 distinguishes finished T1 from a transaction still active at the crash."},{"term":"Transaction failure","definition":"Failure or cancellation of one transaction, requiring removal of its unfinished effects.","example":"A constraint violation causes a booking transaction to roll back."},{"term":"System crash","definition":"Loss of running processes or volatile memory while persistent database and log files may survive.","example":"A power failure loses cached pages that had not reached disk."},{"term":"Media failure","definition":"Damage or loss of persistent storage containing database files or logs.","example":"A destroyed disk requires recovery from a surviving copy elsewhere."},{"term":"UNDO / backward recovery","definition":"Reversing effects that must be removed, typically using before-images in the stated recovery model.","example":"Undo an unfinished Y:2→5 change to restore Y=2."},{"term":"REDO / forward recovery","definition":"Reapplying effects that must survive, typically using after-images in the stated recovery model.","example":"Redo a missing committed X:4→7 change to restore X=7."},{"term":"Write-ahead logging (WAL)","definition":"The rule that required log records become durable before their changed data page is written, with required commit log records flushed before acknowledging a durable commit.","example":"A page containing X=7 can be written only after its corresponding recovery information is safely logged."},{"term":"Checkpoint","definition":"A recorded recovery milestone that helps limit restart work and describes the necessary recovery state, including relevant active work.","example":"A transaction active at a checkpoint can still need rollback if it never commits."},{"term":"Deferred update","definition":"A recovery approach that keeps unfinished updates from reaching database data pages before commit.","example":"Committed changes missing from disk may need REDO, while unfinished data-page changes need no UNDO under this model."},{"term":"Immediate update","definition":"A recovery approach that allows changed data pages to reach disk before transaction commit.","example":"Both UNDO of unfinished changes and REDO of missing committed changes may be required."},{"term":"Shadow paging","definition":"A recovery approach that keeps an unchanged page mapping while writing a new version separately, publishing the version by an atomic durable root switch.","example":"Before the switch, the old root still locates the previous committed pages."},{"term":"Root pointer","definition":"The reference identifying the page mapping that represents the current committed version in shadow paging.","example":"Switching the durable root publishes the new page set."},{"term":"Backup","definition":"A separately retained copy of database data usable as a restoration starting point.","example":"A 09:00 backup restores the base state after a disk failure."},{"term":"Archived log","definition":"A retained log segment used to replay changes beyond a backup or support other recovery needs.","example":"Replay committed sales recorded after the 09:00 backup."},{"term":"Flush / stable storage","definition":"Flushing writes buffered information to the storage layer with the persistence guarantees required by the recovery protocol.","example":"A durable commit flushes its required log records before reporting success."}],"essays":[{"title":"Recover an immediate-update crash","prompt":"Under immediate update, T1 changes X from 4 to 7 and commits. T2 changes Y from 2 to 5 and is unfinished at the crash. Disk holds X=4 and Y=5. State the recovery actions, values and ACID properties involved.","answer":"REDO T1’s missing committed change using X’s after-image 7. UNDO T2’s unfinished change using Y’s before-image 2. The recovered values are X=7 and Y=2. Redo protects durability for committed T1. Undo protects atomicity by removing unfinished T2. The decision depends on the commit records and the stated disk contents.","criteria":["Classify T1 as committed and T2 as unfinished.","Use the correct images, operations and final values.","Connect REDO to durability and UNDO to atomicity under the stated model."]},{"title":"Explain log order and reverse undo","prompt":"A transaction writes price 10→12 and then 12→15 without committing. Both writes reach disk. Explain the WAL ordering needed before those page writes, then show the order of UNDO and its final result.","answer":"Before a changed page is written, its required log record must be durable. The log therefore preserves the recovery images for both changes even if the process crashes. Undo the newest change first, restoring 15 to 12 using its before-image. Then undo the older change, restoring 12 to 10. Final price is 10. Undoing these records forward would wrongly finish at 12.","criteria":["State that required log information must reach durable storage before the corresponding data page.","Undo in reverse order with the correct before-images.","Give final 10 and explain why forward-order undo is wrong."]},{"title":"Compare recovery strategies","prompt":"Compare deferred update, immediate update and shadow paging. For each, explain whether unfinished changes may affect database pages and how the committed version is restored or chosen after a crash. Include the case of a shadow-paging crash before the root switch.","answer":"Deferred update keeps unfinished changes out of database pages, so unfinished data-page effects do not need undo in this model. Committed changes missing on disk may require redo. Immediate update allows unfinished pages to reach disk, so undo may be necessary; committed missing updates may still require redo. Shadow paging writes new pages while preserving the old committed mapping. An atomic durable root switch publishes the new version. Before that switch, recovery uses the old root. After a completed durable switch, it uses the new mapping.","criteria":["Accurately describe deferred update and its possible REDO requirement.","Accurately describe immediate update and possible UNDO plus REDO.","Explain old/new page mappings and both sides of the shadow root-switch boundary."]},{"title":"Restore a lost disk and interpret a checkpoint","prompt":"A surviving backup at 09:00 has 40 tickets available. Archived logs contain a committed sale of 3 at 09:10 and a committed return of 1 at 09:15. A checkpoint occurred on the data disk at 09:17. The disk is destroyed at 09:20. Explain recovery and whether the checkpoint alone is sufficient.","answer":"Restore the separate backup to reach 40. Replay the committed sale to get 37 and the committed return to get 38. The checkpoint on the destroyed disk cannot supply a surviving full database copy. Checkpoints reduce restart work when their required storage and logs survive. A transaction active at a checkpoint is not automatically committed by that checkpoint.","criteria":["Restore the backup and replay both committed changes in order.","Calculate the final 38 available tickets.","Explain why the checkpoint is not a backup or an automatic commit for active transactions."]}],"choices":[["In X:4→7, which value does ordinary before-image UNDO use?",["7","4","The sum 11"],1,"UNDO restores the before-image, 4."],["A transaction is active at a checkpoint and unfinished at a later crash. What is guaranteed by the checkpoint alone?",["The transaction committed.","All its writes should be kept.","Neither completion nor permission to keep its unfinished changes."],2,"Active work can cross a checkpoint. Its transaction outcome still matters for recovery."]]},{"terms":[{"term":"Query","definition":"A request for a result expressed in a database language.","example":"SELECT amount for sales belonging to East-region shops."},{"term":"Query plan","definition":"A specification of operations used to produce a query's result.","example":"Scan Shop, filter East, join Sale on shop ID and return amount."},{"term":"Query optimization","definition":"Choosing an efficient equivalent execution plan while preserving the requested results.","example":"Filter East shops before an inner join to reduce the join input."},{"term":"Decomposition","definition":"Parsing, checking and translating a query into an internal representation.","example":"Resolve Sale.amount and verify that referenced tables and columns exist."},{"term":"Optimization phase","definition":"Comparing and transforming valid plans using rules and estimated costs.","example":"Compare an index lookup with a full scan for the selected region."},{"term":"Code generation","definition":"Preparing executable operations from the selected plan.","example":"Create the operators needed for the chosen scan and join."},{"term":"Execution","definition":"Running the prepared plan to obtain result rows.","example":"Read pages, apply the filter, join matching rows and emit amounts."},{"term":"Relational algebra","definition":"A formal set of operations over relations used to express and reason about queries.","example":"Selection, projection and join describe the steps of the East sales query."},{"term":"Relational algebra tree","definition":"A tree whose leaves represent input relations and internal nodes represent operations, with the root producing the answer.","example":"Two table leaves feed a join whose result feeds a projection."},{"term":"Leaf / root","definition":"A leaf is an input at the bottom of a query tree; the root is the final operation producing output at the top.","example":"Sale and Shop are leaves and projecting amount is the root."},{"term":"Selection (σ)","definition":"An operation that keeps rows satisfying a predicate.","example":"σ region='East'(Shop) keeps East shops."},{"term":"Projection (π)","definition":"An operation that keeps selected attributes. Classical relational algebra projection removes duplicate tuples; ordinary SQL SELECT preserves duplicates unless DISTINCT is used.","example":"Keep Shop.id for a join and later project only Sale.amount."},{"term":"Join (⋈)","definition":"An operation combining rows from two inputs that meet a matching condition.","example":"Join Sale.shop_id to Shop.id."},{"term":"Predicate","definition":"A condition evaluated to decide which rows match or qualify.","example":"region='East' is a predicate."},{"term":"Early selection / predicate pushdown","definition":"Applying a valid filter nearer its input so fewer rows flow through later operations.","example":"Filter Shop by region before an inner join because the predicate uses only Shop."},{"term":"Early projection","definition":"Removing unnecessary columns before later operations while retaining all columns they still need.","example":"Keep shop_id and amount from Sale, discarding an unused description before the join."},{"term":"Heuristic optimization","definition":"Improving a plan with practical transformation rules that are often helpful, without fully costing every alternative.","example":"Apply selective filters early when doing so preserves the result."},{"term":"Cost-based optimization","definition":"Choosing among plans using estimated work derived from statistics and resource costs.","example":"Compare estimated page reads for a scan and an index lookup."},{"term":"Statistics","definition":"Summaries of stored data used for estimates, such as row counts, distinct-value counts and value distributions.","example":"If only 1% of shops are East, filtering East may substantially shrink the input."},{"term":"Index","definition":"An auxiliary access structure that helps locate rows by indexed values, with maintenance and lookup costs.","example":"An index on region can help find a small set of East shops."},{"term":"Scan","definition":"Reading through a set of table or index entries to find qualifying rows.","example":"A table scan visits the table's pages to evaluate the region filter."},{"term":"Intermediate result","definition":"Rows or columns produced between operators before the final answer.","example":"East-filtered Shop rows are an intermediate input to the join."},{"term":"EXPLAIN","definition":"A command that displays the plan the database intends to use for a query. Plain EXPLAIN does not execute the query to produce its ordinary result rows.","example":"EXPLAIN (COSTS OFF) displays nodes without cost numbers in PostgreSQL."},{"term":"ANALYZE","definition":"A PostgreSQL command that collects table statistics for planning. EXPLAIN ANALYZE is a different form that actually executes a statement and reports execution measurements.","example":"ANALYZE shop updates statistics before examining the query plan."},{"term":"Equivalent rewrite","definition":"A transformation guaranteed to preserve the requested result under the query's semantics, including required duplicates and unmatched rows.","example":"Pushing Shop.region='East' into Shop before an inner join is valid. Moving a right-side filter from ON to WHERE in a left join can change results."},{"term":"Materialization","definition":"Storing an intermediate result before a later operation consumes it.","example":"A temporary intermediate set is fully produced and then read by the next step."},{"term":"Pipelining","definition":"Passing rows from one operator to the next as they become available, where the operations permit it.","example":"A scan passes qualifying rows directly into a filter or consumer without first storing every row."}],"essays":[{"title":"Explain processing from SQL to rows","prompt":"For a query returning sale amounts from East shops, explain decomposition, optimization, code generation and execution. State the difference between the SQL request and its physical plan.","answer":"Decomposition parses the SQL, checks names and types, and creates an internal query representation. Optimization considers equivalent plans and estimates their costs, such as filtering Shop before joining. Code generation prepares executable scan, filter, join and output operations. Execution runs those operations to produce sale amounts. The SQL expresses the requested result. The physical plan specifies how the engine obtains it.","criteria":["Define all four phases in their correct order.","Tie each phase to the East-shop query.","Distinguish the declarative request from the executable method used to obtain the same result."]},{"title":"Build and improve an algebra tree","prompt":"Shop(id,region,address) contains (1,East,...),(2,West,...). Sale(shop_id,amount,note) contains (1,12,...),(1,15,...),(2,20,...). Return East-shop sale amounts. Describe an initial join-then-filter tree and an improved tree with early selection and projection. List the final rows.","answer":"Initial tree, leaves upward: Shop and Sale → join on Shop.id=Sale.shop_id → select region=East → project amount. Improved Shop branch: select region=East, then keep id. Improved Sale branch: keep shop_id and amount. Join the two branches on their retained keys, then project amount. Final rows contain 12 and 15. Preserve SQL multiplicities unless DISTINCT is requested.","criteria":["Describe the initial tree and put the join, filter and projection in a valid order.","Push the Shop-only filter and safe projections downward while retaining both join keys.","Give 12 and 15 and explain why the rewrite preserves results and duplicates."]},{"title":"Find an unsafe outer-join rewrite","prompt":"Club contains A and B. Member contains one row (A,true), where true means paid. Compare LEFT JOIN Member ON matching club AND paid with LEFT JOIN on matching club followed by WHERE paid. Count member club IDs per club. Explain both outputs.","answer":"With paid in ON, Club A matches its paid member and Club B is preserved with NULL member columns. COUNT(Member.club_id) returns A=1 and B=0. With WHERE paid after the join, B’s placeholder has paid=NULL and fails the filter, so only A=1 remains. Moving this predicate changes the answer and is not an equivalent optimization for the requirement to list every club.","criteria":["Give A=1,B=0 for the filter in ON and explain unmatched-row preservation.","Give only A=1 for the filter in WHERE and explain the NULL predicate result.","Conclude that the rewrite is unsafe for this required output and justify that conclusion."]},{"title":"Reason about costs and intermediate results","prompt":"A table has one million rows and an index on region. In one dataset, East matches 0.1% of rows; in another, East matches 90%. Explain why the chosen access plan may differ, how statistics help, what plain EXPLAIN reports, and materialization versus pipelining.","answer":"For 0.1% matches an index lookup may avoid most row reads. For 90% matches, scanning the table may be cheaper than many index-driven accesses. Actual choice depends on layout, caching, row widths and other costs. Statistics describe counts and distributions so the optimizer can estimate those costs. Plain EXPLAIN shows the proposed plan without running the ordinary result query. Materialization stores an intermediate set for later consumption; pipelining passes rows onward as produced when operations allow it.","criteria":["Explain selective versus broad matching without claiming an index always wins.","Connect statistics to estimates and accurately describe plain EXPLAIN.","Define materialization and pipelining and explain their intermediate-result behavior."]}],"choices":[["An early projection removes Sale.shop_id before a join on that column. What is the problem?",["It makes the join condition impossible to evaluate.","It guarantees the same result faster.","It converts the join into a sort."],0,"Columns needed by later joins, filters or output must survive until they are used."],["Which statement collects PostgreSQL statistics for planning?",["COMMIT","ANALYZE shop","DROP TABLE shop"],1,"ANALYZE updates table statistics used by the optimizer."]]}];
lessons.forEach((l,i)=>l.mc.push(...assessments[i].choices));</script><script>'use strict';
const palette=[
 ['#006957','#cff6df','⌘'],['#9a3d20','#ffdfcc','⇄'],['#005e97','#d6edff','▦'],
 ['#8a3151','#ffe0e9','{ }'],['#00596d','#caf1f6','≋'],['#815012','#ffedb5','↶'],['#315e38','#daf3ce','⋈']
];
const storeKey = 'cs422-atlas-1';
const main = document.getElementById('main');
let saved = {};
try { saved = JSON.parse(localStorage.getItem(storeKey)) || {}; } catch {}
if (Array.isArray(saved) || typeof saved !== 'object') saved = {};
let topic = 0, phase = 0, frame = 0;
function persist() {
  try { localStorage.setItem(storeKey, JSON.stringify(saved)); }
  catch { document.querySelector('.rail-foot small').textContent = 'Progress available in this tab only'; }
}
function record(i) {
  if (!saved[i] || typeof saved[i] !== 'object') saved[i] = {};
  return saved[i];
}
function escapeText(value) {
  return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function path(i, step=0) { return '#topic-'+(i+1)+'-'+(step+1); }
function color(i) { return '--t:'+palette[i][0]+';--bg:'+palette[i][1]; }
function answer(text) { return '<div class="answer'+(text.includes('\n')?' code':'')+'">'+escapeText(text)+'</div>'; }
function panel(title, body) { return '<section class="panel"><h2>'+escapeText(title)+'</h2>'+body+'</section>'; }
function closedMocks() { return lessons.filter((_,i)=>testIsSubmitted(i)).length; }
function updateNav() {
  document.getElementById('mock-count').textContent = closedMocks()+' / 7';
  document.getElementById('meter').value = closedMocks();
  document.querySelectorAll('nav a').forEach(a=>{
    const href=a.getAttribute('href');
    const selected=href===location.hash || (href==='#map' && !location.hash) ||
      (href.startsWith('#topic-') && location.hash.startsWith(href.slice(0,-1)));
    if(selected) a.setAttribute('aria-current','page');
    else a.removeAttribute('aria-current');
  });
}
document.getElementById('topic-nav').innerHTML=lessons.map((l,i)=>'<a href="'+path(i)+'"><span class="dot" style="'+color(i)+'">'+(i+1)+'</span>'+l.title+'</a>').join('');
function score(s,l) {
  let correct=l.mc.filter((q,i)=>s['pick'+i]===q[2]).length;
  let criteria=l.exam[2].filter((_,i)=>s['criterion'+i]).length;
  return '<span class="score">Multiple choice '+correct+' / '+l.mc.length+' · Written self-check '+criteria+' / '+l.exam[2].length+'</span>';
}
const paths = [{id:0,name:'Learn & theory'}, {id:2,name:'Worked examples'}, {id:3,name:'Practice test'}];
const names = ['Library records','Wallet transfer','Project totals','Department lookup','Shared scoreboard','Recovery log','Query plan'];
const snapshots = [
  [['Reader','7 · Ada'],['Loan 31','reader_id = 7'],['Loan 32','reader_id = 7']],
  [['Before','A: 5   B: 2'],['Commit','A: 3   B: 4'],['Rollback','A: 5   B: 2']],
  [['Atlas','2 + 6 = 8 h'],['Beacon','4 + 1 = 5 h'],['Comet','9 h']],
  [['Input','department = 10'],['Ada','10 · match'],['Bo','20 · skipped']],
  [['A reads','10'],['B reads','10'],['Both write','11 · lost update']],
  [['Disk','X = 4'],['Committed log','X: 4 → 7'],['After REDO','X = 7']],
  [['Inputs','Shop + Sale'],['Filter','region = East'],['Output','12, 15']]
];
function mini(i) {
  return '<div class="snapshot"><div class="snap-title"><span aria-hidden="true">▦</span>'+names[i]+'</div>'+snapshots[i].map(([a,b])=>'<div class="snap-row"><b>'+a+'</b><span>'+b+'</span></div>').join('')+'</div>';
}
function overview(){
  const n=Number.isInteger(saved.last)&&lessons[saved.last]?saved.last:0;
  return '<section class="welcome"><div><h1>Database Notes</h1><p>Follow the data from one row to the next. Each topic includes a visual explanation and three fully worked examples.</p><a class="btn" href="'+path(n,record(n).phase||0)+'">'+(Number.isInteger(saved.last)?'Continue reading':'Start with database design')+'</a></div>'+mini(0)+'</section><div class="section-title"><h2>Your study map</h2><a class="text-link" href="#blueprint">ER blueprints</a></div><div class="mapgrid">'+lessons.map((l,i)=>'<a class="topic" href="'+path(i,record(i).phase||0)+'" style="'+color(i)+'"><span class="tile-icon">'+palette[i][2]+'</span><small>'+(testIsSubmitted(i)?'Test completed':'Topic '+(i+1))+'</small><h3>'+l.title+'</h3><p>'+guides[i].links.join(' · ')+'</p></a>').join('')+'</div>';
}
function blueprintView(){
  return '<div class="blue-head"><h1>ER blueprints</h1><p>An entity–relationship diagram maps a rule about the real world to tables and keys. Each example below shows how to read the line in both directions.</p></div>'+
    panel('Reading the symbols','<p><strong>PK</strong> identifies one row. <strong>FK</strong> points to a key in another table. <strong>1</strong> means exactly one, <strong>0..1</strong> means zero or one, and <strong>0..*</strong> means zero or many. Read from one box toward the label beside the other box.</p>')+
    drawings.join('')+'<div class="next"><a class="btn solid" href="'+path(0,2)+'">See the three worked designs</a></div>';
}
function headerFor(l){
  return '<section class="welcome lesson-welcome"><div><div class="over">Topic '+(topic+1)+' of 7</div><h1>'+l.title+'</h1><p>'+guides[topic].deck+'</p></div>'+mini(topic)+'</section>';
}
function walk(){
 const l=lessons[topic],f=l.frames[frame];
 return '<div class="switcher" aria-label="Walkthrough steps">'+l.frames.map((item,i)=>'<button type="button" data-frame="'+i+'" aria-pressed="'+(frame===i)+'">'+escapeText(item[0])+'</button>').join('')+'</div>'+
 '<div class="walk-output" aria-live="polite"><h3>'+escapeText(f[1])+'</h3><div class="walk-lines"><span>'+escapeText(f[2])+'</span><span>'+escapeText(f[3])+'</span></div><p>'+escapeText(f[4])+'</p></div>';
}
function reading(){
 return guides[topic].body + definitionReference() + panel(lessons[topic].demo,'<div id="frames">'+walk()+'</div>')+(topic===0?'<p><a class="text-link" href="#blueprint">Explore all three ER blueprints</a></p>':'');
}
function worked(){
 const g=guides[topic];
 return '<div class="jump"><strong>Worked examples</strong>'+g.examples.map((x,i)=>'<button type="button" data-jump="'+i+'">'+(i+1)+'. '+x.match(/<h2>(.*?)<\/h2>/)[1]+'</button>').join('')+'</div>'+
 g.examples.map((x,i)=>'<div id="case-'+i+'" class="case-wrap" tabindex="-1">'+x+'</div>').join('');
}
function render(){
 const hash=location.hash, match=/^#topic-([1-7])-([1-4])$/.exec(hash);
 let label;
 if(match){
  topic=Number(match[1])-1;
  phase=Number(match[2])-1;
  // Existing bookmarks for the former Theory tab open the combined chapter.
  if(phase===1)phase=0;
  frame=0;
  const l=lessons[topic];saved.last=topic;record(topic).phase=phase;persist();label=l.title;
  const tabs='<div class="tabs" aria-label="Topic sections">'+paths.map(s=>'<a href="'+path(topic,s.id)+'" '+(s.id===phase?'class="active" aria-current="page"':'')+'>'+s.name+'</a>').join('')+'</div>';
  const content=phase===0?reading():phase===2?worked():mock(l);
  const next=phase===0?'<a class="btn solid" href="'+path(topic,2)+'">Read worked examples</a>':phase===2?'<a class="btn solid" href="'+path(topic,3)+'">Practice test</a>':testIsSubmitted(topic)?'<a class="btn solid" href="'+(topic<6?path(topic+1):'#map')+'">'+(topic<6?'Next topic':'Study map')+'</a>':'';
  main.innerHTML='<div style="'+color(topic)+'">'+headerFor(l)+tabs+content+'<div class="next">'+next+'</div></div>';
 }else if(hash==='#blueprint'){label='ER blueprints';main.innerHTML=blueprintView();}
 else{label='Study map';main.innerHTML=overview();}
 document.getElementById('crumb').textContent=label;document.title=label+' · Database Notes';
 document.body.classList.remove('open');document.getElementById('menu').setAttribute('aria-expanded','false');updateNav();
}
document.getElementById('menu').onclick=e=>e.currentTarget.setAttribute('aria-expanded', String(document.body.classList.toggle('open')));
document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.body.classList.remove('open');document.getElementById('menu').setAttribute('aria-expanded','false');}});
main.addEventListener('input',e=>{
  const el=e.target,s=record(topic);
  if(el.matches('[data-draft]')) {s[el.dataset.draft]=el.value;el.setCustomValidity('');}
  else if(el.type==='radio'&&!el.dataset.answer) s[el.name]=Number(el.value);
  else if(el.matches('[data-criterion]')) {s['criterion'+el.dataset.criterion]=el.checked;document.getElementById('grade').innerHTML=score(s,lessons[topic]);}

});
main.addEventListener('click',async e=>{
  const button=e.target.closest('button');if(!button)return;
  if(button.hasAttribute('data-frame')) {frame=Number(button.dataset.frame);document.getElementById('frames').innerHTML=walk();document.querySelector('[data-frame="'+frame+'"]').focus();}
  if(button.hasAttribute('data-jump')){
    const card=document.getElementById('case-'+button.dataset.jump);
    card.focus({preventScroll:true});card.scrollIntoView({block:'start'});
  }
  if(button.hasAttribute('data-copy')){
    const block=button.parentElement.nextElementSibling;
    try{await navigator.clipboard.writeText(block.textContent);button.textContent='Copied';}
    catch{const range=document.createRange();range.selectNodeContents(block);const selection=window.getSelection();selection.removeAllRanges();selection.addRange(range);button.textContent='Use ⌘C / Ctrl+C';}
  }
});
window.addEventListener('hashchange',()=>{if(location.hash==='#main'){main.focus();return;}render();window.scrollTo(0,0);main.focus({preventScroll:true});});

 const items=assessments[topic].terms;
 return '<section class="reading"><h2>Definitions with examples</h2><p>These '+items.length+' terms also appear in the definition section of the practice test.</p><dl class="concepts">'+items.map(item=>'<div><dt>'+escapeText(item.term)+'</dt><dd><p>'+escapeText(item.definition)+'</p><p class="term-example"><strong>Example</strong> · '+escapeText(item.example)+'</p></dd></div>').join('')+'</dl></section>';
}

const TEST_VERSION = 2;
function testRecord(i=topic) {
  const owner=record(i);
  if(!owner.practiceTest || owner.practiceTest.version!==TEST_VERSION){
    owner.practiceTest={version:TEST_VERSION,section:'definitions',definitions:{},choices:{},essays:{},marks:{},history:[]};
  }
  const t=owner.practiceTest;
  for(const key of ['definitions','choices','essays','marks'])if(!t[key]||typeof t[key]!=='object')t[key]={};
  if(!Array.isArray(t.history))t.history=[];
  return t;
}
function completeText(value){return typeof value==='string'&&value.trim().length>0;}
function testCounts(i=topic){
  const t=testRecord(i),a=assessments[i];
  return {
    definitions:a.terms.filter((_,n)=>completeText(t.definitions[n])).length,
    choices:lessons[i].mc.filter((q,n)=>Number.isInteger(t.choices[n])&&t.choices[n]>=0&&t.choices[n]<q[1].length).length,
    essays:a.essays.filter((_,n)=>completeText(t.essays[n])).length
  };
}
function testIsSubmitted(i){return !!testRecord(i).submitted;}
function previousTest(){
  const old=record(topic);
  return old.submitted?'<details class="previous"><summary>Your earlier short test</summary><p>This saved result belongs to the earlier two-choice and one-problem version.</p>'+score(old,{...lessons[topic],mc:lessons[topic].mc.slice(0,2)})+'<p>'+escapeText(old.written||'')+'</p></details>':'';
}
function testSummary(){
  const t=testRecord(),a=assessments[topic],questions=lessons[topic].mc;
  const correct=questions.filter((q,i)=>t.choices[i]===q[2]).length;
  const keys=[...a.terms.map((_,i)=>'d'+i),...a.essays.map((_,i)=>'e'+i)];
  const graded=keys.filter(k=>Number.isInteger(t.marks[k]));
  const selfPoints=graded.reduce((sum,k)=>sum+t.marks[k],0);
  const possibleSelf=2*a.terms.length+3*a.essays.length;
  return '<strong>Multiple choice · '+correct+' / '+questions.length+' automatically scored</strong><p>Written self-assessment · '+selfPoints+' / '+possibleSelf+' points recorded. '+graded.length+' of '+keys.length+' responses marked.</p>'+
    (graded.length===keys.length?'<p><strong>Total with your self-assessment · '+(correct+selfPoints)+' / '+(questions.length+possibleSelf)+'</strong></p>':'<p>Complete the self-assessment for each definition and essay to calculate a total.</p>');
}
function markSelect(key,max){
 const t=testRecord();
 return '<label class="mark-label">Your self-assessed points <select data-mark="'+key+'"><option value="">Not marked yet</option>'+
   Array.from({length:max+1},(_,n)=>'<option value="'+n+'" '+(t.marks[key]===n?'selected':'')+'>'+n+' / '+max+'</option>').join('')+'</select></label>';
}
function definitionTest(){
 const a=assessments[topic],t=testRecord();
 return '<div class="test-instructions"><h2>Explain every term</h2><p>For each term, write its meaning and one concrete example. After submission, award one point for an accurate definition and one for a correct example. Use the model answer to check both.</p></div>'+
   a.terms.map((item,i)=>'<article class="test-item"><label class="prompt" for="definition-'+i+'">'+(i+1)+'. Define '+escapeText(item.term)+' and give an example.</label><textarea id="definition-'+i+'" data-answer="definitions" data-item="'+i+'" '+(t.submitted?'readonly':'')+'>'+escapeText(t.definitions[i])+'</textarea>'+
   (t.submitted?'<div class="model"><h3>Model definition</h3><p>'+escapeText(item.definition)+'</p><h3>Example</h3><p>'+escapeText(item.example)+'</p>'+markSelect('d'+i,2)+'</div>':'')+'</article>').join('');
}
function choiceTest(){
 const t=testRecord();
 return '<div class="test-instructions"><h2>Choose the correct answer</h2><p>Each question earns one point. Answers and explanations appear after submission.</p></div>'+
  lessons[topic].mc.map(([q,options,right,why],i)=>'<fieldset class="test-item"><legend>'+(i+1)+'. '+escapeText(q)+'</legend>'+options.map((o,j)=>'<label class="option"><input type="radio" data-answer="choices" data-item="'+i+'" name="new-choice-'+i+'" value="'+j+'" '+(t.choices[i]===j?'checked ':'')+(t.submitted?'disabled':'')+'>'+escapeText(o)+'</label>').join('')+
  (t.submitted?'<div class="result"><strong>'+(t.choices[i]===right?'Correct.':t.choices[i]===undefined?'Unanswered.':'Review this answer.')+'</strong><p>Correct answer · '+escapeText(options[right])+'</p><p>'+escapeText(why)+'</p></div>':'')+'</fieldset>').join('');
}
function essayTest(){
 const a=assessments[topic],t=testRecord();
 return '<div class="test-instructions"><h2>Four written problems</h2><p>Explain your reasoning and include tables, SQL or operation traces when requested. Each problem has three marking criteria worth one point each. Equivalent correct solutions earn credit.</p></div>'+
 a.essays.map((item,i)=>'<article class="test-item"><h3>'+(i+1)+'. '+escapeText(item.title)+'</h3><p>'+escapeText(item.prompt)+'</p><label class="prompt" for="essay-'+i+'">Your response to problem '+(i+1)+'</label><textarea class="essay-input" id="essay-'+i+'" data-answer="essays" data-item="'+i+'" '+(t.submitted?'readonly':'')+'>'+escapeText(t.essays[i])+'</textarea>'+
 (t.submitted?'<div class="model"><h3>Model answer</h3>'+answer(item.answer)+'<h3>Marking criteria · one point each</h3><ol>'+item.criteria.map(c=>'<li>'+escapeText(c)+'</li>').join('')+'</ol>'+markSelect('e'+i,3)+'</div>':'')+'</article>').join('');
}
function archiveTests(){
 const history=testRecord().history;
 return history.length?'<details class="previous"><summary>Previous attempts ('+history.length+')</summary>'+history.map((t,i)=>'<details><summary>Attempt '+(i+1)+'</summary>'+assessments[topic].terms.map((term,j)=>'<p><strong>'+escapeText(term.term)+'</strong></p>'+answer(t.definitions[j]||'Unanswered')).join('')+lessons[topic].mc.map((q,j)=>'<p>'+escapeText(q[0])+'</p>'+answer(Number.isInteger(t.choices[j])?q[1][t.choices[j]]:'Unanswered')).join('')+assessments[topic].essays.map((q,j)=>'<p><strong>'+escapeText(q.title)+'</strong></p>'+answer(t.essays[j]||'Unanswered')).join('')+'</details>').join('')+'</details>':'';
}
function mock(){
 const t=testRecord(),a=assessments[topic],counts=testCounts();
 const sections=[['definitions','Definitions',a.terms.length],['choices','Multiple choice',lessons[topic].mc.length],['essays','Written problems',a.essays.length]];
 const chosen=sections.some(s=>s[0]===t.section)?t.section:'definitions';
 const body={definitions:definitionTest,choices:choiceTest,essays:essayTest}[chosen]();
 const total=a.terms.length+lessons[topic].mc.length+a.essays.length;
 return '<section class="test-intro"><h2>Practice test</h2><p>'+a.terms.length+' definitions, '+lessons[topic].mc.length+' multiple-choice questions and four written problems. Your draft saves as you type, so you can work through the sections over several visits.</p>'+
 (t.submitted?'<div class="test-grade" id="test-grade">'+testSummary()+'</div>':'<p id="test-completion">'+(counts.definitions+counts.choices+counts.essays)+' of '+total+' responses entered.</p>')+'</section>'+previousTest()+
 '<div class="test-sections" aria-label="Practice test sections">'+sections.map(([key,label,max])=>'<button type="button" data-test-section="'+key+'" aria-pressed="'+(chosen===key)+'">'+label+' <span id="count-'+key+'">'+counts[key]+' / '+max+'</span></button>').join('')+'</div>'+body+
 '<div class="test-actions">'+(t.submitted?'<button class="action" type="button" data-test-retry>Start another attempt</button>':'<button class="btn solid" type="button" data-test-submit>Submit all sections</button>')+'</div>'+archiveTests();
}
function refreshTestCounts(){
 const counts=testCounts();
 for(const k of Object.keys(counts)){
  const el=document.getElementById('count-'+k);
  if(el)el.textContent=counts[k]+' / '+(k==='choices'?lessons[topic].mc.length:assessments[topic][k==='definitions'?'terms':'essays'].length);
 }
 const el=document.getElementById('test-completion');
 if(el)el.textContent=(counts.definitions+counts.choices+counts.essays)+' of '+(assessments[topic].terms.length+lessons[topic].mc.length+4)+' responses entered.';
}
main.addEventListener('input',e=>{
 const el=e.target;
 if(!el.dataset.answer)return;
 const t=testRecord();
 if(t.submitted)return;
 t[el.dataset.answer][el.dataset.item]=el.dataset.answer==='choices'?Number(el.value):el.value;
 persist();refreshTestCounts();
});
main.addEventListener('change',e=>{
 const el=e.target;
 if(!el.dataset.mark)return;
 const t=testRecord();if(!t.submitted)return;
 if(el.value==='')delete t.marks[el.dataset.mark];else t.marks[el.dataset.mark]=Number(el.value);
 persist();document.getElementById('test-grade').innerHTML=testSummary();
});
main.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 const t=testRecord();
 if(b.dataset.testSection){
  t.section=b.dataset.testSection;persist();render();
  document.querySelector('[data-test-section="'+t.section+'"]').focus();
 }
 if(b.hasAttribute('data-test-submit')){
  const c=testCounts(),total=assessments[topic].terms.length+lessons[topic].mc.length+4;
  const missing=total-c.definitions-c.choices-c.essays;
  if(missing&&!window.confirm('There are '+missing+' unanswered items. Submit this attempt and reveal all answers?'))return;
  t.submitted=true;t.submittedAt=new Date().toISOString();persist();render();
  document.getElementById('test-grade').scrollIntoView({block:'center'});
 }
 if(b.hasAttribute('data-test-retry')){
  if(!window.confirm('Save this attempt in Previous attempts and start a blank practice test?'))return;
  const {history,...attempt}=t;history.push(attempt);
  record(topic).practiceTest={version:TEST_VERSION,section:'definitions',definitions:{},choices:{},essays:{},marks:{},history};
  persist();render();main.focus();window.scrollTo(0,0);
 }
});

render();</script></body></html>
