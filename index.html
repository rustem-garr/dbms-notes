d by B."}, {"term": "Conflicting operations", "definition": "Operations from different transactions on the same data item where at least one operation writes.", "example": "A reading X before B writes X is a conflict. Two reads of X do not conflict."}, {"term": "Conflict serializability", "definition": "The property that a schedule can be transformed into a serial schedule by swapping adjacent nonconflicting operations.", "example": "A precedence graph with only A → B is conflict-serializable in order A then B."}, {"term": "Precedence graph", "definition": "A directed graph with transactions as nodes and an edge from the earlier to the later transaction for each conflicting operation pair.", "example": "A writes X before B reads X creates A → B."}, {"term": "Cycle", "definition": "A directed path that returns to its starting node. In a precedence graph it rules out conflict serializability.", "example": "A → B → A requires each transaction to precede the other."}, {"term": "Topological order", "definition": "An ordering of the nodes of an acyclic directed graph in which every edge points forward.", "example": "For A → B and A → C, A,B,C or A,C,B is a valid serial order."}, {"term": "Shared lock", "definition": "A read lock that can coexist with other shared locks on the same resource but conflicts with an exclusive lock.", "example": "Two readers can both hold shared locks on X."}, {"term": "Exclusive lock", "definition": "A lock used to protect writes, conflicting with another transaction's shared or exclusive lock on the same resource.", "example": "A writer holding an exclusive lock on a seat can block another locker of that seat."}, {"term": "Two-phase locking (2PL)", "definition": "A locking protocol with a growing phase that acquires locks and a shrinking phase that releases locks, with no new lock acquisition after the first release.", "example": "A transaction locks X and Y, then unlocks X and may no longer acquire a new lock on Z."}, {"term": "Strict 2PL", "definition": "A form of two-phase locking that retains exclusive locks until the transaction commits or aborts.", "example": "Other transactions cannot acquire a conflicting lock on a written item before the writer finishes."}, {"term": "Blocking", "definition": "Waiting because another transaction holds an incompatible lock on a required resource.", "example": "B waits for A's exclusive lock on X, then proceeds when A commits."}, {"term": "Deadlock", "definition": "A cycle of transactions waiting for resources held by each other, preventing progress without intervention.", "example": "A holds X and waits for Y, while B holds Y and waits for X."}, {"term": "Wait-for graph", "definition": "A graph whose edge points from a transaction currently waiting to the transaction holding the needed incompatible lock.", "example": "A waiting for B's lock creates A → B, regardless of their earlier read/write order."}, {"term": "Deadlock victim / rollback", "definition": "A transaction selected to abort so its locks can be released and a wait cycle can be broken.", "example": "Abort B, release its lock on Y and allow A to continue."}, {"term": "Timestamp ordering", "definition": "Concurrency control that assigns transaction timestamps and rejects operations violating the required timestamp order.", "example": "An older transaction may restart when its proposed write is incompatible with an already accepted newer read."}, {"term": "Optimistic concurrency control", "definition": "A method that reads and computes speculatively, validates for conflicts, then installs accepted changes.", "example": "An editor checks that row version 5 is still current before saving."}, {"term": "Validation phase", "definition": "The optimistic-control stage that checks whether a transaction can commit its proposed changes without an unacceptable conflict.", "example": "A changed row version makes validation fail and triggers a retry."}, {"term": "Recoverable schedule", "definition": "If a transaction reads a value written by another transaction, it does not commit before that writer commits.", "example": "If B reads A’s uncommitted write, A must commit before B can safely commit; if A aborts, B must also abort."}, {"term": "Cascading rollback", "definition": "One transaction’s abort forces dependent transactions that read its uncommitted values to abort too.", "example": "A aborts after B read from A and C read from B, so B and C must roll back."}, {"term": "Cascadeless schedule", "definition": "Transactions read values written by another transaction only after that writer commits.", "example": "B waits for A’s commit before reading A’s new value, avoiding a dirty-read dependency."}, {"term": "Rigorous 2PL", "definition": "A locking variant that holds both shared and exclusive locks until transaction end.", "example": "A read lock as well as a write lock remains held until COMMIT or ROLLBACK. Strict 2PL requires holding exclusive locks; terminology may vary in teaching materials."}, {"term": "Lock granularity", "definition": "The size of a resource protected by a lock, such as a row, page, table or database.", "example": "A table lock is simpler to manage but can block unrelated row updates; many row locks allow more concurrency with more lock-management work."}, {"term": "Lock upgrade / downgrade", "definition": "Changing an existing shared lock to exclusive, or exclusive to shared.", "example": "Under basic 2PL, an upgrade belongs in the growing phase and a downgrade in the shrinking phase."}, {"term": "Timeout", "definition": "A waiting-time limit after which an operation or transaction may be cancelled or retried.", "example": "A request can time out even without a deadlock, so timeout alone is not proof of a wait cycle."}, {"term": "Wait-die", "definition": "A timestamp-based deadlock prevention rule: an older requester may wait for a younger holder; a younger requester aborts when blocked by an older holder.", "example": "T1 timestamp 10 requests a lock held by T2 timestamp 20: T1 waits. Reverse the roles: T2 dies and restarts with its original timestamp."}, {"term": "Wound-wait", "definition": "A deadlock prevention rule: an older requester aborts a younger holder; a younger requester may wait for an older holder.", "example": "T1 timestamp 10 requests T2’s lock, timestamp 20: T2 is wounded. T2 requesting T1’s lock waits."}, {"term": "Starvation", "definition": "A transaction is repeatedly delayed or restarted so that it does not make progress.", "example": "Always choosing the same transaction as the deadlock victim can starve it."}, {"term": "Transaction timestamp", "definition": "A unique ordering value indicating a transaction’s relative age in a timestamp-based protocol.", "example": "Timestamp 10 is older than timestamp 20; it can come from a counter rather than wall-clock time."}, {"term": "Read timestamp / write timestamp", "definition": "In basic timestamp ordering, metadata recording the greatest timestamp of transactions that successfully read or wrote an item.", "example": "If X has W_TS=20, a transaction with timestamp 10 cannot read that newer version under basic timestamp ordering."}, {"term": "Optimistic read / write phases", "definition": "In optimistic control, read and compute into private state first; publish updates in the write phase only after successful validation.", "example": "An editor reads version 5, computes locally, validates that its dependencies still permit serialization, then publishes; failed validation restarts the operation."}], "essays": [{"title": "Identify and repair three anomalies", "prompt": "Name and explain each problem. (a) A and B read score 10 and both write 11. (b) B reads A’s uncommitted change, then A rolls back. (c) A report reads one account before a transfer and the other afterward. Give an appropriate remedy for each.", "answer": "(a) Lost update. The expected two increments yield 12, but a stale replacement overwrites one. Use an atomic increment, or protect/validate the whole read–modify–write sequence. (b) Dirty read. B observed work that never committed. Prevent uncommitted reads using an appropriate isolation level such as Read Committed. (c) Inconsistent analysis. The total combines different states. Use one statement snapshot or a suitable consistent transaction snapshot for all reads.", "criteria": ["Correctly name all three anomalies.", "Explain the specific unsafe sequence and its consequence in each case.", "Give a matching remedy that protects the whole necessary operation or view."]}, {"title": "Build a precedence graph", "prompt": "The schedule is rA(X), wB(X), wA(Y), rB(Y), where r means read and w means write. List the conflicts, draw their edges and decide conflict serializability. Then add wB(Z) before rA(Z) and explain how the conclusion changes.", "answer": "Original conflicts are rA(X) before wB(X) and wA(Y) before rB(Y). Both give A → B. The graph is acyclic and serial order A then B preserves these conflicts. Adding wB(Z) before rA(Z) creates B → A. Together with A → B this is a cycle, so the modified schedule is not conflict-serializable.", "criteria": ["Identify both original same-item read/write conflicts and their direction.", "Give the acyclic graph and serial order A then B.", "Identify the added reverse edge and explain why the resulting cycle changes the result."]}, {"title": "Distinguish blocking, deadlock and 2PL", "prompt": "A locks X exclusively and B requests X. Later consider a different case where A holds X and requests Y while B holds Y and requests X. Explain each case, draw wait edges, give a deadlock remedy, and explain whether strict 2PL eliminates all deadlocks.", "answer": "In the first case B waits for A, giving B → A. This alone is blocking and may resolve when A commits. In the second case A → B and B → A form a wait cycle, so it is a deadlock. A detector can roll back one victim and release its locks. Acquiring locks in a consistent global order can prevent this pattern. Strict 2PL holds exclusive locks until commit or abort and ensures conflict serializability with 2PL, but deadlocks remain possible.", "criteria": ["Distinguish one-way blocking from the two-way wait cycle and give correct wait edges.", "Give a concrete recovery or prevention method.", "Define strict 2PL correctly and explain that it still permits deadlocks."]}], "choices": [["What is a lost update?", ["One transaction overwrites another's change after both used an old value", "A SELECT returns zero rows", "A disk backup is misplaced", "A committed row is always deleted"], 0, "If both sessions read 10 and independently write 11, one increment disappears. Atomic updates or suitable locking can avoid this pattern."], ["What is a dirty read?", ["Reading an old backup while offline", "Reading a value written by another transaction before it commits", "Reading the same committed value twice", "Reading with an index"], 1, "The writer may roll back, so the reader may rely on a value that never becomes committed data."], ["What is inconsistent analysis?", ["Reading only primary keys", "Returning a correctly ordered result", "Computing a result from a mixture of states while concurrent updates occur", "Rejecting every overlapping transaction"], 2, "A total can combine a debited account with a not-yet-observed credit and represent no single consistent state."], ["What does serializability mean?", ["All transactions must run at the same wall-clock instant", "Every read must use a primary key", "Transactions are ordered alphabetically", "A concurrent schedule has an effect equivalent to some serial execution"], 3, "Serializable execution permits concurrency while producing an outcome consistent with a serial ordering."], ["Which pair of operations conflicts in conflict-serializability analysis?", ["Operations from different transactions on the same item with at least one write", "Two reads of the same item", "Two operations on different items, always", "Any two statements by the same transaction"], 0, "Read–write, write–read and write–write pairs on the same item can conflict. Read–read pairs do not."], ["When is a schedule conflict-serializable?", ["It has no SELECT statements", "Its precedence graph is acyclic", "Its graph contains at least one cycle", "Every transaction reads the same item"], 1, "An acyclic graph admits a topological order giving an equivalent serial order. A cycle rules out conflict serializability."], ["Which lock compatibility statement is correct in the standard shared/exclusive model?", ["Two exclusive locks always coexist", "Shared locks prohibit every reader", "Shared locks can coexist; an exclusive lock conflicts with other shared or exclusive locks on the same item", "Exclusive locks are compatible with every shared lock"], 2, "Shared locks allow concurrent reads. An exclusive lock reserves the item for conflicting modification."], ["What rule defines basic two-phase locking (2PL)?", ["A transaction may lock only two rows", "Every transaction must commit twice", "All locks are released before any write", "After releasing a lock, a transaction acquires no new locks"], 3, "The growing phase acquires locks; the shrinking phase releases them. Basic 2PL ensures conflict serializability but can deadlock."], ["How does strict 2PL strengthen basic 2PL?", ["It holds exclusive locks until commit or rollback", "It permits reading uncommitted writes", "It forbids all shared locks", "It guarantees that deadlocks cannot occur"], 0, "Holding write locks until the transaction ends prevents others from reading or overwriting its uncommitted data, avoiding cascading rollback from those dependencies."], ["What distinguishes a deadlock from ordinary blocking?", ["A reader uses a shared lock", "A cycle of transactions waits for resources held by one another", "Any transaction waits for one second", "Any table has a foreign key"], 1, "A wait cycle has no member able to proceed without intervention. Detection can choose a victim to roll back; consistent lock ordering can prevent many cycles."], ["Which contrast between timestamp ordering and optimistic control is correct?", ["Optimistic control skips conflict checks", "Timestamp ordering requires alphabetical transaction names", "Timestamp ordering enforces a timestamp order; optimistic control validates conflicts before completing writes", "Both guarantee no transaction will ever restart"], 2, "Both may reject or restart conflicting work. Optimistic control typically uses read, validation and write phases; timestamp rules reject operations that violate the order."]]}, {"terms": [{"term": "Database recovery", "definition": "Restoring a valid database state after failure using surviving data and recovery records.", "example": "Reapply a missing committed update and remove an unfinished update after a crash."}, {"term": "Data page", "definition": "A block of database storage read or written as a unit, often cached in memory before being flushed to disk.", "example": "A modified balance can be in a memory page before the corresponding disk page is updated."}, {"term": "Transaction log / journal", "definition": "An ordered record of transaction actions and outcomes used for recovery.", "example": "A log can record START T1, an X update and COMMIT T1."}, {"term": "Before-image", "definition": "The value of an item before a logged change.", "example": "For X:4→7, the before-image is 4."}, {"term": "After-image", "definition": "The value of an item after a logged change.", "example": "For X:4→7, the after-image is 7."}, {"term": "Commit record", "definition": "A log record indicating that a transaction completed successfully.", "example": "COMMIT T1 distinguishes finished T1 from a transaction still active at the crash."}, {"term": "Transaction failure", "definition": "Failure or cancellation of one transaction, requiring removal of its unfinished effects.", "example": "A constraint violation causes a booking transaction to roll back."}, {"term": "System crash", "definition": "Loss of running processes or volatile memory while persistent database and log files may survive.", "example": "A power failure loses cached pages that had not reached disk."}, {"term": "Media failure", "definition": "Damage or loss of persistent storage containing database files or logs.", "example": "A destroyed disk requires recovery from a surviving copy elsewhere."}, {"term": "UNDO / backward recovery", "definition": "Reversing effects that must be removed, typically using before-images in the stated recovery model.", "example": "Undo an unfinished Y:2→5 change to restore Y=2."}, {"term": "REDO / forward recovery", "definition": "Reapplying effects that must survive, typically using after-images in the stated recovery model.", "example": "Redo a missing committed X:4→7 change to restore X=7."}, {"term": "Write-ahead logging (WAL)", "definition": "The rule that required log records become durable before their changed data page is written, with required commit log records flushed before acknowledging a durable commit.", "example": "A page containing X=7 can be written only after its corresponding recovery information is safely logged."}, {"term": "Checkpoint", "definition": "A recorded recovery milestone that helps limit restart work and describes the necessary recovery state, including relevant active work.", "example": "A transaction active at a checkpoint can still need rollback if it never commits."}, {"term": "Deferred update", "definition": "A recovery approach that keeps unfinished updates from reaching database data pages before commit.", "example": "Committed changes missing from disk may need REDO, while unfinished data-page changes need no UNDO under this model."}, {"term": "Immediate update", "definition": "A recovery approach that allows changed data pages to reach disk before transaction commit.", "example": "Both UNDO of unfinished changes and REDO of missing committed changes may be required."}, {"term": "Shadow paging", "definition": "A recovery approach that keeps an unchanged page mapping while writing a new version separately, publishing the version by an atomic durable root switch.", "example": "Before the switch, the old root still locates the previous committed pages."}, {"term": "Root pointer", "definition": "The reference identifying the page mapping that represents the current committed version in shadow paging.", "example": "Switching the durable root publishes the new page set."}, {"term": "Backup", "definition": "A separately retained copy of database data usable as a restoration starting point.", "example": "A 09:00 backup restores the base state after a disk failure."}, {"term": "Archived log", "definition": "A retained log segment used to replay changes beyond a backup or support other recovery needs.", "example": "Replay committed sales recorded after the 09:00 backup."}, {"term": "Flush / stable storage", "definition": "Flushing writes buffered information to the storage layer with the persistence guarantees required by the recovery protocol.", "example": "A durable commit flushes its required log records before reporting success."}, {"term": "Volatile storage", "definition": "Storage whose contents are lost when power or the relevant system state is lost.", "example": "In-memory page buffers can vanish in a system crash."}, {"term": "Nonvolatile storage", "definition": "Storage that retains data across ordinary power loss, but can still suffer device failure.", "example": "A database file on an SSD survives a process crash but not destruction of that SSD."}, {"term": "Recovery manager", "definition": "The DBMS component that coordinates restoring a correct state after failures.", "example": "It uses transaction status and recovery records to preserve committed effects and remove incomplete effects under the chosen algorithm."}, {"term": "Application / human / site failure", "definition": "Failures caused by incorrect application operations, accidental or malicious changes, or damage to an entire location.", "example": "A committed accidental DELETE may require point-in-time restoration; a site disaster requires a surviving off-site copy, not only a local log."}], "essays": [{"title": "Recover an immediate-update crash", "prompt": "Under immediate update, T1 changes X from 4 to 7 and commits. T2 changes Y from 2 to 5 and is unfinished at the crash. Disk holds X=4 and Y=5. State the recovery actions, values and ACID properties involved.", "answer": "REDO T1’s missing committed change using X’s after-image 7. UNDO T2’s unfinished change using Y’s before-image 2. The recovered values are X=7 and Y=2. Redo protects durability for committed T1. Undo protects atomicity by removing unfinished T2. The decision depends on the commit records and the stated disk contents.", "criteria": ["Classify T1 as committed and T2 as unfinished.", "Use the correct images, operations and final values.", "Connect REDO to durability and UNDO to atomicity under the stated model."]}, {"title": "Compare recovery strategies", "prompt": "Compare deferred update, immediate update and shadow paging. For each, explain whether unfinished changes may affect database pages and how the committed version is restored or chosen after a crash. Include the case of a shadow-paging crash before the root switch.", "answer": "Deferred update keeps unfinished changes out of database pages, so unfinished data-page effects do not need undo in this model. Committed changes missing on disk may require redo. Immediate update allows unfinished pages to reach disk, so undo may be necessary; committed missing updates may still require redo. Shadow paging writes new pages while preserving the old committed mapping. An atomic durable root switch publishes the new version. Before that switch, recovery uses the old root. After a completed durable switch, it uses the new mapping.", "criteria": ["Accurately describe deferred update and its possible REDO requirement.", "Accurately describe immediate update and possible UNDO plus REDO.", "Explain old/new page mappings and both sides of the shadow root-switch boundary."]}, {"title": "Restore a lost disk and interpret a checkpoint", "prompt": "A surviving backup at 09:00 has 40 tickets available. Archived logs contain a committed sale of 3 at 09:10 and a committed return of 1 at 09:15. A checkpoint occurred on the data disk at 09:17. The disk is destroyed at 09:20. Explain recovery and whether the checkpoint alone is sufficient.", "answer": "Restore the separate backup to reach 40. Replay the committed sale to get 37 and the committed return to get 38. The checkpoint on the destroyed disk cannot supply a surviving full database copy. Checkpoints reduce restart work when their required storage and logs survive. A transaction active at a checkpoint is not automatically committed by that checkpoint.", "criteria": ["Restore the backup and replay both committed changes in order.", "Calculate the final 38 available tickets.", "Explain why the checkpoint is not a backup or an automatic commit for active transactions."]}], "choices": [["Which failure can require restoring a backup because database storage is lost?", ["A normal COMMIT", "Media failure", "An invalid input rejected before execution", "A harmless query returning no rows"], 1, "A damaged or lost disk may destroy data pages. Restoration generally needs a backup plus available logs to recover later work."], ["What is UNDO used for in a traditional immediate-update recovery model?", ["Deleting all checkpoint records", "Reordering SELECT results", "Reversing changes of transactions that did not commit", "Reapplying every committed transaction only"], 2, "Uncommitted changes may have reached disk. UNDO uses earlier values or inverse actions to remove those changes."], ["What is REDO used for?", ["Cancelling every successful transaction", "Changing the meaning of a primary key", "Removing the need for durable logs", "Reapplying logged changes that should be present after recovery"], 3, "A committed change may not yet be on its final data page. REDO can recreate it from durable log information."], ["What does write-ahead logging require before a changed data page reaches durable storage?", ["The corresponding log records must reach durable storage first", "All tables must be exported to CSV", "Every active transaction must commit", "The entire log must be deleted"], 0, "The durable log must describe changes before a data page containing them can survive a crash. Recovery then has the information needed for those changes."], ["What is a checkpoint's main recovery benefit?", ["It permanently disables logging", "It records recovery progress so restart can avoid unnecessary earlier work", "It commits all active transactions", "It replaces all backups"], 1, "A checkpoint provides a known recovery reference. Exact contents and flushing rules depend on the recovery algorithm."], ["Why does traditional deferred update normally need REDO but not UNDO of uncommitted disk updates?", ["All data pages are deleted on error", "Every statement is read-only", "Uncommitted changes are not applied to database pages on disk", "No transaction is allowed to commit"], 2, "Deferred update delays installing changes until commit. Committed changes may need REDO, but uncommitted database-page changes were never installed."], ["Why may immediate update need both UNDO and REDO?", ["It never uses a log", "It forbids rollback", "All pages are forced at every read", "Uncommitted pages may be written, and committed pages may still be unwritten"], 3, "Immediate update permits early page writes. Under the usual steal/no-force model, losers may need UNDO and committed changes may need REDO."], ["What is the central idea of shadow paging?", ["Keep an unchanged page mapping and write changes to new pages, then switch mappings at commit", "Overwrite every old page before starting a transaction", "Store only SELECT statements in a log", "Eliminate all disk pointers"], 0, "An uncommitted working mapping can be discarded. A safely persisted switch publishes the new mapping; implementation must handle allocation and durability correctly."], ["A transaction changes X from 10 to 20, then 20 to 30, but never commits. In what order should its updates be undone?", ["No undo is possible because there are two updates", "30 to 20, then 20 to 10", "10 to 20, then 20 to 30", "30 to 10, then 10 to 20"], 1, "Undo reverses the history. Restoring changes in forward order could leave an intermediate value instead of the original 10."], ["Does a checkpoint make backups unnecessary?", ["Yes; checkpoints prevent every hardware failure", "No, but transaction logs are never useful", "No; backups help recover from lost or damaged storage", "Yes; a checkpoint is always a complete backup"], 2, "Checkpointing speeds crash recovery. Backup and available logs address loss of stored data and later recovery needs."], ["A log shows T1 committed and T2 active at a crash. Under the simplified immediate-update UNDO/REDO model, what is the recovery goal?", ["Undo T1 and commit T2", "Undo both regardless of their status", "Keep every page exactly as found", "Preserve T1's committed changes and remove T2's uncommitted changes"], 3, "REDO may be needed for T1 and UNDO for T2. Real algorithms can organize the physical passes differently while meeting this goal."]]}, {"terms": [{"term": "Query", "definition": "A request for a result expressed in a database language.", "example": "SELECT amount for sales belonging to East-region shops."}, {"term": "Query plan", "definition": "A specification of operations used to produce a query's result.", "example": "Scan Shop, filter East, join Sale on shop ID and return amount."}, {"term": "Query optimization", "definition": "Choosing an efficient equivalent execution plan while preserving the requested results.", "example": "Filter East shops before an inner join to reduce the join input."}, {"term": "Decomposition", "definition": "Parsing, checking and translating a query into an internal representation.", "example": "Resolve Sale.amount and verify that referenced tables and columns exist."}, {"term": "Optimization phase", "definition": "Comparing and transforming valid plans using rules and estimated costs.", "example": "Compare an index lookup with a full scan for the selected region."}, {"term": "Code generation", "definition": "Preparing executable operations from the selected plan.", "example": "Create the operators needed for the chosen scan and join."}, {"term": "Execution", "definition": "Running the prepared plan to obtain result rows.", "example": "Read pages, apply the filter, join matching rows and emit amounts."}, {"term": "Relational algebra", "definition": "A formal set of operations over relations used to express and reason about queries.", "example": "Selection, projection and join describe the steps of the East sales query."}, {"term": "Relational algebra tree", "definition": "A tree whose leaves represent input relations and internal nodes represent operations, with the root producing the answer.", "example": "Two table leaves feed a join whose result feeds a projection."}, {"term": "Leaf / root", "definition": "A leaf is an input at the bottom of a query tree; the root is the final operation producing output at the top.", "example": "Sale and Shop are leaves and projecting amount is the root."}, {"term": "Selection (σ)", "definition": "An operation that keeps rows satisfying a predicate.", "example": "σ region='East'(Shop) keeps East shops."}, {"term": "Projection (π)", "definition": "An operation that keeps selected attributes. Classical relational algebra projection removes duplicate tuples; ordinary SQL SELECT preserves duplicates unless DISTINCT is used.", "example": "Keep Shop.id for a join and later project only Sale.amount."}, {"term": "Join (⋈)", "definition": "An operation combining rows from two inputs that meet a matching condition.", "example": "Join Sale.shop_id to Shop.id."}, {"term": "Predicate", "definition": "A condition evaluated to decide which rows match or qualify.", "example": "region='East' is a predicate."}, {"term": "Early selection / predicate pushdown", "definition": "Applying a valid filter nearer its input so fewer rows flow through later operations.", "example": "Filter Shop by region before an inner join because the predicate uses only Shop."}, {"term": "Early projection", "definition": "Removing unnecessary columns before later operations while retaining all columns they still need.", "example": "Keep shop_id and amount from Sale, discarding an unused description before the join."}, {"term": "Heuristic optimization", "definition": "Improving a plan with practical transformation rules that are often helpful, without fully costing every alternative.", "example": "Apply selective filters early when doing so preserves the result."}, {"term": "Cost-based optimization", "definition": "Choosing among plans using estimated work derived from statistics and resource costs.", "example": "Compare estimated page reads for a scan and an index lookup."}, {"term": "Statistics", "definition": "Summaries of stored data used for estimates, such as row counts, distinct-value counts and value distributions.", "example": "If only 1% of shops are East, filtering East may substantially shrink the input."}, {"term": "Index", "definition": "An auxiliary access structure that helps locate rows by indexed values, with maintenance and lookup costs.", "example": "An index on region can help find a small set of East shops."}, {"term": "Scan", "definition": "Reading through a set of table or index entries to find qualifying rows.", "example": "A table scan visits the table's pages to evaluate the region filter."}, {"term": "Intermediate result", "definition": "Rows or columns produced between operators before the final answer.", "example": "East-filtered Shop rows are an intermediate input to the join."}, {"term": "EXPLAIN", "definition": "A command that displays the plan the database intends to use for a query. Plain EXPLAIN does not execute the query to produce its ordinary result rows.", "example": "EXPLAIN (COSTS OFF) displays nodes without cost numbers in PostgreSQL."}, {"term": "ANALYZE", "definition": "A PostgreSQL command that collects table statistics for planning. EXPLAIN ANALYZE is a different form that actually executes a statement and reports execution measurements.", "example": "ANALYZE shop updates statistics before examining the query plan."}, {"term": "Equivalent rewrite", "definition": "A transformation guaranteed to preserve the requested result under the query's semantics, including required duplicates and unmatched rows.", "example": "Pushing Shop.region='East' into Shop before an inner join is valid. Moving a right-side filter from ON to WHERE in a left join can change results."}, {"term": "Materialization", "definition": "Storing an intermediate result before a later operation consumes it.", "example": "A temporary intermediate set is fully produced and then read by the next step."}, {"term": "Pipelining", "definition": "Passing rows from one operator to the next as they become available, where the operations permit it.", "example": "A scan passes qualifying rows directly into a filter or consumer without first storing every row."}, {"term": "Cartesian product (×)", "definition": "Combines every row of one input with every row of another.", "example": "Three rows crossed with four rows produce twelve pairs before filtering."}, {"term": "Selection cascade", "definition": "Splitting a conjunction into consecutive row filters with equivalent predicates.", "example": "Filtering city='East' AND salary>50000 can be represented as two successive selections."}, {"term": "Join order", "definition": "The order in which multiple inputs are combined, affecting intermediate sizes and work.", "example": "Filtering a small subset of customers before joining their orders may produce less intermediate data."}, {"term": "Common subexpression", "definition": "An identical computation used more than once in a plan or related computation.", "example": "A small repeated group total might be computed once and reused when this is safe and cheaper."}, {"term": "Cardinality estimate", "definition": "An estimate of how many rows an operator will produce.", "example": "If 5% of 1000 rows are expected to match, the estimate is 50 rows."}, {"term": "Selectivity", "definition": "The estimated or actual fraction of input rows satisfying a condition.", "example": "A filter retaining 50 of 1000 rows has selectivity 0.05; a lower fraction is more restrictive."}, {"term": "Histogram / distinct-value statistics", "definition": "Summaries of value distributions and numbers of distinct values used in cost estimation.", "example": "If most customers are in one city, a histogram can avoid assuming every city occurs equally often."}, {"term": "Nested-loop / hash / merge join", "definition": "Alternative physical join algorithms: compare using loops, use a hash structure for suitable equality joins, or merge suitably ordered inputs.", "example": "A tiny outer input with an indexed lookup may favor nested loops; large equality joins may favor hashing. No method is always cheapest."}], "essays": [{"title": "Explain processing from SQL to rows", "prompt": "For a query returning sale amounts from East shops, explain decomposition, optimization, code generation and execution. State the difference between the SQL request and its physical plan.", "answer": "Decomposition parses the SQL, checks names and types, and creates an internal query representation. Optimization considers equivalent plans and estimates their costs, such as filtering Shop before joining. Code generation prepares executable scan, filter, join and output operations. Execution runs those operations to produce sale amounts. The SQL expresses the requested result. The physical plan specifies how the engine obtains it.", "criteria": ["Define all four phases in their correct order.", "Tie each phase to the East-shop query.", "Distinguish the declarative request from the executable method used to obtain the same result."]}, {"title": "Build and improve an algebra tree", "prompt": "Shop(id,region,address) contains (1,East,...),(2,West,...). Sale(shop_id,amount,note) contains (1,12,...),(1,15,...),(2,20,...). Return East-shop sale amounts. Describe an initial join-then-filter tree and an improved tree with early selection and projection. List the final rows.", "answer": "Initial tree, leaves upward: Shop and Sale → join on Shop.id=Sale.shop_id → select region=East → project amount. Improved Shop branch: select region=East, then keep id. Improved Sale branch: keep shop_id and amount. Join the two branches on their retained keys, then project amount. Final rows contain 12 and 15. Preserve SQL multiplicities unless DISTINCT is requested.", "criteria": ["Describe the initial tree and put the join, filter and projection in a valid order.", "Push the Shop-only filter and safe projections downward while retaining both join keys.", "Give 12 and 15 and explain why the rewrite preserves results and duplicates."]}, {"title": "Reason about costs and intermediate results", "prompt": "A table has one million rows and an index on region. In one dataset, East matches 0.1% of rows; in another, East matches 90%. Explain why the chosen access plan may differ, how statistics help, what plain EXPLAIN reports, and materialization versus pipelining.", "answer": "For 0.1% matches an index lookup may avoid most row reads. For 90% matches, scanning the table may be cheaper than many index-driven accesses. Actual choice depends on layout, caching, row widths and other costs. Statistics describe counts and distributions so the optimizer can estimate those costs. Plain EXPLAIN shows the proposed plan without running the ordinary result query. Materialization stores an intermediate set for later consumption; pipelining passes rows onward as produced when operations allow it.", "criteria": ["Explain selective versus broad matching without claiming an index always wins.", "Connect statistics to estimates and accurately describe plain EXPLAIN.", "Define materialization and pipelining and explain their intermediate-result behavior."]}], "choices": [["Which order describes the main query-processing stages in these notes?", ["Code generation, execution, decomposition, optimization", "Optimization, deletion, commit, rollback", "Decomposition, optimization, code generation, execution", "Execution, optimization, decomposition, code generation"], 2, "Decomposition analyzes and translates the query; optimization chooses a plan; code generation prepares executable operations; execution produces rows."], ["What does query decomposition include?", ["Committing every table before a SELECT", "Deleting unused indexes automatically", "Executing only the last clause", "Checking and translating SQL into an internal representation"], 3, "Parsing and semantic checking establish a valid query representation before plan choices are compared."], ["What does an optimizer choose among?", ["Equivalent execution plans with different estimated costs", "Different business meanings for the query", "Random row values to return", "A new schema for every statement"], 0, "Optimization preserves query meaning while choosing access paths, join orders and algorithms expected to be efficient."], ["In relational algebra, what does selection (σ) do?", ["Creates a primary key", "Keeps rows satisfying a predicate", "Chooses columns only", "Sorts rows alphabetically"], 1, "Selection filters rows. Projection (π) chooses attributes; the similar words have different roles."], ["In relational algebra, what does projection (π) do?", ["Commits changes", "Joins every possible row pair", "Keeps specified attributes", "Filters rows by a WHERE-like predicate"], 2, "Projection selects columns. Classical relational algebra removes duplicate tuples; SQL SELECT normally retains duplicates unless DISTINCT is requested."], ["Why can pushing a selective filter below an inner join improve a plan?", ["It guarantees that every index is used", "It always changes the query answer", "It forces all tables into memory", "Fewer rows enter the join, reducing intermediate work"], 3, "When the rewrite is valid, early filtering can shrink join input and output. The exact benefit depends on data and access costs."], ["What must an early projection retain?", ["Columns needed for later joins, filters and final output", "Only columns displayed in the final SELECT, always", "Every column in the entire database", "No join-key columns"], 0, "Dropping a join key too early makes the later join impossible or changes the plan's meaning."], ["Why does join order matter even when inner joins can be reordered equivalently?", ["It makes all output automatically sorted", "Intermediate result sizes and physical costs can differ greatly", "It changes primary-key definitions", "It determines whether SQL keywords are legal"], 1, "Joining restrictive inputs first can reduce work. The optimizer compares estimates rather than assuming all equivalent orders cost the same."], ["What does cost-based optimization depend on?", ["The order of column names in English", "A guarantee that an index scan is always cheapest", "Estimates informed by statistics, row counts and available access paths", "The shortest SQL text only"], 2, "Cost estimates consider factors such as cardinality and I/O. Stale or inaccurate statistics can cause poor choices."], ["Why is a sequential scan sometimes cheaper than an index scan?", ["Indexes cannot be used with SELECT", "Sequential scans always return fewer rows", "Every index scan must sort the full database first", "When much of a table is needed, sequential access can avoid many scattered fetches"], 3, "An index is most useful when it avoids enough work. Reading most pages through scattered lookups can cost more than scanning them."], ["Why must a filter move across an outer join be checked carefully?", ["It can change whether unmatched rows are preserved", "Outer joins ignore every filter", "All outer joins are identical to inner joins", "Moving filters always improves correctness"], 0, "A WHERE predicate rejecting NULL right-side values can remove unmatched left rows. Moving that predicate into ON may retain them, changing the answer."]]}];
const previousAssessments=[{"terms": [{"term": "Database", "definition": "An organized collection of related facts that can be stored, found and changed.", "example": "A library database contains readers, books and loans."}, {"term": "Relational database", "definition": "A database that represents data in relations, usually displayed as tables, and relates rows using matching key values.", "example": "Reader and Loan are linked by reader_id."}, {"term": "Database management system (DBMS)", "definition": "Software that creates, queries, updates and controls access to a database while enforcing declared constraints.", "example": "PostgreSQL manages the library tables and rejects a loan whose required reader does not exist."}, {"term": "Relation / table", "definition": "A named collection of rows described by the same set of attributes. In the relational model, a relation is a set of tuples.", "example": "Every Reader row has reader_id and name columns. SQL tables can contain duplicate rows unless constraints prevent them."}, {"term": "Tuple / row", "definition": "One collection of attribute values describing one occurrence in a relation.", "example": "The row (7, 'Ada') describes one reader."}, {"term": "Attribute / column", "definition": "A named property whose values describe the rows in a relation.", "example": "name stores the reader name for each Reader row."}, {"term": "Domain", "definition": "The permitted set of values for an attribute, determined by its type and applicable rules.", "example": "A quantity domain can be whole numbers from 0 upward."}, {"term": "Schema", "definition": "The definition of a database structure, including tables, columns, types and constraints.", "example": "Reader(reader_id integer PRIMARY KEY, name text NOT NULL) describes structure. (7, 'Ada') is data in that structure."}, {"term": "Entity", "definition": "A distinguishable thing about which facts are recorded. An entity type groups similar things, and an entity occurrence is one individual thing.", "example": "Reader is an entity type. Ada with reader_id 7 is an occurrence."}, {"term": "Relationship", "definition": "An association between entity occurrences, governed by business rules.", "example": "A reader borrows a book through a recorded loan."}, {"term": "Primary key (PK)", "definition": "The chosen minimal set of columns that uniquely identifies every row. Every component must be non-NULL.", "example": "Reader.reader_id identifies one reader even when two readers share a name."}, {"term": "Candidate key", "definition": "A minimal set of attributes capable of uniquely identifying a row. One candidate key is chosen as the primary key.", "example": "A unique, required student_number and a unique, required institutional_email may each be candidate keys."}, {"term": "Composite primary key", "definition": "A primary key formed from two or more columns whose combination identifies a row.", "example": "(student_id, club_id) identifies a membership when each student can join a club once."}, {"term": "Foreign key (FK)", "definition": "A column or group of columns constrained to reference an eligible key in the same table or another table. Non-NULL references must match an existing referenced row.", "example": "Many Loan rows may carry reader_id 7 and all refer to Reader 7."}, {"term": "NULL", "definition": "A marker indicating that a value is missing, unknown or inapplicable.", "example": "A left-join result can have NULL for pass_id when a member has no pass."}, {"term": "Constraint", "definition": "A rule the DBMS enforces on permitted data or changes.", "example": "A foreign key rejects an unknown reader ID and CHECK(price >= 0) rejects a negative price."}, {"term": "NOT NULL", "definition": "A constraint requiring a column to contain a value in every row.", "example": "Loan.reader_id NOT NULL requires each loan to specify a reader."}, {"term": "UNIQUE", "definition": "A constraint preventing duplicate key values under the DBMS's NULL rules.", "example": "UNIQUE on Pass.member_id limits a member to one pass. Adding NOT NULL makes every pass identify its member."}, {"term": "Referential integrity", "definition": "The rule that a foreign key reference must point to an existing eligible referenced key, or use an allowed NULL.", "example": "A loan referencing nonexistent reader 99 is rejected."}, {"term": "ER diagram", "definition": "An entity–relationship diagram that depicts entities, their attributes and relationships with participation or cardinality rules.", "example": "Reader 1 linked to Loan 0..* means each loan has one reader and each reader can have zero or many loans."}, {"term": "Cardinality", "definition": "The allowed number of matching occurrences in a relationship, commonly expressed by maximum values such as one or many.", "example": "One department can have many employees."}, {"term": "Participation / minimum cardinality", "definition": "The minimum number of relationship matches required for an occurrence. Zero means optional participation and one means at least one is required.", "example": "A member may have zero passes, but each pass must have one member."}, {"term": "One-to-one relationship", "definition": "A relationship in which each occurrence on either side matches at most one on the other side. Minimum participation can differ at each end.", "example": "One member may have zero or one pass, and a pass belongs to exactly one member."}, {"term": "One-to-many relationship", "definition": "A relationship in which one occurrence on the first side may match many on the second, while each second-side occurrence matches at most one on the first.", "example": "A reader may have many loans, each belonging to one reader."}, {"term": "Many-to-many relationship", "definition": "A relationship in which occurrences on both sides may match multiple occurrences on the other side.", "example": "Students can join several clubs and clubs can have several students."}, {"term": "Linking / associative table", "definition": "A table that represents a relationship by storing foreign keys to the participating entities and any facts about their association.", "example": "Membership contains student_id, club_id and joined_on."}, {"term": "Relationship attribute", "definition": "A fact whose value belongs to a specific association between entities.", "example": "A tutor's rate for a subject belongs to Teaching(tutor_id, subject_id), because it can vary for each pair."}], "essays": [{"title": "Model a delivery service", "prompt": "Customers may place many deliveries, including none. Each delivery belongs to exactly one customer. A driver can carry many deliveries, but a new delivery may have no driver yet. Store names, delivery ID and delivery date. Give tables, PKs, FKs, NULL rules and both directions of each relationship.", "answer": "Customer(customer_id PK, name)\nDriver(driver_id PK, name)\nDelivery(delivery_id PK, delivery_date, customer_id NOT NULL FK → Customer.customer_id, driver_id nullable FK → Driver.driver_id)\n\nOne customer has 0..many deliveries; each delivery has exactly one customer. One driver has 0..many deliveries; each delivery has 0..1 driver. Foreign keys belong in Delivery because it is the many side. A driver_id of NULL represents an unassigned delivery.", "criteria": ["Create all three tables and give each an identifying primary key.", "Require an existing customer and allow an absent driver using the correct foreign keys.", "State both endpoints of both relationships and explain why Delivery stores the links."]}, {"title": "Store different rates for the same subject", "prompt": "A tutor teaches several subjects and each subject has several tutors. A tutor sets one hourly rate per subject. Design the tables and explain where hourly_rate belongs. Give sample rows where two tutors charge different rates for the same subject.", "answer": "Tutor(tutor_id PK, name)\nSubject(subject_id PK, title)\nTeaching(tutor_id FK → Tutor, subject_id FK → Subject, hourly_rate, PK(tutor_id, subject_id))\n\nTeaching rows can be (7, 3, 25) and (8, 3, 30). Tutor 7 charges 25 for subject 3 and tutor 8 charges 30. Rate describes the tutor–subject pair. The composite key permits a tutor to teach several subjects while preventing duplicate rows for the same pair.", "criteria": ["Resolve the many-to-many relationship with a linking table and both foreign keys.", "Use the pair as its primary key and place hourly_rate on the linking table.", "Supply valid differing sample rates and explain why rate cannot depend on tutor or subject alone."]}, {"title": "Enforce an optional one-to-one link", "prompt": "An employee can have zero or one parking permit. Every permit must belong to exactly one existing employee. Write SQL table definitions and explain what happens if a second permit references the same employee or a permit references an unknown employee.", "answer": "CREATE TABLE Employee (employee_id integer PRIMARY KEY, name text NOT NULL);\nCREATE TABLE Permit (\n  permit_id integer PRIMARY KEY,\n  employee_id integer NOT NULL UNIQUE REFERENCES Employee(employee_id)\n);\n\nUNIQUE rejects a second permit for the same employee. The foreign key rejects an unknown employee. NOT NULL stops an unassigned permit. An employee can exist with no Permit row, so optional participation is allowed on the employee side.", "criteria": ["Define a PK for each table and a foreign key in Permit.", "Combine UNIQUE and NOT NULL on Permit.employee_id.", "Explain each rejected case and how an employee can have zero permits."]}, {"title": "Identify repeated relationship events", "prompt": "A clinic records visits between doctors and patients. A patient may see the same doctor twice in one day. Each visit has a time, fee and diagnosis. Design the tables and explain why (doctor_id, patient_id) is insufficient as the Visit primary key.", "answer": "Doctor(doctor_id PK, name)\nPatient(patient_id PK, name)\nVisit(visit_id PK, doctor_id NOT NULL FK → Doctor, patient_id NOT NULL FK → Patient, visit_time, fee, diagnosis)\n\nA visit_id identifies each encounter. The same doctor–patient pair can occur repeatedly, so making just that pair the primary key would reject the second encounter. Each visit has exactly one doctor and patient; each doctor and patient can have 0..many visits.", "criteria": ["Identify the three tables and place the encounter facts in Visit.", "Use an event identifier and both mandatory foreign keys.", "Explain why the pair alone fails and state the relationship cardinalities."]}], "choices": [["Each ticket requires one event. An event may have no tickets. Which constraint belongs on Ticket.event_id?", ["UNIQUE alone", "A nullable foreign key", "A NOT NULL foreign key"], 2, "Many tickets may repeat an event ID. Every ticket must reference an existing event."], ["A player wears a different number on each team. Where does the number belong?", ["Player", "Team", "TeamMembership"], 2, "The number describes one player on one team."], ["A table permits two readers named Ada. Which identifier can still distinguish them?", ["A unique, non-NULL reader_id", "The shared name Ada", "The row’s screen position"], 0, "A primary key provides a stable unique identity. Screen order is not an identifier."], ["Which combination represents a required one-to-one reference from Pass to Member?", ["FOREIGN KEY only", "FOREIGN KEY plus NOT NULL and UNIQUE", "NOT NULL only"], 1, "The FK checks existence, NOT NULL requires a member, and UNIQUE prevents two passes for one member."]]}, {"terms": [{"term": "Transaction", "definition": "A group of database operations treated as one unit of work with a defined start and completion or cancellation.", "example": "A transfer contains both a debit and a credit."}, {"term": "BEGIN", "definition": "A command that starts an explicit transaction.", "example": "BEGIN before two account updates groups them into one transaction."}, {"term": "COMMIT", "definition": "A command that successfully ends a transaction and makes its changes permanent under the configured durability guarantees.", "example": "Committing a transfer saves both new balances."}, {"term": "ROLLBACK", "definition": "A command that cancels the current transaction and undoes its changes.", "example": "A failed transfer restores both original balances."}, {"term": "Auto-commit", "definition": "A mode in which each standalone statement executes in its own transaction unless an explicit transaction has been started.", "example": "Two updates run without BEGIN may commit separately, leaving only the debit if the credit fails."}, {"term": "Atomicity", "definition": "The property that a transaction's changes take effect together or are undone together.", "example": "An order insert is undone when a required stock update in the same transaction fails."}, {"term": "Consistency", "definition": "The property that correct transactions preserve database constraints and applicable business invariants.", "example": "A correct transfer preserves total money and satisfies CHECK(balance >= 0)."}, {"term": "Isolation", "definition": "The property governing how overlapping transactions interact and which intermediate or concurrent effects they can observe.", "example": "Under Read Committed, another session cannot read an uncommitted debit."}, {"term": "Isolation level", "definition": "A configured set of guarantees that determines the concurrency effects transactions may observe.", "example": "Read Committed and Serializable provide different guarantees for repeated reads and concurrent updates."}, {"term": "Durability", "definition": "The property that a successfully committed transaction survives a subsequent crash under durable settings.", "example": "A saved sale can be recovered from durable records after power loss."}, {"term": "ACID", "definition": "The acronym for Atomicity, Consistency, Isolation and Durability, which describe reliable transaction behavior.", "example": "A transfer must complete as one unit, preserve rules, handle concurrent work appropriately and survive a crash after commit."}, {"term": "Business invariant", "definition": "A condition that correct application operations must preserve, including rules that may need multiple statements to enforce.", "example": "A transfer between two accounts preserves their combined balance."}, {"term": "Affected-row count", "definition": "The number of rows a statement actually changed, which can indicate whether its business goal succeeded.", "example": "An UPDATE reserving a seat changes zero rows when the seat is unavailable."}, {"term": "Guarded / conditional update", "definition": "An UPDATE whose WHERE condition tests a requirement as part of changing the row.", "example": "UPDATE Show SET seats=seats-1 WHERE id=3 AND seats>0 reserves only an available seat."}, {"term": "SAVEPOINT", "definition": "A named marker inside an open transaction to which later work can be partially rolled back.", "example": "Create a savepoint after adding a book and before adding optional gift wrap."}, {"term": "ROLLBACK TO SAVEPOINT", "definition": "An operation that undoes changes after a named savepoint while leaving the transaction open.", "example": "Undoing the wrap leaves the book pending until the caller commits."}], "essays": [{"title": "Explain all four ACID properties", "prompt": "A transfer moves 30 from account A with 100 to account B with 40. Explain each ACID property using this operation. Distinguish the failure that atomicity handles from the failure durability handles.", "answer": "The successful balances are A=70 and B=70, preserving the total 140. Atomicity means a failure before completion undoes both changes, leaving 100 and 40. Consistency means the correct operation preserves the total and respects constraints such as nonnegative balances. Isolation controls interaction with concurrent transfers and readers. Durability means the committed 70 and 70 can survive a later crash. Atomicity handles incomplete work; durability preserves completed, committed work.", "criteria": ["Give all four ACID names with correct meanings.", "Connect each property to this transfer and calculate the correct balances and total.", "Distinguish cancellation before commit from recovery of committed changes after a crash."]}, {"title": "Trace two commits and a partial rollback", "prompt": "A value starts at 20. Transaction A adds 5 and commits. Transaction B adds 4, creates SAVEPOINT s, doubles the value, rolls back to s, adds 1 and commits. Show every intermediate value and the final value.", "answer": "A begins at 20, adds 5 to reach 25 and commits. B begins at 25, adds 4 to reach 29 and marks s. Doubling makes 58 inside B. ROLLBACK TO s restores 29 while B stays open. Adding 1 makes 30. COMMIT saves 30. If B instead ended with full ROLLBACK, the saved value would be 25.", "criteria": ["Trace 20 → 25 → 29 → 58 accurately.", "Explain that rollback to the savepoint returns to 29 and keeps B open.", "Finish at committed 30 and explain the contrast with a full rollback to 25."]}, {"title": "Reserve a last seat safely", "prompt": "A show has one remaining seat. A purchase needs to decrement seats and insert a booking. Write the transaction algorithm, including the case when the decrement changes zero rows and when the insert fails.", "answer": "BEGIN. Run UPDATE Show SET seats=seats-1 WHERE show_id=:id AND seats>0. Require exactly one affected row. If zero rows change, ROLLBACK and report unavailable. Otherwise insert the Booking row in the same transaction. COMMIT only if the insert succeeds. On any error before commit, ROLLBACK. The guarded update prevents a negative seat count, and the row-count check prevents booking when nothing was reserved.", "criteria": ["Use one transaction containing both updates to the business state.", "Guard seats>0 and check exactly one row changed before inserting.", "Specify success, sold-out and insert-failure outcomes, with the correct commit or rollback."]}, {"title": "Explain an auto-commit failure", "prompt": "A program deducts 15 from A and then credits B using two separate statements with auto-commit enabled. The debit succeeds and the credit fails. Explain the saved state, why issuing ROLLBACK afterward cannot repair it, and how to rewrite the operation.", "answer": "The debit has already committed as its own transaction. B did not receive the credit, so the system is short by 15 relative to its original total. A later rollback cannot undo that earlier committed debit. Wrap both statements inside one explicit transaction, verify both target rows and required business conditions, and commit only after both succeed. Roll back any failed attempt before commit. Repairing an already committed incorrect state requires a new corrective transaction.", "criteria": ["Recognize that the two statements have separate transaction boundaries under auto-commit.", "Explain the missing credit and why a later rollback does not reach the committed debit.", "Give the single-transaction rewrite and distinguish it from a new correction of the existing state."]}], "choices": [["The database confirms a sale and then loses power. Which property preserves the sale?", ["Atomicity", "Durability", "Isolation"], 1, "Durability protects committed work through a crash."], ["Which command keeps earlier work in the same transaction pending while undoing later work?", ["ROLLBACK TO SAVEPOINT", "COMMIT", "ROLLBACK without a savepoint"], 0, "A savepoint is a marker inside a still-open transaction."], ["An UPDATE changes zero rows. Which conclusion follows?", ["The database must have crashed.", "The statement may be valid even though the intended reservation failed.", "COMMIT always creates the missing row."], 1, "SQL can succeed with no matches. Business logic must inspect the affected-row count."], ["After ROLLBACK TO s, what remains possible in the current transaction?", ["Continue work and then commit.", "Nothing, the transaction is always closed.", "Undo every earlier commit."], 0, "Rollback to a savepoint preserves the open transaction and the earlier pending work."]]}, {"terms": [{"term": "SQL", "definition": "Structured Query Language, used to define database objects, retrieve rows and change data.", "example": "SELECT name FROM Reader returns reader names."}, {"term": "DDL", "definition": "Data definition language, the SQL operations that create or change database structures.", "example": "CREATE TABLE and ALTER TABLE define or modify a table."}, {"term": "DML", "definition": "Data manipulation language, the SQL operations that work with data rows. SELECT is commonly included for querying, alongside INSERT, UPDATE and DELETE.", "example": "UPDATE Item SET price=4 WHERE id=1 changes a stored price."}, {"term": "CREATE TABLE", "definition": "A statement that defines a new table's columns, types and constraints.", "example": "CREATE TABLE Item(id int PRIMARY KEY, price int) defines an item structure."}, {"term": "ALTER TABLE", "definition": "A statement that changes the definition of an existing table.", "example": "ALTER TABLE Item ADD COLUMN name text adds a column."}, {"term": "DROP TABLE", "definition": "A statement that removes a table object and its rows, subject to dependency rules.", "example": "DROP TABLE Item removes the Item table."}, {"term": "CRUD", "definition": "The four basic operations Create, Read, Update and Delete for data records.", "example": "INSERT, SELECT, UPDATE and DELETE implement CRUD on table rows."}, {"term": "INSERT", "definition": "A statement that adds rows to a table.", "example": "INSERT INTO Item VALUES (1,4) adds one item."}, {"term": "SELECT", "definition": "A statement that retrieves specified expressions or columns from a row source.", "example": "SELECT name,price FROM Item returns two columns."}, {"term": "UPDATE", "definition": "A statement that changes matching rows. Without a restricting WHERE, every row is eligible.", "example": "UPDATE Item SET price=5 WHERE id=1 changes only item 1."}, {"term": "DELETE", "definition": "A statement that removes matching rows while retaining the table structure.", "example": "DELETE FROM Item WHERE id=1 removes item 1."}, {"term": "FROM", "definition": "The clause that specifies the table or other row source to query.", "example": "FROM Work starts with time-entry rows."}, {"term": "JOIN / inner join", "definition": "An operation that combines pairs of rows satisfying a join condition. An inner join retains matching pairs only.", "example": "Match Work.project_id to Project.id to attach each work entry to a project."}, {"term": "ON / join condition", "definition": "The condition specifying which rows match when inputs are joined.", "example": "ON Work.project_id=Project.id connects matching project IDs."}, {"term": "LEFT JOIN", "definition": "A join that retains every row of the left input and adds matching right rows, using NULLs when no right row matches.", "example": "Clubs with no members still appear in Club LEFT JOIN Member."}, {"term": "WHERE", "definition": "A clause that filters individual rows before grouping.", "example": "WHERE hours>=2 excludes one-hour work entries."}, {"term": "GROUP BY", "definition": "A clause that partitions rows into groups sharing the specified values so aggregates can be calculated per group.", "example": "GROUP BY project_id creates one group per project."}, {"term": "HAVING", "definition": "A clause that filters groups, often using aggregate results.", "example": "HAVING SUM(hours)>=6 keeps project groups with at least six total hours."}, {"term": "ORDER BY", "definition": "A clause that specifies result ordering. ASC sorts ascending and DESC descending.", "example": "ORDER BY total DESC,name ASC sorts largest totals first and breaks ties by name."}, {"term": "Aggregate function", "definition": "A function that computes one result from a set of input rows or values.", "example": "SUM(hours) adds hours in one project group."}, {"term": "COUNT(*)", "definition": "An aggregate that counts rows, including rows containing NULL values.", "example": "A left join produces one placeholder row for an empty club, which COUNT(*) counts as one."}, {"term": "COUNT(column)", "definition": "An aggregate that counts only non-NULL values of the given expression.", "example": "COUNT(Member.id) reports zero for a club with no matching member."}, {"term": "SUM", "definition": "An aggregate that adds non-NULL input values.", "example": "SUM(hours) over 2,6,NULL is 8."}, {"term": "AVG", "definition": "An aggregate that averages non-NULL input values.", "example": "AVG(hours) over 2,6,NULL is 4."}, {"term": "MIN / MAX", "definition": "Aggregates that find the smallest or largest non-NULL input value.", "example": "MIN(price) gives the lowest recorded price and MAX(price) the highest."}, {"term": "IS NULL", "definition": "A predicate that tests whether an expression has a missing value.", "example": "WHERE driver_id IS NULL finds unassigned deliveries."}, {"term": "BETWEEN", "definition": "An inclusive range predicate accepting both endpoints.", "example": "price BETWEEN 10 AND 20 accepts 10, 15 and 20."}, {"term": "LIKE", "definition": "A predicate matching a text pattern, where % matches any sequence and _ matches one character.", "example": "name LIKE 'A%' matches Ada and Alan."}, {"term": "IN", "definition": "A predicate testing membership in a list or subquery result, with SQL NULL rules applying.", "example": "region IN ('East','West') accepts either named region."}, {"term": "DISTINCT", "definition": "A SELECT modifier that removes duplicate result rows.", "example": "SELECT DISTINCT region FROM Shop returns each region once."}, {"term": "Alias", "definition": "A temporary name given to a table reference or result expression within a query.", "example": "SUM(hours) AS total names the calculated output column total."}, {"term": "WITH / common table expression (CTE)", "definition": "A named query result available to the statement that follows WITH.", "example": "WITH work(hours) AS (VALUES (2),(6)) provides two sample rows for a SELECT."}], "essays": [{"title": "Define a table and perform CRUD", "prompt": "Create Product with a required ID primary key, required name and nonnegative integer price. Insert pen 1 at price 3 and notebook 2 at price 8. Change pen price to 4, delete notebook and show the remaining rows ordered by ID. Explain DELETE versus DROP.", "answer": "CREATE TABLE Product (id integer PRIMARY KEY, name text NOT NULL, price integer NOT NULL CHECK(price>=0));\nINSERT INTO Product VALUES (1,'Pen',3),(2,'Notebook',8);\nUPDATE Product SET price=4 WHERE id=1;\nDELETE FROM Product WHERE id=2;\nSELECT * FROM Product ORDER BY id;\n\nThe remaining row is (1, Pen, 4). DELETE removed notebook while leaving Product available. DROP TABLE Product would remove the table itself and its rows.", "criteria": ["Define the key, required values and nonnegative price constraint.", "Use correct INSERT, targeted UPDATE, targeted DELETE and ordered SELECT statements.", "State the final row and accurately distinguish DELETE from DROP."]}, {"title": "Keep empty departments in a report", "prompt": "Department(id,name) contains (1, Sales), (2, Support), (3, Design). Employee(id,dept_id) contains (10,1),(11,1),(12,3). Write a query showing every department name and its employee count, alphabetically. Explain the expected rows and why COUNT(*) is wrong for the empty department.", "answer": "SELECT d.name, COUNT(e.id) AS employee_count\nFROM Department d LEFT JOIN Employee e ON e.dept_id=d.id\nGROUP BY d.id,d.name\nORDER BY d.name;\n\nRows are Design | 1, Sales | 2, Support | 0. LEFT JOIN preserves Support using a row with NULL employee columns. COUNT(e.id) ignores that missing match, whereas COUNT(*) counts the placeholder row as one.", "criteria": ["Use Department on the left of a LEFT JOIN with the correct matching condition.", "Count non-NULL employee IDs and group by department before ordering.", "Give all three results and explain the placeholder-row counting error."]}, {"title": "Filter entries and then filter groups", "prompt": "Project(id,name) contains (1,Atlas),(2,Beacon),(3,Comet). Work(project_id,hours) contains (1,2),(1,6),(2,4),(2,1),(3,9). Write a report that totals entries of at least 2 hours, keeps totals of at least 6, and sorts total descending. Explain each stage and the result.", "answer": "SELECT p.name, SUM(w.hours) AS total\nFROM Project p JOIN Work w ON w.project_id=p.id\nWHERE w.hours>=2\nGROUP BY p.id,p.name\nHAVING SUM(w.hours)>=6\nORDER BY total DESC,p.name;\n\nThe join supplies project names. WHERE removes Beacon’s 1-hour entry. GROUP BY creates project groups; their sums are Atlas 8, Beacon 4, Comet 9. HAVING removes Beacon. ORDER BY yields Comet | 9 then Atlas | 8.", "criteria": ["Join correctly and filter individual entries with WHERE.", "Group and aggregate correctly, then filter aggregate totals with HAVING.", "Explain the logical stages and give the correctly ordered final rows."]}, {"title": "Explain NULLs, patterns and aggregates", "prompt": "Item(id,name,price) contains (1,Apple,10),(2,Apricot,NULL),(3,Banana,20). Write one query counting all rows, counting known prices and calculating their average. Then write a query for names beginning with A. Give both results and a predicate for finding unknown prices.", "answer": "SELECT COUNT(*) AS rows_total,COUNT(price) AS known_prices,AVG(price) AS average_price FROM Item;\nResult: 3 rows, 2 known prices, average 15 (format may vary).\n\nSELECT name FROM Item WHERE name LIKE 'A%' ORDER BY name;\nResult: Apple and Apricot.\n\nWHERE price IS NULL finds Apricot. COUNT(price) and AVG(price) skip the NULL input. COUNT(*) still includes the row. A NULL price does not make the whole Apricot row disappear from unrelated name filtering.", "criteria": ["Use the three correct aggregates and calculate 3, 2 and 15.", "Use LIKE with a trailing % and give Apple and Apricot.", "Use IS NULL and explain how missing price values affect the aggregates."]}], "choices": [["Which clause removes employees before a department average is calculated?", ["HAVING", "WHERE", "ORDER BY"], 1, "WHERE filters individual input rows."], ["Which statement adds a column to an existing table?", ["UPDATE", "INSERT INTO", "ALTER TABLE"], 2, "Changing columns changes the table definition."], ["A LEFT JOIN keeps an empty department. What does COUNT(Employee.id) return for it?", ["1", "0", "NULL"], 1, "COUNT ignores NULL inputs and returns zero when there are no non-NULL employee IDs."], ["Which predicate includes both 10 and 20?", ["price>10 AND price<20", "price BETWEEN 10 AND 20", "price=10 AND price=20"], 1, "BETWEEN includes both endpoints."]]}, {"terms": [{"term": "Stored procedure", "definition": "A named collection of instructions stored in the database and executed by calling it.", "example": "GetStudentsByDepartment applies the same lookup logic for different department IDs."}, {"term": "Input parameter", "definition": "A named, typed slot in a procedure definition that receives a value from its caller.", "example": "p_dept integer is the parameter in a department lookup."}, {"term": "Argument", "definition": "The actual value supplied for a parameter in a particular call.", "example": "In a call for department 10, the argument is 10."}, {"term": "Local variable", "definition": "A named value that exists within a procedure or block and can change during that execution.", "example": "result starts at 1 and holds the growing factorial product."}, {"term": "DECLARE / initialization", "definition": "Declaration introduces a local variable and its type; initialization supplies its starting value.", "example": "DECLARE result int := 1 in PL/pgSQL initializes the product to 1."}, {"term": "IF / ELSE", "definition": "Conditional control flow that chooses a branch based on whether a condition is true.", "example": "Reject a nonpositive quantity in the IF branch and continue valid work otherwise."}, {"term": "WHILE loop", "definition": "A control structure that repeats its body while a condition is true.", "example": "WHILE i<=n repeats a factorial multiplication until i exceeds n."}, {"term": "Loop termination", "definition": "The condition and progress that eventually stop a loop.", "example": "Increasing i by 1 on every pass makes i<=n become false."}, {"term": "Input validation", "definition": "Checking arguments against required business and type-related limits before using them.", "example": "Reject a NULL, negative or too-large factorial input."}, {"term": "Exception / error handling", "definition": "Detecting and reporting a failed operation and ensuring the surrounding work ends consistently.", "example": "A procedure raises an exception for insufficient stock and the caller rolls back its transaction."}, {"term": "T-SQL", "definition": "Transact-SQL, SQL Server's SQL dialect with procedural extensions.", "example": "T-SQL uses @dept parameters and EXEC for a procedure call."}, {"term": "PL/pgSQL", "definition": "PostgreSQL's procedural language for routines and blocks containing SQL and control flow.", "example": "A LANGUAGE plpgsql procedure uses IF, LOOP and RAISE EXCEPTION."}, {"term": "EXEC / CALL", "definition": "Commands that invoke stored procedures in their respective dialects.", "example": "SQL Server uses EXEC GetStudents @dept=10; PostgreSQL uses CALL get_students(10,...)."}, {"term": "Cursor / refcursor", "definition": "A cursor is a handle for reading query result rows. PostgreSQL refcursor is a type used to pass a cursor's name.", "example": "A procedure opens the cursor named matches for department 10."}, {"term": "OPEN / FETCH", "definition": "OPEN associates a cursor with a query; FETCH retrieves rows through that cursor.", "example": "FETCH ALL FROM matches reads all rows from the opened student cursor."}, {"term": "THROW / RAISE EXCEPTION", "definition": "Statements that signal an error in SQL Server and PostgreSQL respectively.", "example": "RAISE EXCEPTION 'Insufficient stock' stops an invalid reservation."}, {"term": "TRY / CATCH", "definition": "SQL Server control flow that runs protected work in TRY and transfers to CATCH when a catchable error occurs.", "example": "CATCH can roll back an active transfer transaction and rethrow the error."}, {"term": "FOUND", "definition": "A PL/pgSQL Boolean status variable set by certain statements to indicate whether rows were found or affected.", "example": "After a guarded UPDATE changes zero rows, IF NOT FOUND detects the failed reservation."}, {"term": "Factorial", "definition": "The product of whole numbers from 1 through n, with 0! defined as 1.", "example": "4! equals 1×2×3×4 = 24."}, {"term": "Integer overflow", "definition": "A result exceeding the range of the integer data type used to store it.", "example": "A signed 32-bit integer holds 12! but cannot hold 13!, so the example rejects inputs above 12."}, {"term": "Transaction ownership", "definition": "Responsibility for starting and completing a transaction around a procedure call.", "example": "A caller can run BEGIN, CALL, then COMMIT on success or ROLLBACK after failure."}, {"term": "GO batch separator", "definition": "A separator recognized by SQL Server client tools to send statements as distinct batches.", "example": "GO separates CREATE PROCEDURE from a subsequent EXEC in a SQL Server script."}], "essays": [{"title": "Write a parameterized lookup", "prompt": "Students(student_id, student_name, department_id) stores students. Write a SQL Server procedure named GetStudentsByDepartment that takes a department ID, rejects NULL, returns matching rows ordered by student ID, and show the call for department 10. Explain column-versus-parameter comparison.", "answer": "CREATE PROCEDURE GetStudentsByDepartment @dept INT\nAS\nBEGIN\n  IF @dept IS NULL THROW 50001, 'Department is required', 1;\n  SELECT s.student_id,s.student_name,s.department_id\n  FROM Students s WHERE s.department_id=@de
