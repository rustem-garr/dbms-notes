O C, potentially following records from before the checkpoint.</td></tr><tr><td>D</td><td>Starts after checkpoint and is uncommitted at the crash.</td><td>UNDO D.</td></tr></tbody></table></div><div class=\"out\"><strong>Worked answer</strong><p>A checkpoint is not permission to forget all older log records. C may have changed data before the checkpoint and still need UNDO. B’s commit status makes its outcome different from C’s, even though both were active at the checkpoint.</p></div><p>A useful update log record identifies the transaction, record type, affected item and recovery information such as before/after values in the textbook model. START, UPDATE, COMMIT, ABORT and CHECKPOINT records have different meanings; the last update record alone does not prove a transaction committed.</p></section>", "examples": ["<article class=\"case\"><h2>Repair one missing change and one unfinished change</h2><p>The log says T1 committed X: 4 → 7. T2 changed Y: 2 → 5 but never committed. Under immediate update, the disk at the crash contains X=4 and Y=5.</p><div class=\"tbl-scroll\"><table><thead><tr><th scope=\"col\">Item</th><th scope=\"col\">On disk</th><th scope=\"col\">Decision</th><th scope=\"col\">Recovered value</th></tr></thead><tbody><tr><td>X</td><td>4</td><td>REDO committed T1 using the after-image.</td><td>7</td></tr><tr><td>Y</td><td>5</td><td>UNDO unfinished T2 using the before-image.</td><td>2</td></tr></tbody></table></div><div class=\"out\"><strong>Result</strong><p>X = 7 and Y = 2.</p></div><h3>Why it works</h3><ol class=\"reason\"><li>The commit record establishes that X=7 must survive, even though its data page had not been written.</li><li>Y=5 reached disk before its transaction finished. Restoring Y=2 removes its effect.</li></ol></article>", "<article class=\"case\"><h2>Undo two writes in the right order</h2><p>One uncommitted transaction changes a price from 10 to 12, then from 12 to 15. Both changes reached the data page before failure.</p><figure class=\"trace\"><figcaption>Walk backward through the log</figcaption><div class=\"tbl-scroll\"><table><thead><tr><th scope=\"col\">Recovery step</th><th scope=\"col\">Undo this record</th><th scope=\"col\">Price afterward</th></tr></thead><tbody><tr><td>1 · newest</td><td>12 → 15</td><td>12</td></tr><tr><td>2 · oldest</td><td>10 → 12</td><td>10</td></tr></tbody></table></div></figure><div class=\"out\"><strong>Result</strong><p>The recovered price is 10.</p></div><h3>Why it works</h3><ol class=\"reason\"><li>The before-image of the latest write is 12. Undoing that write first exposes the prior state.</li><li>Then undo the earlier write to 10. Forward-order undo would incorrectly leave the intermediate value 12.</li></ol></article>", "<article class=\"case\"><h2>Recover after the disk is lost</h2><p>A separate backup at 09:00 contains 40 tickets. Surviving archived logs have a committed sale of 3 at 09:10 and a committed return of 1 at 09:15. The data disk fails at 09:20.</p><div class=\"tbl-scroll\"><table><thead><tr><th scope=\"col\">Action</th><th scope=\"col\">Tickets available</th></tr></thead><tbody><tr><td>Restore the 09:00 backup</td><td>40</td></tr><tr><td>Replay the committed sale</td><td>37</td></tr><tr><td>Replay the committed return</td><td>38</td></tr></tbody></table></div><div class=\"out\"><strong>Result</strong><p>38 tickets are available after restoration and replay.</p></div><h3>Why it works</h3><ol class=\"reason\"><li>The backup provides a complete starting copy. The archived log fills in committed changes after that copy.</li><li>A checkpoint on the destroyed disk cannot rebuild the missing database by itself.</li></ol></article>"], "links": ["Logs and checkpoints", "Undo and redo", "Recovery strategies"]}, {"deck": "A query says which rows you want. A query plan describes how to get them. Optimization chooses among plans that preserve the answer while reducing work such as reading pages or carrying large intermediate results.", "body": "<section class=\"reading\"><h2>One request can have several plans</h2><p>A shop manager wants the amounts of East-region sales. One plan joins every shop to its sales and then filters for East. Another filters the Shop table first, then joins only East shops to sales. Because the filter uses only Shop.region and the join is an inner join, both plans return exactly the same matching sales.</p><figure class=\"plantree\"><figcaption>Read from the two inputs up to the result</figcaption><div class=\"root-node\">Return amount (π amount)</div><div class=\"join-node\">⋈ &nbsp; Sale.shop_id = Shop.id</div><div class=\"fork\"><div>Sale → keep shop_id, amount</div><div>Shop → keep East rows (σ region = East) → keep id</div></div></figure><p>The two branches meet at an inner join on Sale.shop_id = Shop.id. The root keeps amount. In a <b>relational algebra tree</b>, a leaf is an input table. Each parent applies an operation to the result below it.</p></section><section class=\"reading\"><h2>Four stages of query processing</h2><div class=\"tbl-scroll\"><table><thead><tr><th scope=\"col\">Stage</th><th scope=\"col\">What happens</th><th scope=\"col\">Example</th></tr></thead><tbody><tr><td>Decomposition</td><td>Parse the SQL, check names and types, and translate the request.</td><td>Resolve s.amount to a column in Sale.</td></tr><tr><td>Optimization</td><td>Compare equivalent logical and physical plans using rules and estimates.</td><td>Estimate whether filtering East shops early reduces work.</td></tr><tr><td>Code generation</td><td>Turn the chosen plan into executable database operations.</td><td>Prepare scan, filter and join operators.</td></tr><tr><td>Execution</td><td>Run the operations and produce result rows.</td><td>Read the inputs and return 12 and 15.</td></tr></tbody></table></div></section><section class=\"reading\"><h2>Three symbols behind a query tree</h2><dl class=\"concepts\"><div><dt>Selection · σ</dt><dd>Keeps rows passing a condition. Filtering 100 shops down to 4 East shops makes the input shorter.</dd></div><div><dt>Projection · π</dt><dd>Keeps needed columns. Keeping id and dropping an unused address makes rows narrower. Classical relational algebra uses sets. Ordinary SQL SELECT preserves duplicate results unless DISTINCT is specified.</dd></div><div><dt>Join · ⋈</dt><dd>Combines matching rows. Keep both join keys until the matching step finishes, even if neither key appears in the final output.</dd></div></dl></section><section class=\"reading\"><h2>Estimates and safe rewrites</h2><p>A heuristic is a practical rule such as filtering early. A cost-based optimizer also uses statistics such as row counts and value distributions to estimate the work. An index can make a selective lookup cheap. A scan can still be cheaper when a large share of rows qualifies.</p><p>Order matters around outer joins. A condition on the right input in WHERE can remove the NULL-filled rows that a left join preserves. Moving it into ON can keep those rows and change the answer. Only equivalent rewrites are valid optimizations.</p></section><section class=\"reading\"><h2>Apply the complete heuristic sequence</h2><p>Early filtering and projection are the starting point. Also replace unnecessary Cartesian products with joins, choose a useful join order and consider reusing repeated computations. Every rewrite must preserve the requested rows, NULL behavior and duplicate semantics.</p><div class=\"tbl-scroll\"><table><thead><tr><th scope=\"col\">Heuristic</th><th scope=\"col\">Worked transformation</th><th scope=\"col\">Condition</th></tr></thead><tbody><tr><td>Split and push selections</td><td>σ(city=&#x27;East&#x27; AND amount&gt;100)(Shop ⋈ Sale) → σ(city=&#x27;East&#x27;)(Shop) ⋈ σ(amount&gt;100)(Sale)</td><td>Each predicate references only its own input, and this is an inner join.</td></tr><tr><td>Replace product plus matching filter</td><td>σ(Shop.id=Sale.shop_id)(Shop × Sale) → Shop ⋈(Shop.id=Sale.shop_id) Sale</td><td>The predicate is the join condition. Avoid constructing every possible pair.</td></tr><tr><td>Project useful columns early</td><td>Keep Shop.id and Sale.shop_id, amount until the join; return amount afterward.</td><td>Retain every column needed by a later join, filter or output.</td></tr><tr><td>Reorder valid inner joins</td><td>Combine a highly filtered input with its matches before a large unrestricted input when estimated costs favor it.</td><td>Preserve all join predicates; intermediate cardinality and access paths affect cost.</td></tr><tr><td>Compute reusable expressions once</td><td>Reuse a repeated small aggregate instead of recomputing it.</td><td>The computation must be safe to reuse; storing a huge intermediate result may cost more.</td></tr></tbody></table></div><div class=\"out\"><strong>Worked answer</strong><p>Suppose Shop has 1000 rows and Sale has 10000. A Cartesian product has 10,000,000 pairs before matching. If each sale belongs to one shop, the key join has 10,000 matches. If 50 shops are East and each has 10 sales in this simplified uniform example, filtering Shop first leaves 500 matching sales. Actual estimates depend on the data distribution.</p></div></section><section class=\"reading\"><h2>Materialization and pipelining explain intermediate work</h2><p><strong>Materialization</strong> builds and stores an intermediate result before another operator consumes it. <strong>Pipelining</strong> passes rows to a consumer as they become available. These choices affect memory, temporary I/O, reuse and how soon the first result can appear.</p><div class=\"tbl-scroll\"><table><thead><tr><th scope=\"col\">Plan behavior</th><th scope=\"col\">Example</th><th scope=\"col\">Consequence</th></tr></thead><tbody><tr><td>Pipeline a filter into a join</td><td>Read one sale, keep it if qualifying, pass it onward.</td><td>Can avoid storing the entire filtered result and begin downstream work sooner.</td></tr><tr><td>Materialize a reused result</td><td>Build a small department-total result once, then read it in two places.</td><td>Storage costs something but may save repeated computation.</td></tr><tr><td>Blocking operator</td><td>A full sort needs its input before it can deliver globally sorted rows.</td><td>The pipeline may have to pause or materialize at this point.</td></tr></tbody></table></div><div class=\"out\"><strong>Worked answer</strong><p>For a single-use filter over one million rows, pipelining can avoid writing a million-row intermediate file. For a small result needed repeatedly, materialization may pay for itself. “Always pipeline” and “always materialize” are both poor rules.</p></div></section><section class=\"reading\"><h2>Statistics and physical algorithms finish the plan</h2><p>The optimizer needs more than the number of rows: table/page counts, row widths, distinct-value counts, NULL fractions, value distributions and index information help estimate work. Estimates can be wrong when statistics are stale or data is skewed.</p><div class=\"tbl-scroll\"><table><thead><tr><th scope=\"col\">Statistic / choice</th><th scope=\"col\">Solved example</th><th scope=\"col\">Implication</th></tr></thead><tbody><tr><td>Selectivity</td><td>50 expected matches / 1000 input rows = 0.05.</td><td>Estimated output cardinality is 50, not the whole table.</td></tr><tr><td>Skew</td><td>One city contains 800 of 1000 people, even though there are 20 cities.</td><td>Assuming 1000/20=50 per city badly underestimates that city.</td></tr><tr><td>Row width</td><td>Keeping a 4-byte key instead of an unused long description makes intermediate rows smaller.</td><td>Fewer bytes may need memory or temporary storage.</td></tr><tr><td>Physical join</td><td>A small outer table can probe an index; large equality inputs may suit a hash join; sorted inputs may suit merge.</td><td>Equivalent logical joins can have different execution costs.</td></tr></tbody></table></div><div class=\"out\"><strong>Worked answer</strong><p>A good plan returns the same answer with less expected work. EXPLAIN shows estimates; EXPLAIN ANALYZE executes the statement and reports observed execution statistics. For changing statements, use it only with an intentional test and rollback plan. The practice queries here are SELECT examples.</p></div></section>", "examples": ["<article class=\"case\"><h2>Read a small query tree from its leaves</h2><p>Shop has (1, East) and (2, West). Sale has (1, 12), (1, 15) and (2, 20), where each pair is (shop_id, amount).</p><figure class=\"plantree\"><figcaption>Read from the two inputs up to the result</figcaption><div class=\"root-node\">π amount</div><div class=\"join-node\">⋈ &nbsp; Sale.shop_id = Shop.id</div><div class=\"fork\"><div>Sale · (1,12), (1,15), (2,20)</div><div>Shop · σ East leaves id 1</div></div></figure><div class=\"tbl-scroll\"><table><thead><tr><th scope=\"col\">Operator</th><th scope=\"col\">Rows passed upward</th></tr></thead><tbody><tr><td>Filter Shop</td><td>(1, East)</td></tr><tr><td>Join on matching IDs</td><td>(1, 12), (1, 15)</td></tr><tr><td>Return amount</td><td>12, 15</td></tr></tbody></table></div><div class=\"out\"><strong>Result</strong><p>The East-region amounts are 12 and 15.</p></div><h3>Why it works</h3><ol class=\"reason\"><li>Filter Shop because region belongs to that table. The West shop drops out.</li><li>Keep id long enough to match the two sales for shop 1. Only then remove the key from the output.</li></ol></article>", "<article class=\"case\"><h2>Observe an equivalent rewrite in pgAdmin</h2><p>The two SELECT forms below describe the same East-region inner join. EXPLAIN displays the operators PostgreSQL plans to use.</p><p>To run this example, open a fresh Query Tool tab in pgAdmin with Auto-commit on. Its temporary tables belong to that tab.</p><div class=\"codehead\"><strong>PostgreSQL · pgAdmin</strong><button type=\"button\" data-copy>Copy code</button></div><pre><code>CREATE TEMP TABLE shop (id int PRIMARY KEY, region text);\nCREATE TEMP TABLE sale (shop_id int REFERENCES shop(id), amount int);\nINSERT INTO shop VALUES (1,&#x27;East&#x27;),(2,&#x27;West&#x27;);\nINSERT INTO sale VALUES (1,12),(1,15),(2,20);\nANALYZE shop;\nANALYZE sale;\nEXPLAIN (COSTS OFF)\nSELECT s.amount FROM sale s JOIN shop h ON h.id=s.shop_id\nWHERE h.region=&#x27;East&#x27;;\nEXPLAIN (COSTS OFF)\nSELECT s.amount FROM sale s\nJOIN (SELECT id FROM shop WHERE region=&#x27;East&#x27;) h ON h.id=s.shop_id;\nSELECT s.amount FROM sale s JOIN shop h ON h.id=s.shop_id\nWHERE h.region=&#x27;East&#x27; ORDER BY s.amount;</code></pre><div class=\"out\"><strong>Result</strong><p>The last SELECT returns 12 and 15. The two EXPLAIN outputs can be identical. Exact scan and join operators depend on statistics and the PostgreSQL version.</p></div><h3>Why it works</h3><ol class=\"reason\"><li>Run each EXPLAIN separately to see its output. Look for the filter associated with shop.</li><li>A written subquery does not require the engine to build a separate intermediate table. It may discover the same plan for either form.</li></ol></article>", "<article class=\"case\"><h2>See why a left-join filter can change the answer</h2><p>Club A has a paid member. Club B has none. The report must keep every club and count paid members.</p><div class=\"codehead\"><strong>PostgreSQL · pgAdmin</strong><button type=\"button\" data-copy>Copy code</button></div><pre><code>WITH club(id) AS (VALUES (&#x27;A&#x27;),(&#x27;B&#x27;)),\nmember(club_id,paid) AS (VALUES (&#x27;A&#x27;,true))\nSELECT c.id,COUNT(m.club_id) AS paid_count\nFROM club c LEFT JOIN member m\n  ON m.club_id=c.id AND m.paid\nGROUP BY c.id ORDER BY c.id;</code></pre><div class=\"out\"><strong>Result</strong><p>A | 1 and B | 0. Moving AND m.paid from ON to WHERE m.paid would drop B entirely.</p></div><h3>Why it works</h3><ol class=\"reason\"><li>ON restricts which member rows can match. The left join still creates an unmatched row for B.</li><li>WHERE filters after that row is created. Its m.paid is NULL, so it cannot pass WHERE m.paid. The two plans therefore answer different questions.</li></ol></article>"], "links": ["Query processing stages", "Relational algebra trees", "Safe rewrites"]}];
const drawings=["<figure class=\"blueboard\"><figcaption>One-to-many · Reader and Loan</figcaption><div class=\"er-pair\"><div class=\"entity\"><strong>Reader</strong><span>PK · reader_id</span><span>name</span></div><div class=\"edge\"><small>borrows</small><div><b>1</b><i></i><b>0..*</b></div></div><div class=\"entity\"><strong>Loan</strong><span>PK · loan_id</span><span>FK · reader_id</span></div></div><p>One Reader can have <b>zero or many Loans</b>. Each Loan belongs to <b>exactly one Reader</b>. The labels sit beside the entity being counted.</p></figure>","<figure class=\"blueboard\"><figcaption>One-to-one · Member and Pass</figcaption><div class=\"er-pair\"><div class=\"entity\"><strong>Member</strong><span>PK · member_id</span><span>name</span></div><div class=\"edge\"><small>holds</small><div><b>1</b><i></i><b>0..1</b></div></div><div class=\"entity\"><strong>Pass</strong><span>PK · pass_id</span><span>FK · member_id</span></div></div><p>One Member can hold <b>zero or one Pass</b>. Each Pass belongs to <b>exactly one Member</b>. A unique foreign key limits a member to one pass.</p></figure>","<figure class=\"blueboard\"><figcaption>Many-to-many · Student and Club</figcaption><div class=\"bridge\"><div class=\"entity\"><strong>Student</strong><span>PK · student_id</span></div><div class=\"entity\"><strong>Membership</strong><span>PK + FK · student_id</span><span>PK + FK · club_id</span><span>joined_on</span></div><div class=\"entity\"><strong>Club</strong><span>PK · club_id</span></div></div><div class=\"bridgelabel\">Student (1) ─ (0..*) Membership (0..*) ─ (1) Club</div><p>One Student can have many Membership rows. One Club can have many Membership rows. <b>Each Membership connects exactly one student to exactly one club.</b></p></figure>"];
const assessments=[{"terms": [{"term": "Database", "definition": "An organized collection of related facts that can be stored, found and changed.", "example": "A library database contains readers, books and loans."}, {"term": "Relational database", "definition": "A database that represents data in relations, usually displayed as tables, and relates rows using matching key values.", "example": "Reader and Loan are linked by reader_id."}, {"term": "Database management system (DBMS)", "definition": "Software that creates, queries, updates and controls access to a database while enforcing declared constraints.", "example": "PostgreSQL manages the library tables and rejects a loan whose required reader does not exist."}, {"term": "Relation / table", "definition": "A named collection of rows described by the same set of attributes. In the relational model, a relation is a set of tuples.", "example": "Every Reader row has reader_id and name columns. SQL tables can contain duplicate rows unless constraints prevent them."}, {"term": "Tuple / row", "definition": "One collection of attribute values describing one occurrence in a relation.", "example": "The row (7, 'Ada') describes one reader."}, {"term": "Attribute / column", "definition": "A named property whose values describe the rows in a relation.", "example": "name stores the reader name for each Reader row."}, {"term": "Domain", "definition": "The permitted set of values for an attribute, determined by its type and applicable rules.", "example": "A quantity domain can be whole numbers from 0 upward."}, {"term": "Schema", "definition": "The definition of a database structure, including tables, columns, types and constraints.", "example": "Reader(reader_id integer PRIMARY KEY, name text NOT NULL) describes structure. (7, 'Ada') is data in that structure."}, {"term": "Entity", "definition": "A distinguishable thing about which facts are recorded. An entity type groups similar things, and an entity occurrence is one individual thing.", "example": "Reader is an entity type. Ada with reader_id 7 is an occurrence."}, {"term": "Relationship", "definition": "An association between entity occurrences, governed by business rules.", "example": "A reader borrows a book through a recorded loan."}, {"term": "Primary key (PK)", "definition": "The chosen minimal set of columns that uniquely identifies every row. Every component must be non-NULL.", "example": "Reader.reader_id identifies one reader even when two readers share a name."}, {"term": "Candidate key", "definition": "A minimal set of attributes capable of uniquely identifying a row. One candidate key is chosen as the primary key.", "example": "A unique, required student_number and a unique, required institutional_email may each be candidate keys."}, {"term": "Composite primary key", "definition": "A primary key formed from two or more columns whose combination identifies a row.", "example": "(student_id, club_id) identifies a membership when each student can join a club once."}, {"term": "Foreign key (FK)", "definition": "A column or group of columns constrained to reference an eligible key in the same table or another table. Non-NULL references must match an existing referenced row.", "example": "Many Loan rows may carry reader_id 7 and all refer to Reader 7."}, {"term": "NULL", "definition": "A marker indicating that a value is missing, unknown or inapplicable.", "example": "A left-join result can have NULL for pass_id when a member has no pass."}, {"term": "Constraint", "definition": "A rule the DBMS enforces on permitted data or changes.", "example": "A foreign key rejects an unknown reader ID and CHECK(price >= 0) rejects a negative price."}, {"term": "NOT NULL", "definition": "A constraint requiring a column to contain a value in every row.", "example": "Loan.reader_id NOT NULL requires each loan to specify a reader."}, {"term": "UNIQUE", "definition": "A constraint preventing duplicate key values under the DBMS's NULL rules.", "example": "UNIQUE on Pass.member_id limits a member to one pass. Adding NOT NULL makes every pass identify its member."}, {"term": "Referential integrity", "definition": "The rule that a foreign key reference must point to an existing eligible referenced key, or use an allowed NULL.", "example": "A loan referencing nonexistent reader 99 is rejected."}, {"term": "ER diagram", "definition": "An entity–relationship diagram that depicts entities, their attributes and relationships with participation or cardinality rules.", "example": "Reader 1 linked to Loan 0..* means each loan has one reader and each reader can have zero or many loans."}, {"term": "Cardinality", "definition": "The allowed number of matching occurrences in a relationship, commonly expressed by maximum values such as one or many.", "example": "One department can have many employees."}, {"term": "Participation / minimum cardinality", "definition": "The minimum number of relationship matches required for an occurrence. Zero means optional participation and one means at least one is required.", "example": "A member may have zero passes, but each pass must have one member."}, {"term": "One-to-one relationship", "definition": "A relationship in which each occurrence on either side matches at most one on the other side. Minimum participation can differ at each end.", "example": "One member may have zero or one pass, and a pass belongs to exactly one member."}, {"term": "One-to-many relationship", "definition": "A relationship in which one occurrence on the first side may match many on the second, while each second-side occurrence matches at most one on the first.", "example": "A reader may have many loans, each belonging to one reader."}, {"term": "Many-to-many relationship", "definition": "A relationship in which occurrences on both sides may match multiple occurrences on the other side.", "example": "Students can join several clubs and clubs can have several students."}, {"term": "Linking / associative table", "definition": "A table that represents a relationship by storing foreign keys to the participating entities and any facts about their association.", "example": "Membership contains student_id, club_id and joined_on."}, {"term": "Relationship attribute", "definition": "A fact whose value belongs to a specific association between entities.", "example": "A tutor's rate for a subject belongs to Teaching(tutor_id, subject_id), because it can vary for each pair."}, {"term": "Simple attribute", "definition": "An attribute treated as one indivisible component at the chosen level of modeling.", "example": "A house_number is a single component; an address may be split into several components."}, {"term": "Composite attribute", "definition": "An attribute made of meaningful smaller components.", "example": "Address can contain street, city and postal_code. Composite describes its structure, not the number of values per person."}, {"term": "Single-valued attribute", "definition": "An attribute with at most one value for each entity occurrence.", "example": "A person has one recorded date_of_birth."}, {"term": "Multivalued attribute", "definition": "An attribute that can have several values for one entity occurrence.", "example": "A person can have two phone numbers. Store one number per PersonPhone row rather than a comma-separated list."}, {"term": "Derived attribute", "definition": "A value calculated from other stored facts.", "example": "Monthly salary can be calculated as annual_salary / 12."}, {"term": "Strong entity", "definition": "An entity that can exist independently of another entity in the modeled domain.", "example": "A Customer can exist before placing an order."}, {"term": "Weak entity", "definition": "An entity whose existence depends on an owner entity; it often uses its owner’s key plus a local identifier for identification.", "example": "OrderLine(order_id, line_no) needs an Order; line 1 of order 50 differs from line 1 of order 51."}, {"term": "Recursive relationship", "definition": "A relationship in which the same entity type participates in different roles.", "example": "Employee.manager_id references Employee.employee_id: one employee acts as manager of another."}, {"term": "Relationship degree", "definition": "How many participants a relationship connects: binary connects two, ternary connects three. A recursive relationship connects occurrences of the same entity type in different roles.", "example": "A supplier supplies a part to a project in a ternary relationship. Degree is different from one-to-many cardinality."}, {"term": "Multiplicity", "definition": "The permitted range of matching entity occurrences at a relationship endpoint.", "example": "0..* means zero or many; 1 means exactly one."}, {"term": "Parent and child tables", "definition": "In a foreign-key relationship, the parent provides the referenced key and the child stores the foreign key.", "example": "Order is parent of OrderLine. A table can be a parent in one relationship and a child in another."}], "essays": [{"title": "Model a delivery service", "prompt": "Customers may place many deliveries, including none. Each delivery belongs to exactly one customer. A driver can carry many deliveries, but a new delivery may have no driver yet. Store names, delivery ID and delivery date. Give tables, PKs, FKs, NULL rules and both directions of each relationship.", "answer": "Customer(customer_id PK, name)\nDriver(driver_id PK, name)\nDelivery(delivery_id PK, delivery_date, customer_id NOT NULL FK → Customer.customer_id, driver_id nullable FK → Driver.driver_id)\n\nOne customer has 0..many deliveries; each delivery has exactly one customer. One driver has 0..many deliveries; each delivery has 0..1 driver. Foreign keys belong in Delivery because it is the many side. A driver_id of NULL represents an unassigned delivery.", "criteria": ["Create all three tables and give each an identifying primary key.", "Require an existing customer and allow an absent driver using the correct foreign keys.", "State both endpoints of both relationships and explain why Delivery stores the links."]}, {"title": "Store different rates for the same subject", "prompt": "A tutor teaches several subjects and each subject has several tutors. A tutor sets one hourly rate per subject. Design the tables and explain where hourly_rate belongs. Give sample rows where two tutors charge different rates for the same subject.", "answer": "Tutor(tutor_id PK, name)\nSubject(subject_id PK, title)\nTeaching(tutor_id FK → Tutor, subject_id FK → Subject, hourly_rate, PK(tutor_id, subject_id))\n\nTeaching rows can be (7, 3, 25) and (8, 3, 30). Tutor 7 charges 25 for subject 3 and tutor 8 charges 30. Rate describes the tutor–subject pair. The composite key permits a tutor to teach several subjects while preventing duplicate rows for the same pair.", "criteria": ["Resolve the many-to-many relationship with a linking table and both foreign keys.", "Use the pair as its primary key and place hourly_rate on the linking table.", "Supply valid differing sample rates and explain why rate cannot depend on tutor or subject alone."]}, {"title": "Enforce an optional one-to-one link", "prompt": "An employee can have zero or one parking permit. Every permit must belong to exactly one existing employee. Write SQL table definitions and explain what happens if a second permit references the same employee or a permit references an unknown employee.", "answer": "CREATE TABLE Employee (employee_id integer PRIMARY KEY, name text NOT NULL);\nCREATE TABLE Permit (\n  permit_id integer PRIMARY KEY,\n  employee_id integer NOT NULL UNIQUE REFERENCES Employee(employee_id)\n);\n\nUNIQUE rejects a second permit for the same employee. The foreign key rejects an unknown employee. NOT NULL stops an unassigned permit. An employee can exist with no Permit row, so optional participation is allowed on the employee side.", "criteria": ["Define a PK for each table and a foreign key in Permit.", "Combine UNIQUE and NOT NULL on Permit.employee_id.", "Explain each rejected case and how an employee can have zero permits."]}], "choices": [["What does a relational database primarily organize?", ["Facts in tables of rows and columns", "Files arranged only by creation time", "Diagrams without stored data", "A single ordered list with no structure"], 0, "A relation groups rows with the same attributes. Keys can connect rows in different tables."], ["In a school model, which choice correctly identifies an entity, attribute and relationship?", ["Student; Course; student_name", "Student; student_name; Student enrolls in Course", "student_name; enrolls; Student", "enrolls; Student; student_name"], 1, "Student is a thing recorded, student_name describes it, and enrolling associates a student with a course."], ["What must a primary key guarantee?", ["Exactly one numeric column", "A link to a different table", "Unique identification with no NULL key components", "Alphabetical ordering of every query"], 2, "A primary key identifies each row uniquely and cannot contain NULL. It can consist of several columns."], ["Which statement about a foreign key is correct?", ["It must be unique in the referencing table", "It automatically sorts the parent table", "It must always be the child table's primary key", "It enforces valid references and may repeat across child rows"], 3, "Many loans can reference the same reader. The foreign key checks the reference, while UNIQUE and NOT NULL add separate rules."], ["How does a candidate key differ from the primary key?", ["A candidate key is a minimal possible identifier; one is chosen as primary", "A candidate key is allowed to identify several rows", "Only primary keys may contain text", "Every table must choose all candidate keys as primary keys"], 0, "There may be several minimal identifiers. The chosen one is the primary key; others are alternate candidate keys."], ["Where is the foreign key normally placed for Department to Employee, one-to-many?", ["Nowhere, because one-to-many needs no link", "In Employee, referencing Department", "In Department, storing all employee IDs in one value", "In both tables with both columns UNIQUE"], 1, "Each employee records its one department. Multiple employee rows can reference the same department."], ["How is a many-to-many Student–Club relationship mapped to relational tables?", ["Allow duplicate Student primary keys", "Put one student_id in Club and stop there", "Add Membership with foreign keys to Student and Club", "Put comma-separated club IDs in Student"], 2, "A linking table stores one association per row. It can hold facts such as joined_on that belong to the pair."], ["Every permit belongs to one employee; an employee has at most one permit. Which child-column rules express this?", ["Foreign key alone", "NOT NULL alone", "UNIQUE alone", "Foreign key, NOT NULL and UNIQUE on Permit.employee_id"], 3, "The foreign key requires an existing employee, NOT NULL requires a reference and UNIQUE prevents multiple permits for one employee."], ["A Reader 1 — Loan 0..* diagram means what?", ["Each loan has one reader; a reader can have zero or many loans", "Each reader must have exactly one loan", "Each loan can belong to many readers", "Every reader must have at least one loan"], 0, "The label beside Loan counts loans per reader. The label beside Reader counts readers per loan."], ["Where does a tutor's hourly rate for a particular subject belong if rates vary by tutor–subject pair?", ["In a column name", "In the TutorSubject linking table", "In Subject alone", "In Tutor alone"], 1, "The rate depends on the association, so two tutors can charge different rates for the same subject."], ["What does a composite primary key enforce for Membership(student_id, club_id)?", ["Each club_id must be unique by itself", "Both components must refer to the same table", "Each pair is unique, even though either component may repeat", "Each student_id must be unique by itself"], 2, "The combined values identify a membership. Student 7 can join clubs 3 and 4 without repeating the same pair."]]}, {"terms": [{"term": "Transaction", "definition": "A group of database operations treated as one unit of work with a defined start and completion or cancellation.", "example": "A transfer contains both a debit and a credit."}, {"term": "BEGIN", "definition": "A command that starts an explicit transaction.", "example": "BEGIN before two account updates groups them into one transaction."}, {"term": "COMMIT", "definition": "A command that successfully ends a transaction and makes its changes permanent under the configured durability guarantees.", "example": "Committing a transfer saves both new balances."}, {"term": "ROLLBACK", "definition": "A command that cancels the current transaction and undoes its changes.", "example": "A failed transfer restores both original balances."}, {"term": "Auto-commit", "definition": "A mode in which each standalone statement executes in its own transaction unless an explicit transaction has been started.", "example": "Two updates run without BEGIN may commit separately, leaving only the debit if the credit fails."}, {"term": "Atomicity", "definition": "The property that a transaction's changes take effect together or are undone together.", "example": "An order insert is undone when a required stock update in the same transaction fails."}, {"term": "Consistency", "definition": "The property that correct transactions preserve database constraints and applicable business invariants.", "example": "A correct transfer preserves total money and satisfies CHECK(balance >= 0)."}, {"term": "Isolation", "definition": "The property governing how overlapping transactions interact and which intermediate or concurrent effects they can observe.", "example": "Under Read Committed, another session cannot read an uncommitted debit."}, {"term": "Isolation level", "definition": "A configured set of guarantees that determines the concurrency effects transactions may observe.", "example": "Read Committed and Serializable provide different guarantees for repeated reads and concurrent updates."}, {"term": "Durability", "definition": "The property that a successfully committed transaction survives a subsequent crash under durable settings.", "example": "A saved sale can be recovered from durable records after power loss."}, {"term": "ACID", "definition": "The acronym for Atomicity, Consistency, Isolation and Durability, which describe reliable transaction behavior.", "example": "A transfer must complete as one unit, preserve rules, handle concurrent work appropriately and survive a crash after commit."}, {"term": "Business invariant", "definition": "A condition that correct application operations must preserve, including rules that may need multiple statements to enforce.", "example": "A transfer between two accounts preserves their combined balance."}, {"term": "Affected-row count", "definition": "The number of rows a statement actually changed, which can indicate whether its business goal succeeded.", "example": "An UPDATE reserving a seat changes zero rows when the seat is unavailable."}, {"term": "Guarded / conditional update", "definition": "An UPDATE whose WHERE condition tests a requirement as part of changing the row.", "example": "UPDATE Show SET seats=seats-1 WHERE id=3 AND seats>0 reserves only an available seat."}, {"term": "SAVEPOINT", "definition": "A named marker inside an open transaction to which later work can be partially rolled back.", "example": "Create a savepoint after adding a book and before adding optional gift wrap."}, {"term": "ROLLBACK TO SAVEPOINT", "definition": "An operation that undoes changes after a named savepoint while leaving the transaction open.", "example": "Undoing the wrap leaves the book pending until the caller commits."}, {"term": "TRY…CATCH (SQL Server)", "definition": "Error-handling blocks: TRY contains work that may fail; a catchable error sends control to CATCH. The construct itself does not start a transaction or guarantee rollback.", "example": "A failed credit jumps to CATCH, where the application rolls back an active transfer and reports the error."}, {"term": "XACT_STATE() (SQL Server)", "definition": "A function reporting the current transaction state: 0 means none, 1 means active and committable, and -1 means active but uncommittable.", "example": "IF XACT_STATE() <> 0 ROLLBACK TRANSACTION rolls back either kind of active transaction. State -1 cannot be committed."}, {"term": "THROW (SQL Server)", "definition": "A statement that raises an error; a bare THROW inside CATCH rethrows the error being handled.", "example": "THROW 50001, 'Transfer failed', 1; raises an error. After rollback, THROW; sends the original failure to the caller."}, {"term": "EXCEPTION block (PostgreSQL)", "definition": "The error-handling part of a PL/pgSQL block. A matching handler runs after database changes made inside that block are rolled back.", "example": "If the debit and credit are in one protected inner block and the credit fails, that block's debit is undone too."}, {"term": "RAISE EXCEPTION (PostgreSQL)", "definition": "A PL/pgSQL statement that raises an error and interrupts normal execution until a matching handler catches it, or the error reaches the caller.", "example": "RAISE EXCEPTION 'Not enough stock'; stops the ordinary success path. RAISE NOTICE only reports a message and does not raise a failure."}, {"term": "@@ROWCOUNT (SQL Server)", "definition": "The number of rows affected by the last statement; check or save it immediately after the statement of interest.", "example": "After a guarded UPDATE, IF @@ROWCOUNT <> 1 THROW 50002, 'Reservation failed', 1; rejects a missing reservation."}, {"term": "ERROR_MESSAGE() / SQLERRM", "definition": "The text of the error currently being handled in SQL Server CATCH / a PostgreSQL PL/pgSQL exception handler.", "example": "Display the failure reason after undoing the protected work so the caller can understand what happened."}, {"term": "RAISE NOTICE", "definition": "A PostgreSQL PL/pgSQL command that reports an informational message without itself raising an exception.", "example": "RAISE NOTICE 'Transfer cancelled'; displays a message; RAISE EXCEPTION interrupts the success path."}], "essays": [{"title": "Explain all four ACID properties", "prompt": "A transfer moves 30 from account A with 100 to account B with 40. Explain each ACID property using this operation. Distinguish the failure that atomicity handles from the failure durability handles.", "answer": "The successful balances are A=70 and B=70, preserving the total 140. Atomicity means a failure before completion undoes both changes, leaving 100 and 40. Consistency means the correct operation preserves the total and respects constraints such as nonnegative balances. Isolation controls interaction with concurrent transfers and readers. Durability means the committed 70 and 70 can survive a later crash. Atomicity handles incomplete work; durability preserves completed, committed work.", "criteria": ["Give all four ACID names with correct meanings.", "Connect each property to this transfer and calculate the correct balances and total.", "Distinguish cancellation before commit from recovery of committed changes after a crash."]}, {"title": "Trace two commits and a partial rollback", "prompt": "A value starts at 20. Transaction A adds 5 and commits. Transaction B adds 4, creates SAVEPOINT s, doubles the value, rolls back to s, adds 1 and commits. Show every intermediate value and the final value.", "answer": "A begins at 20, adds 5 to reach 25 and commits. B begins at 25, adds 4 to reach 29 and marks s. Doubling makes 58 inside B. ROLLBACK TO s restores 29 while B stays open. Adding 1 makes 30. COMMIT saves 30. If B instead ended with full ROLLBACK, the saved value would be 25.", "criteria": ["Trace 20 → 25 → 29 → 58 accurately.", "Explain that rollback to the savepoint returns to 29 and keeps B open.", "Finish at committed 30 and explain the contrast with a full rollback to 25."]}, {"title": "Explain and handle a failed transfer", "prompt": "Account A has 100 and account B has 40. A transfer of 30 debits A, but the credit fails before commit. Explain the correct balances and the roles of TRY, CATCH, COMMIT and ROLLBACK. Write a SQL Server transaction outline that checks both affected-row counts and reports an error. Then explain how PostgreSQL handles the same failure in a protected PL/pgSQL block. Assume the SQL Server code owns its transaction and no transaction is already open.", "answer": "The failed transfer must leave A=100 and B=40. Atomicity requires the debit to be undone when the credit fails. A successful transfer would commit A=70 and B=70. Previously committed changes are unaffected.\n\nSQL Server (assume Account(id, balance) already exists):\nBEGIN TRY\n  BEGIN TRANSACTION;\n  UPDATE Account SET balance=balance-30\n    WHERE id='A' AND balance>=30;\n  IF @@ROWCOUNT <> 1\n    THROW 50001, 'Source missing or insufficient funds', 1;\n  UPDATE Account SET balance=balance+30 WHERE id='B';\n  IF @@ROWCOUNT <> 1\n    THROW 50002, 'Recipient missing', 1;\n  COMMIT TRANSACTION;\nEND TRY\nBEGIN CATCH\n  IF XACT_STATE() <> 0 ROLLBACK TRANSACTION;\n  THROW;\nEND CATCH;\n\nTRY runs the success path. A catchable error skips the remaining TRY statements and enters CATCH. The handler rolls back an active transaction and rethrows the error so the caller knows the transfer failed. Zero rows affected is not automatically an SQL error, which is why both counts are checked.\n\nPostgreSQL has no T-SQL BEGIN TRY syntax. Put both changes inside one PL/pgSQL BEGIN…EXCEPTION…END block. A caught error automatically undoes that block’s database changes before its handler runs. Use RAISE; to rethrow in a handler when the caller must receive the failure. PL/pgSQL BEGIN groups code; SQL BEGIN starts a transaction.", "criteria": ["Explain both the failure balances and success balances using atomicity.", "Place both operations and row-count checks before COMMIT; handle rollback and rethrow on failure.", "Distinguish SQL Server TRY…CATCH from PostgreSQL block rollback and explain which work is undone."]}], "choices": [["Which ACID property makes a transaction all-or-nothing?", ["Consistency", "Atomicity", "Durability", "Isolation"], 1, "Atomicity prevents a partially completed transaction from being left in effect: either all its changes succeed together or they are undone."], ["Which ACID property concerns preserving constraints and business rules?", ["Durability", "Auto-commit", "Consistency", "Atomicity alone"], 2, "Correct transaction logic preserves rules such as nonnegative balances and a transfer's unchanged combined total."], ["Which ACID property concerns interaction between simultaneous transactions?", ["Durability", "Consistency alone", "Referential integrity", "Isolation"], 3, "Isolation governs which concurrent effects a transaction can observe and how conflicting work is controlled."], ["Which ACID property protects a committed result after a crash?", ["Durability", "Atomicity", "Isolation", "Input validation"], 0, "Durability concerns committed work surviving failure under the system's durability guarantees. Atomicity concerns incomplete work."], ["When should a transfer transaction COMMIT?", ["Whenever an error handler runs", "After every required operation and business check succeeds", "Immediately after debiting the sender", "At the beginning of TRY"], 1, "Committing after only the debit can make a partial transfer permanent. Check both updates before committing."], ["What does a full ROLLBACK undo?", ["Changes from transactions already committed", "Only the last SELECT statement", "Changes made by the current uncommitted transaction", "Every transaction since the database was created"], 2, "A rollback cancels the current unit of work. Previously committed transactions are separate and stay committed."], ["Why can auto-commit be dangerous for a transfer written as two independent UPDATE statements?", ["Auto-commit disables every constraint", "Auto-commit always rolls back both statements", "Auto-commit forbids UPDATE", "The debit may commit before the credit fails"], 3, "Each standalone statement may commit separately. An explicit transaction groups the debit and credit."], ["What does ROLLBACK TO SAVEPOINT do?", ["Undoes work after the savepoint while keeping the transaction open", "Commits all work before the savepoint", "Ends every transaction on the server", "Undoes previously committed work"], 0, "Earlier changes remain pending in the same transaction. A later COMMIT is still needed to save them."], ["What does SQL Server TRY…CATCH provide around a transaction?", ["PostgreSQL syntax for a savepoint", "Error-handling control flow; rollback must be handled appropriately", "An automatic COMMIT whenever TRY starts", "A guarantee that all errors leave no active transaction"], 1, "A catchable error transfers control to CATCH. The handler can inspect XACT_STATE(), roll back an active transaction and rethrow the error."], ["An UPDATE reserving stock affects zero rows without a SQL error. What should the transaction logic do?", ["Insert the purchase and ignore the row count", "Disable the stock constraint", "Treat this as an unsuccessful reservation and avoid committing a purchase", "Assume a row was reserved because SQL succeeded"], 2, "Zero affected rows can mean missing or insufficient stock. Business success requires checking the affected-row count."], ["When PostgreSQL PL/pgSQL catches an error in a BEGIN…EXCEPTION block, what happens to database changes made inside that block?", ["They are automatically committed", "All earlier committed transactions are undone", "The handler is skipped and the changes always remain", "They are rolled back before the matching handler runs"], 3, "The block acts as a subtransaction. Its database changes are undone; successful work outside the inner block is not automatically undone with it."]]}, {"terms": [{"term": "SQL", "definition": "Structured Query Language, used to define database objects, retrieve rows and change data.", "example": "SELECT name FROM Reader returns reader names."}, {"term": "DDL", "definition": "Data definition language, the SQL operations that create or change database structures.", "example": "CREATE TABLE and ALTER TABLE define or modify a table."}, {"term": "DML", "definition": "Data manipulation language, the SQL operations that work with data rows. SELECT is commonly included for querying, alongside INSERT, UPDATE and DELETE.", "example": "UPDATE Item SET price=4 WHERE id=1 changes a stored price."}, {"term": "CREATE TABLE", "definition": "A statement that defines a new table's columns, types and constraints.", "example": "CREATE TABLE Item(id int PRIMARY KEY, price int) defines an item structure."}, {"term": "ALTER TABLE", "definition": "A statement that changes the definition of an existing table.", "example": "ALTER TABLE Item ADD COLUMN name text adds a column."}, {"term": "DROP TABLE", "definition": "A statement that removes a table object and its rows, subject to dependency rules.", "example": "DROP TABLE Item removes the Item table."}, {"term": "CRUD", "definition": "The four basic operations Create, Read, Update and Delete for data records.", "example": "INSERT, SELECT, UPDATE and DELETE implement CRUD on table rows."}, {"term": "INSERT", "definition": "A statement that adds rows to a table.", "example": "INSERT INTO Item VALUES (1,4) adds one item."}, {"term": "SELECT", "definition": "A statement that retrieves specified expressions or columns from a row source.", "example": "SELECT name,price FROM Item returns two columns."}, {"term": "UPDATE", "definition": "A statement that changes matching rows. Without a restricting WHERE, every row is eligible.", "example": "UPDATE Item SET price=5 WHERE id=1 changes only item 1."}, {"term": "DELETE", "definition": "A statement that removes matching rows while retaining the table structure.", "example": "DELETE FROM Item WHERE id=1 removes item 1."}, {"term": "FROM", "definition": "The clause that specifies the table or other row source to query.", "example": "FROM Work starts with time-entry rows."}, {"term": "JOIN / inner join", "definition": "An operation that combines pairs of rows satisfying a join condition. An inner join retains matching pairs only.", "example": "Match Work.project_id to Project.id to attach each work entry to a project."}, {"term": "ON / join condition", "definition": "The condition specifying which rows match when inputs are joined.", "example": "ON Work.project_id=Project.id connects matching project IDs."}, {"term": "LEFT JOIN", "definition": "A join that retains every row of the left input and adds matching right rows, using NULLs when no right row matches.", "example": "Clubs with no members still appear in Club LEFT JOIN Member."}, {"term": "WHERE", "definition": "A clause that filters individual rows before grouping.", "example": "WHERE hours>=2 excludes one-hour work entries."}, {"term": "GROUP BY", "definition": "A clause that partitions rows into groups sharing the specified values so aggregates can be calculated per group.", "example": "GROUP BY project_id creates one group per project."}, {"term": "HAVING", "definition": "A clause that filters groups, often using aggregate results.", "example": "HAVING SUM(hours)>=6 keeps project groups with at least six total hours."}, {"term": "ORDER BY", "definition": "A clause that specifies result ordering. ASC sorts ascending and DESC descending.", "example": "ORDER BY total DESC,name ASC sorts largest totals first and breaks ties by name."}, {"term": "Aggregate function", "definition": "A function that computes one result from a set of input rows or values.", "example": "SUM(hours) adds hours in one project group."}, {"term": "COUNT(*)", "definition": "An aggregate that counts rows, including rows containing NULL values.", "example": "A left join produces one placeholder row for an empty club, which COUNT(*) counts as one."}, {"term": "COUNT(column)", "definition": "An aggregate that counts only non-NULL values of the given expression.", "example": "COUNT(Member.id) reports zero for a club with no matching member."}, {"term": "SUM", "definition": "An aggregate that adds non-NULL input values.", "example": "SUM(hours) over 2,6,NULL is 8."}, {"term": "AVG", "definition": "An aggregate that averages non-NULL input values.", "example": "AVG(hours) over 2,6,NULL is 4."}, {"term": "MIN / MAX", "definition": "Aggregates that find the smallest or largest non-NULL input value.", "example": "MIN(price) gives the lowest recorded price and MAX(price) the highest."}, {"term": "IS NULL", "definition": "A predicate that tests whether an expression has a missing value.", "example": "WHERE driver_id IS NULL finds unassigned deliveries."}, {"term": "BETWEEN", "definition": "An inclusive range predicate accepting both endpoints.", "example": "price BETWEEN 10 AND 20 accepts 10, 15 and 20."}, {"term": "LIKE", "definition": "A predicate matching a text pattern, where % matches any sequence and _ matches one character.", "example": "name LIKE 'A%' matches Ada and Alan."}, {"term": "IN", "definition": "A predicate testing membership in a list or subquery result, with SQL NULL rules applying.", "example": "region IN ('East','West') accepts either named region."}, {"term": "DISTINCT", "definition": "A SELECT modifier that removes duplicate result rows.", "example": "SELECT DISTINCT region FROM Shop returns each region once."}, {"term": "Alias", "definition": "A temporary name given to a table reference or result expression within a query.", "example": "SUM(hours) AS total names the calculated output column total."}, {"term": "WITH / common table expression (CTE)", "definition": "A named query result available to the statement that follows WITH.", "example": "WITH work(hours) AS (VALUES (2),(6)) provides two sample rows for a SELECT."}, {"term": "UNION", "definition": "Combines compatible query results and eliminates duplicate result rows.", "example": "Combining [1,2] and [2,3] with UNION produces the set 1,2,3; use ORDER BY for display order."}, {"term": "UNION ALL", "definition": "Combines compatible query results while retaining duplicates.", "example": "Combining [1,2] and [2,3] with UNION ALL retains both occurrences of 2."}, {"term": "Subquery", "definition": "A query nested inside another SQL statement.", "example": "Find staff whose branch_id is in a SELECT of branches in London."}, {"term": "Scalar subquery", "definition": "A subquery used where one value is expected: it must return one column and at most one row.", "example": "In PostgreSQL, two matching branch IDs cause a scalar-subquery error; zero rows yield NULL."}, {"term": "Correlated subquery", "definition": "A subquery that refers to a value from the current outer-query row.", "example": "EXISTS (SELECT 1 FROM Booking b WHERE b.customer_id=c.customer_id) tests bookings for each outer customer c."}, {"term": "EXISTS", "definition": "A predicate that is true when its subquery returns at least one row.", "example": "A customer passes EXISTS when at least one matching booking exists; the selected value itself is not important."}, {"term": "ANY / SOME", "definition": "A quantified comparison that is true if at least one subquery value makes the comparison true.", "example": "25 > ANY of 10 and 30 is true because 25 > 10. ANY over an empty result is false."}, {"term": "ALL", "definition": "A quantified comparison requiring the comparison to be true for every subquery value.", "example": "25 > ALL of 10 and 30 is false. ALL over an empty result is true."}, {"term": "CHECK constraint", "definition": "A row constraint that rejects a row when its condition is false. In PostgreSQL, a NULL/unknown result does not by itself violate CHECK.", "example": "CHECK(quantity > 0) rejects 0; add NOT NULL if missing quantities must also be rejected."}, {"term": "DEFAULT", "definition": "A value or expression used when an INSERT omits the column or explicitly requests DEFAULT.", "example": "status text DEFAULT 'new' supplies new for an omitted status; an explicitly supplied NULL is still NULL unless rejected."}, {"term": "CASE expression", "definition": "An expression that returns the result for the first matching WHEN condition, or the ELSE result.", "example": "CASE WHEN score >= 90 THEN 'A' ELSE 'Other' END returns A for 95."}, {"term": "View", "definition": "A named query that can be queried like a table; an ordinary view stores its query definition rather than a separate copy of its result rows.", "example": "A view can present staff counts per office. Aggregate views are not generally directly updatable."}], "essays": [{"title": "Define a table and perform CRUD", "prompt": "Create Product with a required ID primary key, required name and nonnegative integer price. Insert pen 1 at price 3 and notebook 2 at price 8. Change pen price to 4, delete notebook and show the remaining rows ordered by ID. Explain DELETE versus DROP.", "answer": "CREATE TABLE Product (id integer PRIMARY KEY, name text NOT NULL, price integer NOT NULL CHECK(price>=0));\nINSERT INTO Product VALUES (1,'Pen',3),(2,'Notebook',8);\nUPDATE Product SET price=4 WHERE id=1;\nDELETE FROM Product WHERE id=2;\nSELECT * FROM Product ORDER BY id;\n\nThe remaining row is (1, Pen, 4). DELETE removed notebook while leaving Product available. DROP TABLE Product would remove the table itself and its rows.", "criteria": ["Define the key, required values and nonnegative price constraint.", "Use correct INSERT, targeted UPDATE, targeted DELETE and ordered SELECT statements.", "State the final row and accurately distinguish DELETE from DROP."]}, {"title": "Keep empty departments in a report", "prompt": "Department(id,name) contains (1, Sales), (2, Support), (3, Design). Employee(id,dept_id) contains (10,1),(11,1),(12,3). Write a query showing every department name and its employee count, alphabetically. Explain the expected rows and why COUNT(*) is wrong for the empty department.", "answer": "SELECT d.name, COUNT(e.id) AS employee_count\nFROM Department d LEFT JOIN Employee e ON e.dept_id=d.id\nGROUP BY d.id,d.name\nORDER BY d.name;\n\nRows are Design | 1, Sales | 2, Support | 0. LEFT JOIN preserves Support using a row with NULL employee columns. COUNT(e.id) ignores that missing match, whereas COUNT(*) counts the placeholder row as one.", "criteria": ["Use Department on the left of a LEFT JOIN with the correct matching condition.", "Count non-NULL employee IDs and group by department before ordering.", "Give all three results and explain the placeholder-row counting error."]}, {"title": "Filter entries and then filter groups", "prompt": "Project(id,name) contains (1,Atlas),(2,Beacon),(3,Comet). Work(project_id,hours) contains (1,2),(1,6),(2,4),(2,1),(3,9). Write a report that totals entries of at least 2 hours, keeps totals of at least 6, and sorts total descending. Explain each stage and the result.", "answer": "SELECT p.name, SUM(w.hours) AS total\nFROM Project p JOIN Work w ON w.project_id=p.id\nWHERE w.hours>=2\nGROUP BY p.id,p.name\nHAVING SUM(w.hours)>=6\nORDER BY total DESC,p.name;\n\nThe join supplies project names. WHERE removes Beacon’s 1-hour entry. GROUP BY creates project groups; their sums are Atlas 8, Beacon 4, Comet 9. HAVING removes Beacon. ORDER BY yields Comet | 9 then Atlas | 8.", "criteria": ["Join correctly and filter individual entries with WHERE.", "Group and aggregate correctly, then filter aggregate totals with HAVING.", "Explain the logical stages and give the correctly ordered final rows."]}], "choices": [["Which set contains data-definition commands?", ["WHERE, HAVING, ORDER BY", "COMMIT, ROLLBACK, SAVEPOINT", "CREATE, ALTER, DROP", "SELECT, INSERT, UPDATE"], 2, "DDL describes or changes structures. CREATE adds an object, ALTER changes it and DROP removes it."], ["Which mapping correctly describes CRUD?", ["CREATE always creates rows; DROP always removes one row", "SELECT changes rows; UPDATE reads them", "COMMIT creates rows; ROLLBACK reads them", "INSERT creates rows; SELECT reads; UPDATE changes; DELETE removes rows"], 3, "CRUD concerns row operations. Creating a table is a structure operation rather than inserting a data row."], ["What is the essential difference between WHERE and HAVING?", ["WHERE filters rows before grouping; HAVING filters groups", "WHERE filters groups; HAVING sorts rows", "HAVING replaces JOIN", "WHERE can only be used with INSERT"], 0, "WHERE controls which source rows contribute. HAVING evaluates conditions on groups, often using aggregate values."], ["What does an INNER JOIN return?", ["All combinations regardless of its ON condition", "Matching row combinations satisfying the join condition", "Every left row even without a match", "Only rows with no match"], 1, "A matching pair becomes an output row. Unmatched rows are absent, and multiple matches can produce multiple output rows."], ["What does a LEFT JOIN preserve?", ["Only matched rows", "One row per table regardless of its contents", "Every left-side row, with NULL right-side values when unmatched", "Every right-side row only"], 2, "LEFT JOIN keeps unmatched left rows. A later WHERE condition rejecting NULL right values can remove them."], ["What does GROUP BY do?", ["Sorts all output automatically", "Removes the need for aggregate functions", "Changes every stored row to the group's total", "Forms groups with matching grouping values for aggregation"], 3, "GROUP BY defines groups; aggregate functions calculate a value per group. Use ORDER BY for guaranteed result ordering."], ["For values 10, NULL and 20, what are COUNT(*) and COUNT(value)?", ["3 and 2", "2 and 3", "3 and 3", "2 and 2"], 0, "COUNT(*) counts rows. COUNT(value) counts rows whose value is non-NULL."], ["Which predicate correctly tests for a missing value?", ["value LIKE NULL", "value IS NULL", "value = NULL", "value <> NULL"], 1, "NULL represents missing or unknown information. Ordinary comparisons with NULL yield unknown, so use IS NULL."], ["What guarantees a requested output order?", ["The order used in INSERT", "GROUP BY in every DBMS", "ORDER BY with appropriate sort expressions", "A primary key by itself"], 2, "Tables and query results have no guaranteed display order without ORDER BY. Include a tie-breaker when equal values need a consistent order."], ["What is the danger of UPDATE Employee SET salary = 50000 without WHERE?", ["It updates only the first row", "It updates no rows", "It automatically deletes the table", "It updates every row in Employee"], 3, "Without a row filter, all target rows are eligible. DELETE without WHERE similarly targets every row."], ["Which description of DISTINCT, UNION and UNION ALL is correct?", ["DISTINCT removes duplicate result rows; UNION removes duplicates; UNION ALL retains them", "All three always retain duplicates", "UNION ALL removes duplicates while UNION retains them", "DISTINCT removes NULL rows only"], 0, "SQL normally permits duplicate result rows. These operators differ in whether duplicates are eliminated."]]}, {"terms": [{"term": "Stored procedure", "definition": "A named collection of instructions stored in the database and executed by calling it.", "example": "GetStudentsByDepartment applies the same lookup logic for different department IDs."}, {"term": "Input parameter", "definition": "A named, typed slot in a procedure definition that receives a value from its caller.", "example": "p_dept integer is the parameter in a department lookup."}, {"term": "Argument", "definition": "The actual value supplied for a parameter in a particular call.", "example": "In a call for department 10, the argument is 10."}, {"term": "Local variable", "definition": "A named value that exists within a procedure or block and can change during that execution.", "example": "result starts at 1 and holds the growing factorial product."}, {"term": "DECLARE / initialization", "definition": "Declaration introduces a local variable and its type; initialization supplies its starting value.", "example": "DECLARE result int := 1 in PL/pgSQL initializes the product to 1."}, {"term": "IF / ELSE", "definition": "Conditional control flow that chooses a branch based on whether a condition is true.", "example": "Reject a nonpositive quantity in the IF branch and continue valid work otherwise."}, {"term": "WHILE loop", "definition": "A control structure that repeats its body while a condition is true.", "example": "WHILE i<=n repeats a factorial multiplication until i exceeds n."}, {"term": "Loop termination", "definition": "The condition and progress that eventually stop a loop.", "example": "Increasing i by 1 on every pass makes i<=n become false."}, {"term": "Input validation", "definition": "Checking arguments against required business and type-related limits before using them.", "example": "Reject a NULL, negative or too-large factorial input."}, {"term": "Exception / error handling", "definition": "Detecting and reporting a failed operation and ensuring the surrounding work ends consistently.", "example": "A procedure raises an exception for insufficient stock and the caller rolls back its transaction."}, {"term": "T-SQL", "definition": "Transact-SQL, SQL Server's SQL dialect with procedural extensions.", "example": "T-SQL uses @dept parameters and EXEC for a procedure call."}, {"term": "PL/pgSQL", "definition": "PostgreSQL's procedural language for routines and blocks containing SQL and control flow.", "example": "A LANGUAGE plpgsql procedure uses IF, LOOP and RAISE EXCEPTION."}, {"term": "EXEC / CALL", "definition": "Commands that invoke stored procedures in their respective dialects.", "example": "SQL Server uses EXEC GetStudents @dept=10; PostgreSQL uses CALL get_students(10,...)."}, {"term": "Cursor / refcursor", "definition": "A cursor is a handle for reading query result rows. PostgreSQL refcursor is a type used to pass a cursor's name.", "example": "A procedure opens the cursor named matches for department 10."}, {"term": "OPEN / FETCH", "definition": "OPEN associates a cursor with a query; FETCH retrieves rows through that cursor.", "example": "FETCH ALL FROM matches reads all rows from the opened student cursor."}, {"term": "THROW / RAISE EXCEPTION", "definition": "Statements that signal an error in SQL Server and PostgreSQL respectively.", "example": "RAISE EXCEPTION 'Insufficient stock' stops an invalid reservation."}, {"term": "TRY / CATCH", "definition": "SQL Server control flow that runs protected work in TRY and transfers to CATCH when a catchable error occurs.", "example": "CATCH can roll back an active transfer transaction and rethrow the error."}, {"term": "FOUND", "definition": "A PL/pgSQL Boolean status variable set by certain statements to indicate whether rows were found or affected.", "example": "After a guarded UPDATE changes zero rows, IF NOT FOUND detects the failed reservation."}, {"term": "Factorial", "definition": "The product of whole numbers from 1 through n, with 0! defined as 1.", "example": "4! equals 1×2×3×4 = 24."}, {"term": "Integer overflow", "definition": "A result exceeding the range of the integer data type used to store it.", "example": "A signed 32-bit integer holds 12! but cannot hold 13!, so the example rejects inputs above 12."}, {"term": "Transaction ownership", "definition": "Responsibility for starting and completing a transaction around a procedure call.", "example": "A caller can run BEGIN, CALL, then COMMIT on success or ROLLBACK after failure."}, {"term": "GO batch separator", "definition": "A separator recognized by SQL Server client tools to send statements as distinct batches.", "example": "GO separates CREATE PROCEDURE from a subsequent EXEC in a SQL Server script."}, {"term": "SET assignment (T-SQL)", "definition": "Assigns a value to a variable.", "example": "DECLARE @n int; SET @n = 3; gives @n the value 3."}, {"term": "PRINT / RAISE NOTICE", "definition": "Commands for informational messages in SQL Server / PostgreSQL; they do not themselves signal a transaction failure.", "example": "PRINT 'Invalid quantity' displays a message but does not automatically undo an earlier UPDATE."}, {"term": "RETURN (T-SQL procedure)", "definition": "Ends the current procedure, optionally supplying an integer return status; it does not itself commit or roll back an open transaction.", "example": "RETURN after a message exits the procedure, so transaction cleanup must already be handled appropriately."}, {"term": "Temporary table", "definition": "A table intended for temporary intermediate data, with visibility and lifetime determined by the DBMS and its creation context.", "example": "SQL Server #Work is local to its session/scope; ##Work is global and can be visible to other sessions. PostgreSQL CREATE TEMP TABLE makes a session-local table by default."}, {"term": "INSERT…SELECT", "definition": "An INSERT that takes its input rows from a SELECT query.", "example": "INSERT INTO Archive(id,name) SELECT id,name FROM Incoming copies the selected rows into Archive."}, {"term": "Trigger", "definition": "A database routine invoked automatically for a specified event, such as an INSERT, rather than called explicitly as an ordinary procedure.", "example": "A validation trigger can reject an invalid new row. A rule counting clients also needs concurrency-safe enforcement."}, {"term": "Searched CASE / ordered conditions", "definition": "A CASE expression checks WHEN predicates in order and uses the first true branch.", "example": "For 31 miles, testing miles>30 before miles>25 applies the 10 surcharge rather than the 8 surcharge."}, {"term": "EXISTS (procedure validation)", "definition": "Tests whether a query finds at least one qualifying row.", "example": "IF EXISTS (SELECT 1 FROM Department WHERE id=@dept) can check a department, but a separate later operation may still need concurrency-safe constraints."}, {"term": "@@ROWCOUNT (procedure check)", "definition": "The affected-row count of the last statement in SQL Server; inspect it immediately after the relevant statement.", "example": "A stock UPDATE affecting zero rows must not be treated as a successful reservation."}], "essays": [{"title": "Write a parameterized lookup", "prompt": "Students(student_id, student_name, department_id) stores students. Write a SQL Server procedure named GetStudentsByDepartment that takes a department ID, rejects NULL, returns matching rows ordered by student ID, and show the call for department 10. Explain column-versus-parameter comparison.", "answer": "CREATE PROCEDURE GetStudentsByDepartment @dept INT\nAS\nBEGIN\n  IF @dept IS NULL THROW 50001, 'Department is required', 1;\n  SELECT s.student_id,s.student_name,s.department_id\n  FROM Students s WHERE s.department_id=@dept\n  ORDER BY s.student_id;\nEND;\nGO\nEXEC GetStudentsByDepartment @dept=10;\n\n@dept is the input parameter and 10 is the argument. Comparing s.department_id to @dept filters by the supplied department. Comparing the column to itself would accept every non-NULL department.", "criteria": ["Define a named procedure with a typed parameter and reject NULL.", "Filter the qualified column against the parameter and order the returned rows.", "Show the call for 10 and explain parameter, argument and the self-comparison error."]}, {"title": "Build and trace a factorial loop", "prompt": "Write a PostgreSQL DO block that computes factorial for n=4, validates n is between 0 and 12 inclusive, and reports the answer with RAISE NOTICE. Trace i and product. Explain the zero case and the upper bound.", "answer": "DO $$\nDECLARE n int := 4; i int := 1; product int := 1;\nBEGIN\n  IF n IS NULL OR n<0 OR n>12 THEN\n    RAISE EXCEPTION 'Use 0 through 12';\n  END IF;\n  WHILE i<=n LOOP\n    product := product*i;\n    i := i+1;\n  END LOOP;\n  RAISE NOTICE 'Factorial = %', product;\nEND; $$;\n\nThe products after i=1,2,3,4 are 1,2,6,24. i then becomes 5 and the loop stops. With n=0 no multiplication runs and product stays 1. The upper bound avoids overflow of the int product because 13! exceeds its range.", "criteria": ["Validate NULL and range and initialize counter and product correctly.", "Provide a terminating loop and correct trace to 24.", "Explain 0! and integer overflow, and show how the result is reported."]}, {"title": "Validate and reserve stock", "prompt": "Stock(id,qty) has (1,3). Describe or write a PostgreSQL procedure that accepts a positive quantity, atomically reduces stock if enough remains, and raises an error when zero rows are updated. Show caller transaction handling for requests of 2 and then 4.", "answer": "Validate wanted IS NOT NULL AND wanted>0. Execute UPDATE Stock SET qty=qty-wanted WHERE id=1 AND qty>=wanted. Immediately test FOUND; if false, RAISE EXCEPTION 'Insufficient stock'. The caller runs BEGIN, CALL reserve(2), COMMIT and stock becomes 1. A second BEGIN/CALL reserve(4) raises an error. The caller then executes ROLLBACK and stock remains 1. The procedure need not commit independently.", "criteria": ["Reject NULL and nonpositive input before changing data.", "Use a guarded UPDATE and detect zero affected rows immediately with FOUND.", "Give both transaction outcomes and preserve the earlier committed reservation."]}], "choices": [["What is a stored procedure?", ["A temporary copy of every table", "An index that automatically changes SQL", "A single value that cannot execute statements", "A named routine stored in the database and invoked to perform operations"], 3, "A procedure packages reusable database operations and may accept parameters, validate inputs and control flow."], ["What is an input parameter for?", ["Passing a caller-supplied value into a routine", "Permanently replacing a column's data type", "Automatically committing every statement", "Naming the output file"], 0, "A department parameter lets one routine retrieve different departments without rewriting its SQL."], ["How does a local variable differ from an input parameter?", ["They are both table indexes", "A local variable holds working state inside the routine; an input parameter receives a call value", "Variables always persist after the routine ends", "Input parameters must be primary keys"], 1, "A loop counter or running total is local working state. A caller supplies input parameters when invoking the routine."], ["Which choice correctly matches invocation syntax?", ["SQL Server requires CALL for T-SQL procedures", "Both require CREATE for every invocation", "SQL Server uses EXEC; PostgreSQL procedures use CALL", "PostgreSQL uses EXEC for all procedures"], 2, "CREATE defines a routine. EXEC invokes a T-SQL procedure; CALL invokes a PostgreSQL procedure."], ["What is the purpose of IF…ELSE?", ["Guaranteeing that every branch runs", "Sorting a query result", "Automatically starting a transaction", "Choosing which statements run based on a condition"], 3, "IF runs its branch when the condition is true; ELSE provides an alternative path. NULL conditions need explicit handling when relevant."], ["What must a WHILE loop normally include to terminate?", ["Progress toward making its condition false", "An extra table for every iteration", "COMMIT after every statement", "A primary key named counter"], 0, "If a true condition never changes, the loop may continue forever. Counters and loop bounds should be traced together."], ["Why validate a quantity before changing stock?", ["To make SQL Server syntax valid in PostgreSQL", "To reject invalid requests such as NULL or nonpositive quantities before modifying data", "To remove the need for constraints", "To guarantee all concurrent operations succeed"], 1, "Input validation rejects unsuitable requests early. Constraints, guarded updates and transaction checks are still needed."], ["What does a statement such as IF EXISTS (SELECT …) test?", ["Whether a table has exactly one column", "Whether the last transaction committed", "Whether the query produces at least one row", "Whether all returned numeric values are positive"], 2, "EXISTS is true if any qualifying row exists. It is useful for presence checks, though concurrent changes may require stronger safeguards."], ["Why pair TRY…CATCH with transaction management in a multi-step procedure?", ["To make CATCH run after every successful statement", "To eliminate the need for COMMIT", "To make failed updates count as successful", "To handle catchable errors and undo incomplete work before reporting failure"], 3, "A transaction groups the steps. Error handling determines the failure path, including rollback and error reporting."], ["In SQL Server, why check @@ROWCOUNT immediately after a guarded UPDATE?", ["To verify that the intended row actually changed before another statement overwrites the count", "To count every row in the database", "To count active transactions", "To obtain the previous error's message"], 0, "A valid UPDATE can affect zero rows. The immediately associated row count distinguishes a completed reservation from a missing or unavailable item."], ["Which statement correctly distinguishes procedures and functions in PostgreSQL?", ["Procedures and functions have identical transaction rules", "Procedures use CALL; a table-returning function can be queried with SELECT", "Every procedure can return arbitrary SELECT rows directly like SQL Server", "A function is invoked only with EXEC"], 1, "A PostgreSQL table-returning function works in SELECT. Procedures commonly use output parameters or cursors; their transaction-control rules differ from functions."]]}, {"terms": [{"term": "Concurrency", "definition": "Overlap in the execution of multiple transactions against a database.", "example": "Two shoppers try to reserve the final item at the same time."}, {"term": "Schedule", "definition": "The ordered sequence of read, write and other operations from transactions, preserving the order within each transaction.", "example": "A reads X, B reads X, A writes X, B writes X is an interleaved schedule."}, {"term": "Lost update", "definition": "An anomaly in which one write overwrites another transaction's change without incorporating it.", "example": "Two sessions read score 10 and each writes 11, losing one of two intended increments."}, {"term": "Dirty read", "definition": "Reading a value written by another transaction that has not committed.", "example": "A report uses an uncommitted balance of 70 that later rolls back to 100."}, {"term": "Inconsistent analysis", "definition": "Combining observations from different database states into a misleading result.", "example": "Reading account A before a transfer and B after it produces a total that never existed."}, {"term": "Atomic increment", "definition": "A single update that increases a value based on the row value as part of the database operation.", "example": "UPDATE Score SET points=points+1 avoids computing two stale replacement values in client code."}, {"term": "Snapshot", "definition": "A consistent view of data for a statement or transaction, according to the isolation behavior of the DBMS.", "example": "One SELECT can calculate both account balances from the same statement snapshot."}, {"term": "Read Committed", "definition": "An isolation level that prevents dirty reads but can allow different statements in one transaction to see different committed states.", "example": "Two separate balance reads can observe values from before and after a transfer."}, {"term": "Serial schedule", "definition": "A schedule in which one transaction finishes before the next transaction starts.", "example": "Execute all of A, then all of B."}, {"term": "Serializable schedule", "definition": "A schedule whose observable result is equivalent, under the chosen equivalence definition, to some serial execution.", "example": "Interleaved operations on independent data can be equivalent to A followe
